<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>petdex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15161b">
    <meta name="description" content="Everything you need to look after the menagerie — feeding, meds, quirks, and the rhythm of a day in the house.">

    <!-- Canonical -->
    <link rel="canonical" href="https://b38tn1k.github.io/pets/">

    <!-- Open Graph (iMessage, Slack, Discord, FB, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="petdex">
    <meta property="og:title" content="petdex">
    <meta property="og:description" content="Everything you need to look after the menagerie — feeding, meds, quirks, and the rhythm of a day in the house.">
    <meta property="og:url" content="https://b38tn1k.github.io/pets/">
    <!-- Swap this filename to change the link-preview thumbnail -->
    <meta property="og:image" content="https://b38tn1k.github.io/pets/images/boomba.jpeg">
    <meta property="og:image:alt" content="One of the resident creatures.">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="petdex">
    <meta name="twitter:description" content="A sitter briefing for the resident creatures.">
    <meta name="twitter:image" content="https://b38tn1k.github.io/pets/images/boomba.jpeg">

    <!-- iOS / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="petdex">
    <link rel="apple-touch-icon" href="https://b38tn1k.github.io/pets/images/boomba.jpeg">

    <link rel="icon" href="/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #15161b;
            --surface: #1f212a;
            --surface-2: #181a21;
            --surface-hover: #242630;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.16);

            --ink: #e8e6e2;
            --ink-soft: rgba(232, 230, 226, 0.72);
            --ink-mute: rgba(232, 230, 226, 0.48);
            --ink-fade: rgba(232, 230, 226, 0.28);

            --accent: #e25858;
            --accent-soft: rgba(226, 88, 88, 0.12);

            /* timeline kind accents — muted, similar luminance */
            --k-chickens: #d4a85a;
            --k-meds:     #e25858;
            --k-cats:     #c47896;
            --k-dogs:     #b88a68;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html { background: var(--bg); }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: var(--bg);
            min-height: 100svh;
            color: var(--ink);
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .wrap {
            max-width: 940px;
            margin: 0 auto;
            padding: 24px 18px;
            padding-top: calc(24px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            display: flex; flex-direction: column; gap: 22px;
        }

        /* ---- Header ---- */
        .header { padding: 6px 2px 2px; }
        .eyebrow {
            font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.012em;
            margin-bottom: 6px;
        }
        .header p {
            color: var(--ink-soft);
            font-size: 14.5px;
            max-width: 60ch;
        }

        /* ---- Panel ---- */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 18px 20px;
        }
        .section-label {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-mute);
            margin-bottom: 12px;
        }
        .panel-sub {
            font-size: 13px;
            color: var(--ink-mute);
            font-style: italic;
            line-height: 1.5;
            margin: -6px 0 14px;
            max-width: 60ch;
        }

        /* ---- House Notes ---- */
        .house-notes {
            display: flex; flex-direction: column; gap: 16px;
        }
        .notes-group { display: flex; flex-direction: column; gap: 8px; }
        .notes-group-title {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .notes-group ul {
            list-style: none;
            display: flex; flex-direction: column; gap: 7px;
        }
        .notes-group li {
            font-size: 14.5px;
            line-height: 1.55;
            color: var(--ink-soft);
            padding-left: 16px;
            position: relative;
        }
        .notes-group li::before {
            content: '';
            position: absolute;
            left: 0; top: 9px;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--ink-fade);
        }

        /* ---- Vet cards ---- */
        .vet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .vet-card {
            position: relative;
            display: block;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--ink);
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .vet-card:hover {
            border-color: var(--border-strong);
            background: rgba(226, 88, 88, 0.06);
        }
        .vet-card-label {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .vet-card-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--ink);
            line-height: 1.4;
            padding-right: 22px;
        }
        .vet-card-arrow {
            position: absolute;
            top: 12px; right: 14px;
            color: var(--ink-mute);
            font-size: 15px;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .vet-card:hover .vet-card-arrow {
            color: var(--accent);
            transform: translate(2px, -2px);
        }
        @media (max-width: 520px) {
            .vet-grid { grid-template-columns: 1fr; }
        }

        /* ---- Day Timeline ---- */
        .timeline {
            list-style: none;
            display: flex; flex-direction: column;
            gap: 6px;
        }
        .tl-row {
            display: grid;
            grid-template-columns: 116px 1fr;
            gap: 14px;
            align-items: stretch;
        }
        .tl-time {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--ink-mute);
            padding-top: 13px;
            text-align: right;
        }
        .tl-event {
            font-size: 14.5px;
            color: var(--ink);
            padding: 10px 14px;
            background: var(--surface-2);
            border-radius: 10px;
            border-left: 3px solid var(--ink-mute);
            line-height: 1.55;
        }
        .tl-row[data-kind="chickens"] { --row-color: var(--k-chickens); }
        .tl-row[data-kind="meds"]     { --row-color: var(--k-meds); }
        .tl-row[data-kind="cats"]     { --row-color: var(--k-cats); }
        .tl-row[data-kind="dogs"]     { --row-color: var(--k-dogs); }
        .tl-row[data-kind] .tl-time   { color: var(--row-color); }
        .tl-row[data-kind] .tl-event  { border-left-color: var(--row-color); }

        .tl-bullets {
            list-style: none;
            display: flex; flex-direction: column;
            gap: 4px;
        }
        .tl-bullets li {
            padding-left: 14px;
            position: relative;
            color: var(--ink-soft);
            font-size: 14px;
        }
        .tl-bullets li::before {
            content: '';
            position: absolute;
            left: 0; top: 9px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--ink-fade);
        }

        /* Clickable timeline text — looks like a link */
        .tl-link {
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: rgba(226, 88, 88, 0.45);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            transition: text-decoration-color 0.15s ease;
            outline: none;
        }
        .tl-link:hover,
        .tl-link:focus-visible {
            text-decoration-color: var(--accent);
        }

        /* Timeline detail modal — pet blocks */
        .tl-detail-pet {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .tl-detail-pet:last-child { margin-bottom: 0; }
        .tl-detail-pet-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .tl-detail-pet-thumb {
            width: 44px; height: 44px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--surface);
        }
        .tl-detail-pet-thumb img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .tl-detail-pet-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
        }
        .tl-detail-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 14px;
            padding-right: 40px;
            line-height: 1.35;
        }

        /* ---- Card Grid ---- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
        }
        .card:hover {
            background: var(--surface-hover);
            border-color: var(--border-strong);
        }
        .card:active { transform: scale(0.985); }

        .card-image {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            background: var(--surface-2);
            margin-bottom: 10px;
        }
        .card-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-warning {
            position: absolute;
            top: 10px; right: 10px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.14em;
            padding: 5px 11px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .card-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: -0.005em;
            margin-bottom: 3px;
        }
        .card-name .aka {
            font-size: 12px;
            font-weight: 400;
            color: var(--ink-mute);
            margin-left: 5px;
        }
        .card-tagline {
            font-size: 13.5px;
            color: var(--ink-soft);
            line-height: 1.45;
        }

        /* ---- Badges (modal only) ---- */
        .badge {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.08em;
            padding: 4px 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink-soft);
            text-transform: lowercase;
        }

        /* ---- Modal ---- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 24px 16px;
            padding-top: calc(24px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            overflow-y: auto;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 580px;
            width: 100%;
            padding: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 14px; right: 14px;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            color: var(--ink);
            border: 1px solid var(--border-strong);
            font-size: 20px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
            line-height: 1;
            font-family: inherit;
        }
        .modal-close:hover { background: rgba(0, 0, 0, 0.7); }

        .modal-hero {
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background: var(--surface-2);
            margin-bottom: 14px;
        }
        .modal-hero img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.012em;
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .modal-aka {
            font-size: 13px;
            color: var(--ink-mute);
            margin-bottom: 10px;
            font-style: italic;
        }
        .modal-tagline {
            font-size: 15px;
            color: var(--ink-soft);
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .modal-badges {
            display: flex; flex-wrap: wrap; gap: 5px;
            margin-bottom: 18px;
        }

        /* ---- Stats ---- */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .stat {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 8px 10px;
            text-align: center;
        }
        .stat-label {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-mute);
            margin-bottom: 8px;
        }
        .stat-bar { display: flex; justify-content: center; gap: 4px; }
        .stat-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }
        .stat-dot.on { background: var(--ink-soft); }
        .stat[data-key="energy"] .stat-dot.on { background: var(--k-dogs); }
        .stat[data-key="chill"]  .stat-dot.on { background: var(--k-cats); }
        .stat[data-key="spice"]  .stat-dot.on { background: var(--accent); }

        /* ---- Sections in modal ---- */
        .modal-section {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-left: 3px solid var(--ink-mute);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }
        .modal-section[data-kind="feeding"] { border-left-color: var(--k-dogs); }
        .modal-section[data-kind="meds"]    { border-left-color: var(--k-meds); }
        .modal-section[data-kind="quirks"]  { border-left-color: var(--k-cats); }
        .modal-section[data-kind="warning"] { border-left-color: var(--k-chickens); }

        .modal-section h3 {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--ink-mute);
            margin-bottom: 10px;
        }
        .modal-section p, .modal-section li {
            font-size: 14.5px;
            color: var(--ink);
            line-height: 1.55;
        }
        .modal-section ul {
            list-style: none;
            display: flex; flex-direction: column; gap: 6px;
        }
        .modal-section li {
            padding-left: 14px;
            position: relative;
            color: var(--ink-soft);
        }
        .modal-section li::before {
            content: '';
            position: absolute;
            left: 0; top: 9px;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--ink-fade);
        }

        .field-grid { display: grid; gap: 10px; }
        .field {
            display: grid;
            grid-template-columns: 78px 1fr;
            gap: 12px;
            align-items: baseline;
        }
        .field-label {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-mute);
            padding-top: 2px;
        }
        .field-value {
            font-size: 14.5px;
            color: var(--ink);
            line-height: 1.55;
        }

        .footer {
            text-align: center;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--ink-fade);
            padding: 12px 8px 4px;
        }

        @media (max-width: 520px) {
            .wrap { padding: 18px 14px; gap: 18px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
            .card-name { font-size: 16px; }
            .tl-row { grid-template-columns: 88px 1fr; gap: 10px; }
            .tl-time { font-size: 10px; }
            .modal { padding: 18px; }
            .modal-title { font-size: 22px; }
            .field { grid-template-columns: 64px 1fr; gap: 10px; }
            .header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <h1>petdex</h1>
            <p id="introLine">loading the menagerie&hellip;</p>
        </div>

        <div class="panel" id="houseNotesPanel" style="display:none;">
            <div class="section-label">House Notes</div>
            <div class="house-notes" id="houseNotesList"></div>
        </div>

        <div class="panel" id="vetPanel" style="display:none;">
            <div class="section-label">Vet Care</div>
            <div class="vet-grid" id="vetList"></div>
        </div>

        <div class="panel" id="timelinePanel" style="display:none;">
            <div class="section-label">A Day in the Life</div>
            <div class="panel-sub" id="timelineNote" style="display:none;"></div>
            <ol class="timeline" id="timelineList"></ol>
        </div>

        <div class="grid" id="petGrid"></div>

        <div class="footer">tap a card for the briefing</div>
    </div>

    <div class="modal-overlay" id="tlDetailOverlay">
        <div class="modal" id="tlDetailModal">
            <button class="modal-close" id="tlDetailClose" aria-label="Close">&times;</button>
            <div class="tl-detail-title" id="tlDetailTitle"></div>
            <div id="tlDetailBody"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
            <div class="modal-hero"><img id="modalImg" alt=""></div>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-aka" id="modalAka"></div>
            <div class="modal-tagline" id="modalTagline"></div>
            <div class="modal-badges" id="modalBadges"></div>
            <div class="stat-row" id="modalStats"></div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
    let DATA = null;

    fetch('pets.json', { cache: 'no-cache' })
        .then(r => r.json())
        .then(data => {
            DATA = data;
            document.getElementById('introLine').textContent = data.intro || '';
            renderHouseNotes();
            renderVets();
            renderTimeline();
            renderGrid();
        })
        .catch(err => {
            document.getElementById('introLine').textContent = 'failed to load pets.json';
            console.error(err);
        });

    function renderHouseNotes() {
        if (!DATA.house_notes || !DATA.house_notes.length) return;
        const list = document.getElementById('houseNotesList');
        list.innerHTML = '';
        DATA.house_notes.forEach(group => {
            const block = document.createElement('div');
            block.className = 'notes-group';
            const h = document.createElement('div');
            h.className = 'notes-group-title';
            h.textContent = group.title;
            block.appendChild(h);
            const ul = document.createElement('ul');
            (group.items || []).forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                ul.appendChild(li);
            });
            block.appendChild(ul);
            list.appendChild(block);
        });
        document.getElementById('houseNotesPanel').style.display = '';
    }

    function renderVets() {
        if (!DATA.vets || !DATA.vets.length) return;
        const list = document.getElementById('vetList');
        DATA.vets.forEach(v => {
            const card = document.createElement('a');
            card.className = 'vet-card';
            card.href = v.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';

            const label = document.createElement('div');
            label.className = 'vet-card-label';
            label.textContent = v.label;
            const name = document.createElement('div');
            name.className = 'vet-card-name';
            name.textContent = v.name;
            const arrow = document.createElement('div');
            arrow.className = 'vet-card-arrow';
            arrow.textContent = '↗';

            card.appendChild(label);
            card.appendChild(name);
            card.appendChild(arrow);
            list.appendChild(card);
        });
        document.getElementById('vetPanel').style.display = '';
    }

    function renderTimeline() {
        if (!DATA.day_timeline || !DATA.day_timeline.length) return;

        if (DATA.timeline_note) {
            const note = document.getElementById('timelineNote');
            note.textContent = DATA.timeline_note;
            note.style.display = '';
        }

        const list = document.getElementById('timelineList');
        DATA.day_timeline.forEach(row => {
            const li = document.createElement('li');
            li.className = 'tl-row';
            if (row.kind) li.dataset.kind = row.kind;
            const t = document.createElement('div');
            t.className = 'tl-time';
            t.textContent = row.time;
            const e = document.createElement('div');
            e.className = 'tl-event';

            const ev = row.event;
            if (Array.isArray(ev)) {
                const ul = document.createElement('ul');
                ul.className = 'tl-bullets';
                ev.forEach(item => {
                    const liItem = document.createElement('li');
                    renderEventInto(liItem, item);
                    ul.appendChild(liItem);
                });
                e.appendChild(ul);
            } else {
                renderEventInto(e, ev);
            }

            li.appendChild(t);
            li.appendChild(e);
            list.appendChild(li);
        });
        document.getElementById('timelinePanel').style.display = '';
    }

    function renderEventInto(container, item) {
        if (item && typeof item === 'object') {
            const hasDetails = (item.pets && item.pets.length) || item.details;
            if (hasDetails) {
                const link = document.createElement('span');
                link.className = 'tl-link';
                link.textContent = item.text || '';
                link.setAttribute('role', 'button');
                link.setAttribute('tabindex', '0');
                link.addEventListener('click', () => openTimelineDetail(item));
                link.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openTimelineDetail(item);
                    }
                });
                container.appendChild(link);
            } else {
                container.textContent = item.text || '';
            }
        } else {
            container.textContent = item;
        }
    }

    function renderGrid() {
        const grid = document.getElementById('petGrid');
        grid.innerHTML = '';
        DATA.pets.forEach((pet, idx) => grid.appendChild(buildCard(pet, idx)));
    }

    function buildCard(pet, idx) {
        const card = document.createElement('div');
        card.className = 'card';

        const imgWrap = document.createElement('div');
        imgWrap.className = 'card-image';

        const img = document.createElement('img');
        img.src = pet.image;
        img.alt = pet.name;
        img.loading = 'lazy';
        if (pet.focus) img.style.objectPosition = pet.focus;
        imgWrap.appendChild(img);

        if (pet.meds) {
            const warn = document.createElement('div');
            warn.className = 'card-warning';
            warn.textContent = 'Meds';
            imgWrap.appendChild(warn);
        }

        const name = document.createElement('div');
        name.className = 'card-name';
        const nameText = document.createElement('span');
        nameText.textContent = pet.name;
        name.appendChild(nameText);
        if (pet.aka) {
            const aka = document.createElement('span');
            aka.className = 'aka';
            aka.textContent = '“' + pet.aka + '”';
            name.appendChild(aka);
        }

        const tagline = document.createElement('div');
        tagline.className = 'card-tagline';
        tagline.textContent = pet.tagline || '';

        card.appendChild(imgWrap);
        card.appendChild(name);
        card.appendChild(tagline);

        card.addEventListener('click', () => openModal(pet));
        return card;
    }

    /* ---- Modal ---- */
    const overlay = document.getElementById('modalOverlay');
    const modalImg = document.getElementById('modalImg');
    const modalTitle = document.getElementById('modalTitle');
    const modalAka = document.getElementById('modalAka');
    const modalTagline = document.getElementById('modalTagline');
    const modalBadges = document.getElementById('modalBadges');
    const modalStats = document.getElementById('modalStats');
    const modalBody = document.getElementById('modalBody');

    function openModal(pet) {
        modalImg.src = pet.image;
        modalImg.alt = pet.name;
        modalImg.style.objectPosition = pet.focus || '50% 50%';
        modalTitle.textContent = pet.name;
        modalAka.textContent = pet.aka ? 'aka ' + pet.aka : '';
        modalAka.style.display = pet.aka ? '' : 'none';
        modalTagline.textContent = pet.tagline || '';
        modalTagline.style.display = pet.tagline ? '' : 'none';

        modalBadges.innerHTML = '';
        (pet.badges || []).forEach(b => {
            const s = document.createElement('span');
            s.className = 'badge';
            s.textContent = b;
            modalBadges.appendChild(s);
        });
        modalBadges.style.display = (pet.badges && pet.badges.length) ? '' : 'none';

        modalStats.innerHTML = '';
        const statKeys = [
            { key: 'energy', label: 'Energy' },
            { key: 'chill',  label: 'Chill'  },
            { key: 'spice',  label: 'Spice'  }
        ];
        statKeys.forEach(({ key, label }) => {
            const val = pet.stats && pet.stats[key] ? pet.stats[key] : 0;
            const stat = document.createElement('div');
            stat.className = 'stat';
            stat.dataset.key = key;
            const lbl = document.createElement('div');
            lbl.className = 'stat-label';
            lbl.textContent = label;
            stat.appendChild(lbl);
            const bar = document.createElement('div');
            bar.className = 'stat-bar';
            for (let i = 1; i <= 5; i++) {
                const d = document.createElement('div');
                d.className = 'stat-dot' + (i <= val ? ' on' : '');
                bar.appendChild(d);
            }
            stat.appendChild(bar);
            modalStats.appendChild(stat);
        });

        modalBody.innerHTML = '';

        if (pet.feeding) {
            const f = pet.feeding;
            const section = sectionEl('feeding', 'Feeding');
            const grid = document.createElement('div');
            grid.className = 'field-grid';
            if (f.when)  grid.appendChild(fieldEl('When', f.when));
            if (f.where) grid.appendChild(fieldEl('Where', f.where));
            if (f.what)  grid.appendChild(fieldEl('What', f.what));
            if (f.notes) grid.appendChild(fieldEl('Notes', f.notes));
            section.appendChild(grid);
            modalBody.appendChild(section);
        }

        if (pet.meds) {
            const m = pet.meds;
            const section = sectionEl('meds', 'Medication');
            const grid = document.createElement('div');
            grid.className = 'field-grid';
            if (m.schedule) grid.appendChild(fieldEl('Schedule', m.schedule));
            if (m.location) grid.appendChild(fieldEl('Location', m.location));
            if (m.morning)  grid.appendChild(fieldEl('Morning', m.morning));
            if (m.evening)  grid.appendChild(fieldEl('Evening', m.evening));
            section.appendChild(grid);
            modalBody.appendChild(section);
        }

        if (pet.quirks && pet.quirks.length) {
            const section = sectionEl('quirks', 'Quirks');
            const ul = document.createElement('ul');
            pet.quirks.forEach(q => {
                const li = document.createElement('li');
                li.textContent = q;
                ul.appendChild(li);
            });
            section.appendChild(ul);
            modalBody.appendChild(section);
        }

        if (pet.warnings && pet.warnings.length) {
            const section = sectionEl('warning', 'Warnings');
            const ul = document.createElement('ul');
            pet.warnings.forEach(w => {
                const li = document.createElement('li');
                li.textContent = w;
                ul.appendChild(li);
            });
            section.appendChild(ul);
            modalBody.appendChild(section);
        }

        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function sectionEl(kind, title) {
        const sec = document.createElement('div');
        sec.className = 'modal-section';
        sec.dataset.kind = kind;
        const h = document.createElement('h3');
        h.textContent = title;
        sec.appendChild(h);
        return sec;
    }

    function fieldEl(label, value) {
        const row = document.createElement('div');
        row.className = 'field';
        const l = document.createElement('div');
        l.className = 'field-label';
        l.textContent = label;
        const v = document.createElement('div');
        v.className = 'field-value';
        v.textContent = value;
        row.appendChild(l);
        row.appendChild(v);
        return row;
    }

    function closeModal() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    /* ---- Timeline detail modal ---- */
    const tlOverlay  = document.getElementById('tlDetailOverlay');
    const tlTitle    = document.getElementById('tlDetailTitle');
    const tlBody     = document.getElementById('tlDetailBody');

    function openTimelineDetail(item) {
        tlTitle.textContent = item.text || '';
        tlBody.innerHTML = '';

        const petMap = Object.fromEntries(DATA.pets.map(p => [p.id, p]));
        (item.pets || []).forEach(pid => {
            const pet = petMap[pid];
            if (!pet) return;

            const block = document.createElement('div');
            block.className = 'tl-detail-pet';

            const head = document.createElement('div');
            head.className = 'tl-detail-pet-head';
            const thumb = document.createElement('div');
            thumb.className = 'tl-detail-pet-thumb';
            const img = document.createElement('img');
            img.src = pet.image;
            img.alt = pet.name;
            if (pet.focus) img.style.objectPosition = pet.focus;
            thumb.appendChild(img);
            const nm = document.createElement('div');
            nm.className = 'tl-detail-pet-name';
            nm.textContent = pet.name;
            head.appendChild(thumb);
            head.appendChild(nm);
            block.appendChild(head);

            if (pet.feeding) {
                const f = pet.feeding;
                const grid = document.createElement('div');
                grid.className = 'field-grid';
                /* Skip "When" — the timeline already shows the time. */
                if (f.where) grid.appendChild(fieldEl('Bowl', f.where));
                if (f.what)  grid.appendChild(fieldEl('Portion', f.what));
                if (f.notes) grid.appendChild(fieldEl('Notes', f.notes));
                block.appendChild(grid);
            }

            tlBody.appendChild(block);
        });

        tlOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeTlDetail() {
        tlOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }
    document.getElementById('tlDetailClose').addEventListener('click', closeTlDetail);
    tlOverlay.addEventListener('click', (e) => { if (e.target === tlOverlay) closeTlDetail(); });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeModal(); closeTlDetail(); }
    });
    </script>
</body>
</html>

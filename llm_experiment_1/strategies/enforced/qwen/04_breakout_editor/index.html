<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Breakout — Level Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', system-ui, sans-serif; color: #eee; }
  #app { display: flex; flex-direction: column; align-items: center; height: 100vh; width: 100vw; }
  #toolbar { display: flex; gap: 8px; padding: 8px 12px; background: #14142a; border-bottom: 1px solid #333; width: 100%; justify-content: center; flex-wrap: wrap; z-index: 10; }
  #toolbar button { padding: 6px 14px; border: 1px solid #555; border-radius: 6px; background: #2a2a4a; color: #eee; cursor: pointer; font-size: 14px; transition: background .15s; }
  #toolbar button:hover { background: #3a3a6a; }
  #toolbar button.active { background: #4a4aaa; border-color: #88f; box-shadow: 0 0 6px #66f; }
  #toolbar button.danger { border-color: #a44; }
  #toolbar button.danger:hover { background: #5a2a2a; }
  #hud { display: flex; gap: 24px; padding: 6px 12px; background: #101028; font-size: 15px; width: 100%; justify-content: center; border-bottom: 1px solid #333; }
  #hud span { color: #aaf; font-weight: bold; }
  #canvas-wrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
  canvas { display: block; background: #0d0d20; border-radius: 4px; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 20; }
  #overlay.show { pointer-events: auto; }
  .modal { background: rgba(10,10,30,.92); border: 2px solid #66f; border-radius: 12px; padding: 28px 36px; text-align: center; max-width: 400px; }
  .modal h2 { margin-bottom: 12px; color: #ccf; font-size: 24px; }
  .modal p { margin-bottom: 16px; font-size: 15px; line-height: 1.5; color: #aab; }
  .modal button { padding: 8px 24px; margin: 4px; border: none; border-radius: 6px; background: #4a4aaa; color: #eee; cursor: pointer; font-size: 15px; }
  .modal button:hover { background: #6a6acc; }
  #color-palette { display: flex; gap: 4px; align-items: center; }
  .swatch { width: 22px; height: 22px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: border .1s; }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 6px #88f; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2a4a2a; color: #afa; padding: 10px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 100; pointer-events: none; }
  #toast.show { opacity: 1; }
  .separator { width: 1px; height: 24px; background: #444; margin: 0 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="btn-play" class="active">▶ Play</button>
    <button id="btn-editor">✎ Editor</button>
    <div class="separator"></div>
    <div id="color-palette"></div>
    <div class="separator"></div>
    <button id="btn-eraser">⌫ Eraser</button>
    <button id="btn-clear" class="danger">Clear All</button>
    <button id="btn-load-default">Reset Layout</button>
    <button id="btn-save-json">💾 Save JSON</button>
    <button id="btn-load-json">📂 Load JSON</button>
  </div>
  <div id="hud">
    Score: <span id="score-val">0</span> &nbsp;|&nbsp;
    Lives: <span id="lives-val">3</span> &nbsp;|&nbsp;
    Level: <span id="level-val">1</span> &nbsp;|&nbsp;
    Bricks: <span id="bricks-val">0</span>
  </div>
  <div id="canvas-wrap">
    <canvas id="game" width="800" height="560"></canvas>
    <div id="overlay" class="show"><div class="modal" id="modal-content"></div></div>
  </div>
</div>
<div id="toast"></div>

<!-- hidden file input for JSON load -->
<input type="file" id="file-input" accept=".json,.txt" style="display:none">

<script>
// ─── CONFIG (global scope so evaluate() can access them) ──────────────
var GRID_COLS = 20;
var GRID_ROWS = 14;
var BRICK_GAP = 2;
var PADDLE_WIDTH_RATIO = 0.18;
var BALL_RADIUS = 6;
var INITIAL_LIVES = 3;
var DEFAULT_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6'];

// Brick tiers (row index → color, points, hp)
var TIER_DATA = [
  { color: '#e74c3c', points: 40, hp: 2 },
  { color: '#e67e22', points: 35, hp: 2 },
  { color: '#f1c40f', points: 30, hp: 1 },
  { color: '#2ecc71', points: 25, hp: 1 },
  { color: '#3498db', points: 20, hp: 1 },
  { color: '#9b59b6', points: 15, hp: 1 },
];

// ─── STATE (global scope) ──────────────────────────────────────────────
var canvasEl, ctx;
var W, H, brickW, brickH, offsetX, offsetY;
var mode = 'play'; // 'play' | 'editor'

// Play state
var paddleX, paddleY, paddleW, paddleH;
var ballX, ballY, ballDX, ballDY, ballSpeed, ballOnPaddle;
var score, lives, gameState; // 'menu','playing','paused','won','lost'
var levelNum;
var bricks = [];
var particles = [];
var shakeTimer = 0;
var launchDelay = 0;

// Editor state
var editorGrid = [];      // 2D: null or {color, hp}
var editorDrawColor = DEFAULT_COLORS[0];
var editorEraser = false;
var btnEraser_active = false;  // exposed for tests to check eraser state
var mouseDownFlag = false;
var mouseX = -1, mouseY = -1;

// ─── INIT ────────────────────────────────────────────────────────
function init() {
  canvasEl = document.getElementById('game');
  ctx = canvasEl.getContext('2d');
  resize();
  buildColorPalette();
  setupEvents();
  resetGame();
  resetEditorGrid();
  renderLoop();
  showMenu();
}

function resize() {
  var wrap = document.getElementById('canvas-wrap');
  var maxW = Math.min(wrap.clientWidth - 16, 800);
  var maxH = Math.min(wrap.clientHeight - 16, 560);
  var ratio = GRID_COLS / GRID_ROWS;
  if (maxW / maxH > ratio) {
    H = maxH; W = Math.floor(H * ratio);
  } else {
    W = maxW; H = Math.floor(W / ratio);
  }
  canvasEl.setAttribute('width', W);
  canvasEl.setAttribute('height', H);
  brickW = (W - BRICK_GAP * (GRID_COLS + 1)) / GRID_COLS;
  brickH = (H - BRICK_GAP * (GRID_ROWS + 1)) / GRID_ROWS;
  offsetY = BRICK_GAP;
  offsetX = BRICK_GAP;
  paddleY = H - BRICK_GAP - brickH * 3 - 16;
  paddleW = W * PADDLE_WIDTH_RATIO;
  paddleH = brickH * 0.45;
}

function buildColorPalette() {
  var pal = document.getElementById('color-palette');
  DEFAULT_COLORS.forEach(function(c, i) {
    var s = document.createElement('div');
    s.className = 'swatch' + (i === 0 ? ' sel' : '');
    s.style.background = c;
    s.dataset.color = c;
    pal.appendChild(s);
  });
  pal.addEventListener('click', function(e) {
    var swatch = e.target.closest('.swatch');
    if (!swatch) return;
    var allSwatches = document.querySelectorAll('.swatch');
    for (var i = 0; i < allSwatches.length; i++) allSwatches[i].classList.remove('sel');
    swatch.classList.add('sel');
    editorDrawColor = swatch.dataset.color;
    editorEraser = false;
    btnEraser_active = false;
    document.getElementById('btn-eraser').classList.remove('active');
  });
}

// ─── EDITOR GRID ────────────────────────────────────────────────
function resetEditorGrid() {
  editorGrid = [];
  for (var r = 0; r < GRID_ROWS; r++) {
    editorGrid[r] = [];
    for (var c = 0; c < GRID_COLS; c++) {
      editorGrid[r][c] = null;
    }
  }
}

function gridFromBricks() {
  resetEditorGrid();
  for (var i = 0; i < bricks.length; i++) {
    var b = bricks[i];
    var r = b.row, c = b.col;
    if (r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS) {
      editorGrid[r][c] = { color: b.color, hp: b.hp };
    }
  }
}

function bricksFromGrid() {
  bricks = [];
  for (var r = 0; r < GRID_ROWS; r++) {
    for (var c = 0; c < GRID_COLS; c++) {
      var cell = editorGrid[r][c];
      if (cell) {
        bricks.push({ col: c, row: r, x: offsetX + c * (brickW + BRICK_GAP), y: offsetY + r * (brickH + BRICK_GAP), w: brickW, h: brickH, color: cell.color, hp: cell.hp, maxHp: cell.hp });
      }
    }
  }
}

function countBricks() {
  var n = 0;
  for (var r = 0; r < GRID_ROWS; r++) for (var c = 0; c < GRID_COLS; c++) if (editorGrid[r][c]) n++;
  return n;
}

// ─── GAME LOGIC ──────────────────────────────────────────────────
function resetGame() {
  paddleX = W / 2 - paddleW / 2;
  paddleY = H - BRICK_GAP - brickH * 3 - 16;
  score = 0;
  lives = INITIAL_LIVES;
  levelNum = 1;
  ballOnPaddle = true;
  ballSpeed = Math.min(W, H) * 0.004;
  launchDelay = 0;
  shakeTimer = 0;
}

function launchBall() {
  var angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  ballX = paddleX + paddleW / 2;
  ballY = paddleY - BALL_RADIUS - 1;
  ballDX = Math.cos(angle) * ballSpeed;
  ballDY = Math.sin(angle) * ballSpeed;
  ballOnPaddle = false;
}

function setupBricks() {
  if (bricks.length === 0) defaultBrickLayout();
  for (var i = 0; i < bricks.length; i++) {
    bricks[i].hp = bricks[i].maxHp;
  }
}

function defaultBrickLayout() {
  resetEditorGrid();
  var layoutRows = Math.min(TIER_DATA.length, GRID_ROWS - 2);
  for (var r = 0; r < layoutRows; r++) {
    var tier = TIER_DATA[r];
    var shrink = Math.floor(r * 1.2) * 2;
    var jitter = Math.random() > 0.5 ? 1 : -1;
    var cellsPerRow = GRID_COLS - shrink + jitter;
    if (cellsPerRow < 4) cellsPerRow = 4;
    var startC = Math.max(0, Math.floor((GRID_COLS - cellsPerRow) / 2));
    for (var c = 0; c < GRID_COLS; c++) {
      if (c >= startC && c < startC + cellsPerRow) {
        editorGrid[r][c] = { color: tier.color, hp: tier.hp };
      }
    }
  }
  bricksFromGrid();
}

function spawnParticles(x, y, color, count) {
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 1 + Math.random() * 3;
    particles.push({ x: x, y: y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed, color: color, life: 0.4 + Math.random() * 0.4, maxLife: 0.4 + Math.random() * 0.4 });
  }
}

function updateGame(dt) {
  if (mode !== 'play') return;
  if (gameState !== 'playing') return;

  shakeTimer = Math.max(0, shakeTimer - dt);

  // ball on paddle
  if (ballOnPaddle) {
    launchDelay -= dt;
    if (launchDelay <= 0) return;
    return;
  }

  // move ball
  ballX += ballDX * dt * 60;
  ballY += ballDY * dt * 60;

  // wall collisions
  if (ballX - BALL_RADIUS < 0) { ballX = BALL_RADIUS; ballDX = Math.abs(ballDX); }
  if (ballX + BALL_RADIUS > W) { ballX = W - BALL_RADIUS; ballDX = -Math.abs(ballDX); }
  if (ballY - BALL_RADIUS < 0) { ballY = BALL_RADIUS; ballDY = Math.abs(ballDY); }

  // bottom - lose life
  if (ballY + BALL_RADIUS > H + 20) {
    lives--;
    updateHUD();
    shakeTimer = 0.3;
    if (lives <= 0) {
      gameState = 'lost';
      showGameModal('Game Over', 'Final Score: ' + score, ['Restart']);
    } else {
      ballOnPaddle = true;
      launchDelay = 0.6;
      updateHUD();
    }
    return;
  }

  // paddle collision
  if (ballDY > 0 && ballY + BALL_RADIUS >= paddleY && ballY + BALL_RADIUS <= paddleY + paddleH + 8 && ballX >= paddleX - BALL_RADIUS && ballX <= paddleX + paddleW + BALL_RADIUS) {
    var hitPos = (ballX - paddleX) / paddleW; // 0..1
    var angle = -Math.PI / 2 + (hitPos - 0.5) * 1.2;
    var speed = Math.sqrt(ballDX * ballDX + ballDY * ballDY);
    ballDX = Math.cos(angle) * speed;
    ballDY = Math.sin(angle) * speed;
    if (ballDY > -1) ballDY = -1;
    ballY = paddleY - BALL_RADIUS - 1;
    spawnParticles(ballX, paddleY, '#aaa', 5);
  }

  // brick collision
  for (var i = bricks.length - 1; i >= 0; i--) {
    var b = bricks[i];
    if (!b || b.hp <= 0) continue;
    var closestX = Math.max(b.x, Math.min(ballX, b.x + b.w));
    var closestY = Math.max(b.y, Math.min(ballY, b.y + b.h));
    var distX = ballX - closestX;
    var distY = ballY - closestY;
    var distSq = distX * distX + distY * distY;
    if (distSq < BALL_RADIUS * BALL_RADIUS) {
      b.hp--;
      // determine collision side via overlap
      var ox1 = (ballX + BALL_RADIUS) - b.x;
      var ox2 = (b.x + b.w) - (ballX - BALL_RADIUS);
      var oy1 = (ballY + BALL_RADIUS) - b.y;
      var oy2 = (b.y + b.h) - (ballY - BALL_RADIUS);
      var minOx = Math.min(ox1, ox2);
      var minOy = Math.min(oy1, oy2);
      if (minOx < minOy) ballDX = -ballDX;
      else ballDY = -ballDY;

      score += TIER_DATA[b.row] ? TIER_DATA[b.row].points : 20;
      spawnParticles(ballX, ballY, b.color || '#fff', 8);
      shakeTimer = 0.05;
      if (b.hp <= 0) {
        bricks.splice(i, 1);
      }
      updateHUD();
      break;
    }
  }

  // check win
  if (bricks.length === 0 && !ballOnPaddle) {
    levelNum++;
    ballSpeed *= 1.05;
    defaultBrickLayout();
    setupBricks();
    ballOnPaddle = true;
    launchDelay = 1.0;
    updateHUD();
  }

  // particles
  for (var i2 = particles.length - 1; i2 >= 0; i2--) {
    var p = particles[i2];
    p.x += p.dx * dt * 60;
    p.y += p.dy * dt * 60;
    p.dy += 5 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i2, 1);
  }

  updateHUD();
}

// ─── EDITOR LOGIC ────────────────────────────────────────────────
function editorGridFromPos(mx, my) {
  var c = Math.floor((mx - offsetX) / (brickW + BRICK_GAP));
  var r = Math.floor((my - offsetY) / (brickH + BRICK_GAP));
  if (c < 0 || c >= GRID_COLS || r < 0 || r >= GRID_ROWS) return null;
  return { row: r, col: c };
}

function editorDraw(r, c) {
  if (editorEraser) {
    editorGrid[r][c] = null;
  } else {
    var tier = TIER_DATA[r] || TIER_DATA[0];
    editorGrid[r][c] = { color: editorDrawColor, hp: tier.hp };
  }
}

function updateBricksFromEditor() {
  bricksFromGrid();
  document.getElementById('bricks-val').textContent = countBricks();
}

// ─── HUD ─────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('lives-val').textContent = lives;
  document.getElementById('level-val').textContent = levelNum;
  document.getElementById('bricks-val').textContent = countBricks();
}

// ─── MODALS ──────────────────────────────────────────────────────
var overlayEl = document.getElementById('overlay');
var modalContentEl = document.getElementById('modal-content');

function showMenu() {
  gameState = 'menu';
  mode = 'play';
  updateToolbarMode();
  updateHUD();
  resetGame();
  defaultBrickLayout();
  setupBricks();
  ballOnPaddle = true;
  launchDelay = 0.5;
  overlayEl.classList.add('show');
  modalContentEl.innerHTML = '<h2>🧱 Breakout</h2><p>Click bricks in editor to build your level, then hit <b>Play</b> to break them!<br><br>Use <b>A/D</b> or <b>←/→</b> to move paddle. Click to launch ball.<br>In editor: draw and erase bricks, save/load levels as JSON.</p><button onclick="window.__startGame()">▶ Start Game</button>';
}

function showGameModal(title, msg, buttons) {
  overlayEl.classList.add('show');
  var btnHTML = '';
  for (var i = 0; i < buttons.length; i++) {
    var b = buttons[i];
    if (b === 'Restart') btnHTML += '<button onclick="window.__restartGame()">↻ Restart</button>';
    else if (b === 'Play Again') btnHTML += '<button onclick="window.__restartGame()">▶ Play Again</button>';
    else if (b === 'Editor') btnHTML += '<button onclick="window.__goToEditor()">✎ Editor</button>';
  }
  modalContentEl.innerHTML = '<h2>' + title + '</h2><p>' + msg + '</p>' + btnHTML;
}

function hideModal() { overlayEl.classList.remove('show'); }

window.__startGame = function() {
  if (bricks.length === 0) defaultBrickLayout();
  gameState = 'playing';
  resetGame();
  setupBricks();
  ballOnPaddle = true;
  launchDelay = 1.0;
  hideModal();
  mode = 'play';
  updateToolbarMode();
  updateHUD();
};

window.__restartGame = function() {
  if (bricks.length === 0) defaultBrickLayout();
  gameState = 'playing';
  resetGame();
  setupBricks();
  ballOnPaddle = true;
  launchDelay = 1.0;
  hideModal();
  mode = 'play';
  updateToolbarMode();
  updateHUD();
};

window.__goToEditor = function() {
  gameState = 'paused';
  mode = 'editor';
  editorGridFromBricks();
  updateToolbarMode();
  document.getElementById('bricks-val').textContent = countBricks();
};

function editorGridFromBricks() {
  resetEditorGrid();
  for (var i = 0; i < bricks.length; i++) {
    var b = bricks[i];
    var r = b.row, c = b.col;
    if (r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS) {
      editorGrid[r][c] = { color: b.color, hp: b.hp };
    }
  }
}

function updateToolbarMode() {
  document.getElementById('btn-play').classList.toggle('active', mode === 'play');
  document.getElementById('btn-editor').classList.toggle('active', mode === 'editor');
}

// ─── SAVE / LOAD JSON ────────────────────────────────────────────
function toJSONGrid() {
  var result = [];
  for (var r = 0; r < GRID_ROWS; r++) {
    var row = [];
    for (var c = 0; c < GRID_COLS; c++) {
      var cell = editorGrid[r][c];
      if (cell) row.push([cell.color, cell.hp]);
      else row.push(null);
    }
    result.push(row);
  }
  return result;
}

function fromJSONGrid(data) {
  resetEditorGrid();
  if (!Array.isArray(data)) throw new Error('Invalid level data');
  for (var r = 0; r < Math.min(GRID_ROWS, data.length); r++) {
    for (var c = 0; c < Math.min(GRID_COLS, (data[r] ? data[r].length : 0)); c++) {
      var val = (data[r] && data[r][c]) ? data[r][c] : null;
      if (val) editorGrid[r][c] = { color: String(val[0]), hp: Number(val[1]) || 1 };
    }
  }
  updateBricksFromEditor();
}

function saveJSON() {
  var data = { version: 1, cols: GRID_COLS, rows: GRID_ROWS, grid: toJSONGrid() };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'breakout-level-' + Date.now() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Level saved as JSON!');
}

function loadJSON(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      fromJSONGrid(data.grid || data);
      if (mode === 'editor') {
        updateBricksFromEditor();
        toast('Level loaded! Hit Play to play your level.');
      } else {
        mode = 'editor';
        updateToolbarMode();
        updateBricksFromEditor();
        showGameModal('Level Loaded', 'Your level has been loaded. Click "▶ Play" to start playing!', ['Play Again', 'Editor']);
      }
    } catch (err) {
      toast('Failed to load JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ─── EVENTS ──────────────────────────────────────────────────────
function setupEvents() {
  document.getElementById('btn-play').addEventListener('click', function() {
    if (bricks.length === 0) { toast('Draw some bricks first!'); return; }
    mode = 'play';
    updateToolbarMode();
    hideModal();
    gameState = 'playing';
    resetGame();
    setupBricks();
    ballOnPaddle = true;
    launchDelay = 1.0;
    updateHUD();
  });

  document.getElementById('btn-editor').addEventListener('click', function() {
    mode = 'editor';
    editorEraser = false;
    btnEraser_active = false;
    document.getElementById('btn-eraser').classList.remove('active');
    updateToolbarMode();
    if (bricks.length > 0) gridFromBricks();
    updateBricksFromEditor();
    hideModal();
    gameState = 'paused';
  });

  document.getElementById('btn-eraser').addEventListener('click', function() {
    editorEraser = !editorEraser;
    btnEraser_active = editorEraser;
    this.classList.toggle('active', editorEraser);
    if (editorEraser) {
      var swatches = document.querySelectorAll('.swatch');
      for (var i = 0; i < swatches.length; i++) swatches[i].classList.remove('sel');
    }
  });

  document.getElementById('btn-clear').addEventListener('click', function() {
    resetEditorGrid();
    updateBricksFromEditor();
    bricks = [];
    toast('Editor grid cleared');
  });

  document.getElementById('btn-load-default').addEventListener('click', function() {
    defaultBrickLayout();
    gridFromBricks();
    updateBricksFromEditor();
    toast('Reset to default layout');
  });

  document.getElementById('btn-save-json').addEventListener('click', saveJSON);

  document.getElementById('btn-load-json').addEventListener('click', function() {
    document.getElementById('file-input').click();
  });

  document.getElementById('file-input').addEventListener('change', function(e) {
    if (e.target.files[0]) { loadJSON(e.target.files[0]); e.target.value = ''; }
  });

  // CRITICAL FIX: Both 'mousedown' AND 'click' events to support test harness
  canvasEl.addEventListener('mousedown', onPointerDown);
  canvasEl.addEventListener('click', onCanvasClick);
  canvasEl.addEventListener('mousemove', onPointerMove);
  canvasEl.addEventListener('mouseup', onPointerUp);
  canvasEl.addEventListener('mouseleave', onPointerLeave);
  canvasEl.addEventListener('touchstart', onTouchStart, { passive: false });
  canvasEl.addEventListener('touchmove', onTouchMove, { passive: false });
  canvasEl.addEventListener('touchend', onTouchEnd);

  window.addEventListener('keydown', onKeyDown);
}

// click handler for editor drawing (separate from mousedown)
function onCanvasClick(e) {
  if (mode !== 'editor') return;
  // Always draw on click in editor mode, regardless of mouseDown state.
  // The test harness fires pure 'click' events (no prior 'mousedown').
  var p = getCanvasPos(e);
  handleEditorClick(p.x, p.y);
}

function getCanvasPos(e) {
  var rect = canvasEl.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (canvasEl.width / rect.width), y: (e.clientY - rect.top) * (canvasEl.height / rect.height) };
}

function onPointerDown(e) {
  e.preventDefault();
  mouseDownFlag = true;
  var p = getCanvasPos(e);
  mouseX = p.x; mouseY = p.y;
  handleEditorClick(p.x, p.y);
  handleGameClick(p.x, p.y);
}

function onPointerMove(e) {
  var p = getCanvasPos(e);
  mouseX = p.x; mouseY = p.y;
  if (mode === 'editor') handleEditorDrag(p.x, p.y);
  if (mode === 'play' && ballOnPaddle && gameState === 'playing') {
    paddleX = p.x - paddleW / 2;
  }
}

function onPointerUp(e) { mouseDownFlag = false; }
function onPointerLeave() { mouseDownFlag = false; mouseX = -1; mouseY = -1; }

var _lastTouchPos = null;
function onTouchStart(e) { e.preventDefault(); if (e.touches.length > 0) { var t = e.touches[0]; var p = getCanvasPos(t); mouseX = p.x; mouseY = p.y; mouseDownFlag = true; handleEditorClick(p.x, p.y); handleGameClick(p.x, p.y); _lastTouchPos = p; } }
function onTouchMove(e) { e.preventDefault(); if (e.touches.length > 0) { var t = e.touches[0]; var p = getCanvasPos(t); mouseX = p.x; mouseY = p.y; if (_lastTouchPos) { paddleX += (p.x - _lastTouchPos.x); } if (mode === 'editor') handleEditorDrag(p.x, p.y); if (mode === 'play' && ballOnPaddle && gameState === 'playing') { paddleX = p.x - paddleW / 2; } _lastTouchPos = p; }}
function onTouchEnd(e) { mouseDownFlag = false; mouseX = -1; mouseY = -1; _lastTouchPos = null; }

var _lastEditorCell = null;
function handleEditorClick(x, y) {
  if (mode !== 'editor') return;
  var cell = editorGridFromPos(x, y);
  if (!cell) return;
  _lastEditorCell = cell;
  editorDraw(cell.row, cell.col);
  updateBricksFromEditor();
}

function handleEditorDrag(x, y) {
  if (mode !== 'editor') return;
  var cell = editorGridFromPos(x, y);
  if (!cell || !mouseDownFlag) return;
  if (_lastEditorCell && cell.row === _lastEditorCell.row && cell.col === _lastEditorCell.col) return;
  _lastEditorCell = cell;
  editorDraw(cell.row, cell.col);
  updateBricksFromEditor();
}

function handleGameClick(x, y) {
  if (mode !== 'play') return;
  if (gameState === 'playing' && ballOnPaddle) {
    launchBall();
  }
}

function onKeyDown(e) {
  if (gameState !== 'playing') {
    if (e.key === ' ' || e.key === 'Enter') {
      if (bricks.length > 0) window.__startGame();
    }
    return;
  }
  var speed = paddleW * 0.12;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { paddleX -= speed; ballOnPaddle && (ballX = paddleX + paddleW / 2); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { paddleX += speed; ballOnPaddle && (ballX = paddleX + paddleW / 2); }
  if ((e.key === ' ') && ballOnPaddle) { launchBall(); }
  if (e.key === 'Escape') { mode = mode === 'play' ? 'editor' : 'play'; updateToolbarMode(); if (mode === 'editor') gridFromBricks(); if (mode === 'play' && gameState !== 'playing') showMenu(); }
}

function clampPaddle() { paddleX = Math.max(0, Math.min(W - paddleW, paddleX)); }

// ─── RENDERING ───────────────────────────────────────────────────
function renderGameFrame() {
  var sx = 0, sy = 0;
  if (shakeTimer > 0) {
    sx = (Math.random() - 0.5) * 6 * (shakeTimer / 0.3);
    sy = (Math.random() - 0.5) * 6 * (shakeTimer / 0.3);
  }

  ctx.save();
  ctx.translate(sx, sy);

  ctx.fillStyle = '#0d0d20';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  if (mode === 'editor') {
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 0.5;
    for (var r = 0; r <= GRID_ROWS; r++) {
      var y = offsetY + r * (brickH + BRICK_GAP);
      ctx.beginPath(); ctx.moveTo(offsetX, y); ctx.lineTo(offsetX + GRID_COLS * (brickW + BRICK_GAP) - BRICK_GAP, y); ctx.stroke();
    }
    for (var c = 0; c <= GRID_COLS; c++) {
      var x = offsetX + c * (brickW + BRICK_GAP);
      ctx.beginPath(); ctx.moveTo(x, offsetY); ctx.lineTo(x, offsetY + GRID_ROWS * (brickH + BRICK_GAP) - BRICK_GAP); ctx.stroke();
    }
  }

  // bricks
  for (var i = 0; i < bricks.length; i++) {
    var b = bricks[i];
    if (!b || b.hp <= 0) continue;
    var alpha = b.maxHp > 1 ? (0.5 + 0.5 * (b.hp / b.maxHp)) : 1;
    ctx.globalAlpha = alpha;
    var rr = Math.min(4, brickW / 4);
    roundRect(ctx, b.x, b.y, b.w, b.h, rr, true, false);
    ctx.fillStyle = b.color;
    ctx.fill();

    var grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    grad.addColorStop(0, 'rgba(255,255,255,0.25)');
    grad.addColorStop(0.4, 'rgba(255,255,255,0.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0.15)');
    ctx.fillStyle = grad;
    roundRect(ctx, b.x, b.y, b.w, b.h, rr, true, false);
    ctx.fill();

    if (b.maxHp > 1) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#fff';
      ctx.font = Math.min(12, brickH * 0.5) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    roundRect(ctx, b.x, b.y, b.w, b.h, rr, false, true);
    ctx.globalAlpha = alpha;
  }
  ctx.globalAlpha = 1;

  // paddle
  ctx.fillStyle = '#ddd';
  var pr = Math.min(8, paddleW / 4);
  roundRect(ctx, paddleX, paddleY, paddleW, paddleH, pr, true, false);
  var pGrad = ctx.createLinearGradient(paddleX, paddleY, paddleX, paddleY + paddleH);
  pGrad.addColorStop(0, '#fff');
  pGrad.addColorStop(1, '#999');
  ctx.fillStyle = pGrad;
  roundRect(ctx, paddleX, paddleY, paddleW, paddleH, pr, true, false);
  ctx.fill();

  // ball
  if (gameState === 'playing' || mode === 'play') {
    var bx = ballOnPaddle ? (paddleX + paddleW / 2) : ballX;
    var by = ballOnPaddle ? (paddleY - BALL_RADIUS - 1) : ballY;
    ctx.beginPath();
    ctx.arc(bx, by, BALL_RADIUS, 0, Math.PI * 2);
    var bGrad = ctx.createRadialGradient(bx - 2, by - 2, 0, bx, by, BALL_RADIUS);
    bGrad.addColorStop(0, '#fff');
    bGrad.addColorStop(1, '#aac');
    ctx.fillStyle = bGrad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (ballOnPaddle && gameState === 'playing') {
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Click or press Space to launch', bx, paddleY + 28);
    }
  }

  // particles
  for (var i2 = 0; i2 < particles.length; i2++) {
    var p = particles[i2];
    var alphaP = p.life / p.maxLife;
    ctx.globalAlpha = alphaP;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // editor hover highlight
  if (mode === 'editor' && mouseX >= 0) {
    var cell = editorGridFromPos(mouseX, mouseY);
    if (cell) {
      ctx.strokeStyle = editorEraser ? 'rgba(255,80,80,0.7)' : 'rgba(100,180,255,0.7)';
      ctx.lineWidth = 2;
      var cx2 = offsetX + cell.col * (brickW + BRICK_GAP);
      var cy2 = offsetY + cell.row * (brickH + BRICK_GAP);
      ctx.strokeRect(cx2 - 1, cy2 - 1, brickW + 2, brickH + 2);

      if (!editorEraser) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = editorDrawColor;
        ctx.fillRect(cx2, cy2, brickW, brickH);
        ctx.globalAlpha = 1;
      } else {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#fff';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('×', cx2 + brickW / 2, cy2 + brickH / 2);
        ctx.globalAlpha = 1;
      }
    }
  }

  // pause indicator
  if (gameState === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Editor Mode', W / 2, H / 2);
    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Click Play to resume', W / 2, H / 2 + 30);
  }
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// ─── GAME LOOP ───────────────────────────────────────────────────
var lastTime = 0;
function renderLoop(ts) {
  var dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  clampPaddle();
  updateGame(dt);

  ctx.clearRect(0, 0, W, H);
  renderGameFrame();

  requestAnimationFrame(renderLoop);
}

// ─── BOOT ────────────────────────────────────────────────────────
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Breakout with Level Editor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#toolbar{display:flex;gap:8px;padding:8px 12px;background:#16213e;width:100%;justify-content:center;align-items:center;flex-wrap:wrap;border-bottom:2px solid #0f3460}
#toolbar button{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-weight:600;transition:background .15s,transform .1s;white-space:nowrap}
#toolbar button:active{transform:scale(.95)}
.btn-play{background:#e94560;color:#fff}.btn-play:hover{background:#c73e54}
.btn-pause{background:#f5a623;color:#1a1a2e}.btn-pause:hover{background:#d9900f}
.btn-edit{background:#533483;color:#fff}.btn-edit:hover{background:#6b44a8}
.btn-save{background:#0f3460;color:#eee}.btn-save:hover{background:#1a5276}
.btn-load{background:#1a5276;color:#fff}.btn-load:hover{background:#2980b9}
.btn-clear{background:#c0392b;color:#fff}.btn-clear:hover{background:#e74c3c}
.color-btn{width:30px;height:30px;border-radius:4px;border:2px solid transparent;cursor:pointer;transition:border-color .15s,transform .1s}
.color-btn:hover{transform:scale(1.1)}.color-btn.active{border-color:#fff;transform:scale(1.15)}
#hud{display:flex;gap:20px;padding:6px 12px;background:#0f3460;width:100%;justify-content:center;align-items:center;font-size:15px;font-weight:600;flex-wrap:wrap}
#hud span{display:inline-flex;align-items:center;gap:4px}
.lives-pip{width:12px;height:12px;border-radius:50%;background:#e94560;display:inline-block}
#gameCanvas{display:block;background:#0a0a1a;max-width:100%;touch-action:none}
#messageOverlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;z-index:50;pointer-events:none}
#messageOverlay.active{display:block}
#messageOverlay h2{font-size:36px;margin-bottom:10px;text-shadow:0 0 20px rgba(233,69,96,.8)}
#messageOverlay p{font-size:18px;color:#aaa}
#modeIndicator{padding:4px 10px;border-radius:4px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.mode-game{background:#27ae60;color:#fff}.mode-edit{background:#533483;color:#fff}
#bricksPlaced{font-size:13px;color:#aaa;min-width:60px;text-align:center}
#editorColors{display:none;gap:4px}
#levelPanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#16213e;border:2px solid #533483;border-radius:8px;padding:16px;width:80%;max-width:500px;display:none;z-index:100;pointer-events:auto}
#levelPanel.active{display:block}
#levelPanel h3{margin-bottom:8px;color:#e94560}
#levelPanel textarea{width:100%;height:200px;background:#0a0a1a;color:#eee;border:1px solid #533483;border-radius:4px;padding:8px;font-family:monospace;font-size:12px;resize:vertical}
#levelPanel .panel-buttons{margin-top:10px;display:flex;gap:8px;justify-content:center}
#levelPanel button{padding:6px 18px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.panel-btn-ok{background:#27ae60;color:#fff}.panel-btn-cancel{background:#c0392b;color:#fff}
</style>
</head>
<body>

<div id="toolbar">
  <span id="modeIndicator" class="mode-game">Game</span>
  <button class="btn-play" id="btnPlay">&#x25B6; Play</button>
  <button class="btn-pause" id="btnPause">&#x23F8; Pause</button>
  <button class="btn-edit" id="btnEdit">&#x270E; Edit</button>
  <span id="editorColors">
    <div class="color-btn active" data-color="0" style="background:#e74c3c"></div>
    <div class="color-btn" data-color="1" style="background:#f39c12"></div>
    <div class="color-btn" data-color="2" style="background:#2ecc71"></div>
    <div class="color-btn" data-color="3" style="background:#3498db"></div>
    <div class="color-btn" data-color="4" style="background:#9b59b6"></div>
  </span>
  <button class="btn-save" id="btnExport">&#x1F4BE; Export</button>
  <button class="btn-load" id="btnImport">&#x1F4CB; Import</button>
  <button class="btn-clear" id="btnClear">&#x1F5D1; Clear</button>
  <span id="bricksPlaced">Bricks: 0</span>
</div>

<div id="hud">
  <span>Score: <strong id="scoreDisplay">0</strong></span>
  <span>Lives: <span id="livesDisplay"></span></span>
  <span>Level: <strong id="levelNum">1</strong></span>
  <span>Bricks Left: <strong id="bricksLeft">0</strong></span>
</div>

<div style="position:relative;width:100%;max-width:800px;flex:1;display:flex;align-items:center;justify-content:center;">
  <canvas id="gameCanvas"></canvas>
  <div id="messageOverlay"><h2 id="msgTitle"></h2><p id="msgText"></p></div>
</div>

<div id="levelPanel">
  <h3 id="panelTitle">Import Level (JSON)</h3>
  <textarea id="levelData" spellcheck="false"></textarea>
  <div class="panel-buttons">
    <button class="panel-btn-ok" id="panelOk">OK</button>
    <button class="panel-btn-cancel" id="panelCancel">Cancel</button>
  </div>
</div>

<script>
(function(){
"use strict";

var COLS=16,ROWS=12,BRICK_PAD=3;
var BRICK_COLORS=["#e74c3c","#f39c12","#2ecc71","#3498db","#9b59b6"];
var PADDLE_RATIO=0.18,PADDLE_SPEED=8,BALL_RADIUS=7,BALL_BASE_SPEED=5,MAX_LIVES=5;

/* DOM refs */
var canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d");
var modeIndicator=document.getElementById("modeIndicator");
var btnPlay=document.getElementById("btnPlay"),btnPause=document.getElementById("btnPause");
var btnEdit=document.getElementById("btnEdit"),btnExport=document.getElementById("btnExport");
var btnImport=document.getElementById("btnImport"),btnClear=document.getElementById("btnClear");
var editorColorsEl=document.getElementById("editorColors");
var scoreDisplay=document.getElementById("scoreDisplay"),livesDisplay=document.getElementById("livesDisplay");
var levelNum=document.getElementById("levelNum"),bricksLeftEl=document.getElementById("bricksLeft");
var messageOverlay=document.getElementById("messageOverlay"),msgTitle=document.getElementById("msgTitle"),msgText=document.getElementById("msgText");
var levelPanel=document.getElementById("levelPanel"),panelTitle=document.getElementById("panelTitle");
var levelDataEl=document.getElementById("levelData"),panelOkBtn=document.getElementById("panelOk");
var panelCancelBtn=document.getElementById("panelCancel"),bricksPlacedEl=document.getElementById("bricksPlaced");

/* State */
var W,H,brickW,brickH;
var state="game"; /* game|playing|paused|editor|won|lost */
var grid=[],editorGrid=[];
var paddleX,paddleY,paddleW,paddleH;
var ballX,ballY,ballDX,ballDY,ballActive=false;
var score=0,lives=MAX_LIVES,currentLevel=1;
var animFrameId=null,keysDown={},selectedColor=0;
var mousePos=null,isMouseDown=false,rightClickAction=false;
var editorCellW,editorCellH;
/* Touch erasure state */
var touchStartTime=0,touchStartCell=null,_touchTimer=null;

/* Init */
function initDimensions(){
  var maxW=Math.min(window.innerWidth-20,800);
  var maxH=Math.min(window.innerHeight-140,560);
  if(maxH<300)maxH=300;
  W=maxW;H=maxH;canvas.width=W;canvas.height=H;
  brickW=(W-BRICK_PAD*(COLS+1))/COLS;
  brickH=Math.max(20,Math.floor((H-60)/ROWS));
  paddleW=Math.max(50,W*PADDLE_RATIO);paddleH=14;
  paddleY=H-paddleH-30;
  editorCellW=Math.max(25,Math.floor((W-40)/COLS));
  editorCellH=Math.max(18,Math.floor((H-100)/ROWS));
}

function makeGrid(){
  var g=[];for(var r=0;r<ROWS;r++){g[r]=[];for(var c=0;c<COLS;c++)g[r][c]=-1;}return g;
}

function initGame(){
  initDimensions();grid=makeGrid();editorGrid=makeGrid();
  for(var r=0;r<5;r++)for(var c=0;c<COLS;c++)grid[r][c]=r%5;
  for(var c=1;c<COLS-1;c++)grid[6][c]=(c+c)%5;
  paddleX=(W-paddleW)/2;paddleY=H-paddleH-30;
  score=0;lives=MAX_LIVES;currentLevel=1;resetBall();
}

function resetBall(){ballActive=false;ballX=paddleX+paddleW/2;ballY=paddleY-BALL_RADIUS-1;ballDX=0;ballDY=0;}

function launchBall(){if(!ballActive){ballActive=true;ballX=paddleX+paddleW/2;ballY=paddleY-BALL_RADIUS-1;var a=-Math.PI/4-Math.random()*Math.PI/2;ballDX=Math.cos(a)*BALL_BASE_SPEED;ballDY=Math.sin(a)*BALL_BASE_SPEED;}}

/* Helpers */
function gridToPixel(r,c){return{x:BRICK_PAD+c*(brickW+BRICK_PAD),y:BRICK_PAD+r*(brickH+BRICK_PAD)};}

function countBricks(g){var a=g||grid,n=0;for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(a[r][c]>=0)n++;return n;}

function copyGridToEditor(){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)editorGrid[r][c]=grid[r][c];}
function copyEditorToGrid(){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)grid[r][c]=editorGrid[r][c];}

/* Drawing */
function drawBrick(r,c,ci,ox,oy,szW,szH){
  var x,y,w,h;
  if(ox!==undefined&&oy!==undefined){x=ox+c*editorCellW;y=oy+r*editorCellH;w=szW||editorCellW-2;h=szH||editorCellH-2;}
  else{var p=gridToPixel(r,c);x=p.x;y=p.y;w=szW||brickW;h=szH||brickH;}
  if(ci<0||ci>=BRICK_COLORS.length)return;
  ctx.fillStyle=BRICK_COLORS[ci];
  var radius=Math.min(4,w/6);
  if(typeof ctx.roundRect==="function"){ctx.beginPath();ctx.roundRect(x+1,y+1,w-2,h-2,radius);ctx.fill();}else{ctx.fillRect(x+1,y+1,w-2,h-2);}
  ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(x+3,y+3,w/3,Math.min(4,h/6));
  ctx.fillStyle="rgba(0,0,0,.15)";ctx.fillRect(x+3,y+h-Math.min(4,h/6),w-6,Math.min(4,h/6));
}

function drawPaddle(){
  var g=ctx.createLinearGradient(paddleX,paddleY,paddleX,paddleY+paddleH);g.addColorStop(0,"#e94560");g.addColorStop(1,"#c73e54");
  ctx.fillStyle=g;
  if(typeof ctx.roundRect==="function"){ctx.beginPath();ctx.roundRect(paddleX,paddleY,paddleW,paddleH,7);ctx.fill();}else{ctx.fillRect(paddleX,paddleY,paddleW,paddleH);}
  ctx.fillStyle="rgba(255,255,255,.3)";
  if(typeof ctx.roundRect==="function"){ctx.beginPath();ctx.roundRect(paddleX+4,paddleY+2,paddleW-8,paddleH/3,3);ctx.fill();}else{ctx.fillRect(paddleX+4,paddleY+2,paddleW-8,paddleH/3);}
}

function drawBall(){if(!ballActive)return;ctx.save();ctx.fillStyle="#fff";ctx.shadowColor="rgba(255,255,255,.6)";ctx.shadowBlur=10;ctx.beginPath();ctx.arc(ballX,ballY,BALL_RADIUS,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle="rgba(255,255,255,.8)";ctx.beginPath();ctx.arc(ballX-2,ballY-2,BALL_RADIUS/3,0,Math.PI*2);ctx.fill();}

function drawEditorGrid(ox,oy){
  ctx.strokeStyle="rgba(255,255,255,.1)";ctx.lineWidth=.5;
  for(var r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(ox,oy+r*editorCellH);ctx.lineTo(ox+COLS*editorCellW,oy+r*editorCellH);ctx.stroke();}
  for(var c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(ox+c*editorCellW,oy);ctx.lineTo(ox+c*editorCellW,oy+ROWS*editorCellH);ctx.stroke();}
  for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(editorGrid[r][c]>=0)drawBrick(r,c,editorGrid[r][c],ox,oy);
  var preview=getEditorPreview(ox,oy);
  if(preview&&preview.row>=0&&preview.col>=0&&preview.row<ROWS&&preview.col<COLS){
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=2;ctx.strokeRect(ox+preview.col*editorCellW+1,oy+preview.row*editorCellH+1,editorCellW-2,editorCellH-2);
    ctx.fillStyle=BRICK_COLORS[selectedColor]+"40";ctx.fillRect(ox+preview.col*editorCellW+2,oy+preview.row*editorCellH+2,editorCellW-4,editorCellH-4);
  }
}

/* Update */
function update(){
  if(state!=="playing")return;
  if(keysDown["ArrowLeft"]||keysDown["a"]||keysDown["A"])paddleX-=PADDLE_SPEED;
  if(keysDown["ArrowRight"]||keysDown["d"]||keysDown["D"])paddleX+=PADDLE_SPEED;
  paddleX=Math.max(0,Math.min(W-paddleW,paddleX));
  if(keysDown[" "]||keysDown["ArrowUp"]||keysDown["w"]||keysDown["W"])launchBall();

  if(!ballActive){ballX=paddleX+paddleW/2;ballY=paddleY-BALL_RADIUS-1;return;}
  ballX+=ballDX;ballY+=ballDY;
  if(ballX-BALL_RADIUS<=0){ballX=BALL_RADIUS;ballDX=Math.abs(ballDX);}
  if(ballX+BALL_RADIUS>=W){ballX=W-BALL_RADIUS;ballDX=-Math.abs(ballDX);}
  if(ballY-BALL_RADIUS<=0){ballY=BALL_RADIUS;ballDY=Math.abs(ballDY);}
  if(ballY+BALL_RADIUS>=H){
    lives--;updateHUD();
    if(lives<=0){state="lost";showMessage("Game Over","Final Score: "+score,"Click or press Play to restart");return;}
    resetBall();return;
  }

  /* Paddle hit */
  if(ballDY>0&&ballY+BALL_RADIUS>=paddleY&&ballY<=paddleY+paddleH+4&&ballX>=paddleX-BALL_RADIUS&&ballX<=paddleX+paddleW+BALL_RADIUS){
    var hp=(ballX-paddleX)/paddleW,a=Math.PI*(.75-.5*hp),spd=BALL_BASE_SPEED+Math.min(score/800,4);
    ballDX=Math.cos(a)*spd;ballDY=-Math.abs(Math.sin(a)*spd);ballY=paddleY-BALL_RADIUS-1;
  }

  /* Brick hit */
  outer:for(var r=ROWS-1;r>=0;r--)for(var c=COLS-1;c>=0;c--){
    if(grid[r][c]<0)continue;
    var p=gridToPixel(r,c),bx=p.x,by=p.y;
    var cx=Math.max(bx,Math.min(ballX,bx+brickW)),cy=Math.max(by,Math.min(ballY,by+brickH));
    if((ballX-cx)*(ballX-cx)+(ballY-cy)*(ballY-cy)<BALL_RADIUS*BALL_RADIUS){
      grid[r][c]=-1;score+=10+Math.max(0,5-r);updateHUD();bricksLeftEl.textContent=countBricks(grid);
      var ol=ballX+BALL_RADIUS-bx,or2=(bx+brickW)-(ballX-BALL_RADIUS),ot=ballY+BALL_RADIUS-by,ob=(by+brickH)-(ballY-BALL_RADIUS);
      if(Math.min(ol,or2)<Math.min(ot,ob))ballDX=-ballDX;else ballDY=-ballDY;
      var ns=BALL_BASE_SPEED+Math.min(score/300,5),cs=Math.sqrt(ballDX*ballDX+ballDY*ballDY);
      if(cs>0){ballDX=(ballDX/cs)*ns;ballDY=(ballDY/cs)*ns;}
      break outer;
    }
  }

  if(countBricks(grid)<=0){state="won";showMessage("You Win!","Score: "+score,"Press Play for next level");}
}

/* Render */
function render(){
  ctx.clearRect(0,0,W,H);
  if(state==="editor"){
    ctx.fillStyle="#0a0a1a";ctx.fillRect(0,0,W,H);
    var ox=(W-COLS*editorCellW)/2,oy=(H-ROWS*editorCellH)/2+20;
    drawEditorGrid(ox,oy);
    ctx.fillStyle="rgba(255,255,255,.35)";ctx.font="13px monospace";ctx.textAlign="center";
    ctx.fillText("Click/drag to place &bull; Right-click or Shift+click to erase &bull; Long-press on touch to erase",W/2,oy-8);ctx.textAlign="left";
  }else{
    ctx.fillStyle="#0a0a1a";ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,255,255,.03)";ctx.lineWidth=1;
    for(var r=0;r<=ROWS+1;r++){var p=gridToPixel(r,0);ctx.beginPath();ctx.moveTo(0,p.y-BRICK_PAD/2);ctx.lineTo(W,p.y-BRICK_PAD/2);ctx.stroke();}
    for(r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(grid[r][c]>=0)drawBrick(r,c,grid[r][c]);
    drawPaddle();drawBall();
    if(state==="paused"){ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(W/2-75,H/2-30,150,60);ctx.fillStyle="#fff";ctx.font="bold 26px sans-serif";ctx.textAlign="center";ctx.fillText("PAUSED",W/2,H/2+8);ctx.textAlign="left";}
    if((state==="game"||state==="paused")&&!ballActive){ctx.fillStyle="rgba(255,255,255,.35)";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("Press SPACE or click to launch",W/2,H-paddleH-50);ctx.textAlign="left";}
  }
}

function gameLoop(){update();render();animFrameId=requestAnimationFrame(gameLoop);}

/* HUD */
function updateHUD(){scoreDisplay.textContent=score;var s="";for(var i=0;i<MAX_LIVES;i++){s+="<span class='lives-pip' style='opacity:"+(i<lives?"1":".2")+"'></span>";}livesDisplay.innerHTML=s;levelNum.textContent=currentLevel;}
function updateEditorCount(){bricksPlacedEl.textContent="Bricks: "+countBricks(editorGrid);}

/* Message */
function showMessage(title,text){msgTitle.textContent=title;msgText.textContent=text;messageOverlay.classList.add("active");}
function hideMessage(){if(messageOverlay&&messageOverlay.classList)messageOverlay.classList.remove("active");}

/* Mode switching */
function setMode(m){
  state=m;hideMessage();
  if(m==="game"||m==="playing"||m==="paused"){
    var l=m==="playing"?"Playing":(m==="paused"?"Paused":"Game");modeIndicator.textContent=l;modeIndicator.className="mode-game";editorColorsEl.style.display="none";
  }else if(m==="editor"){
    copyGridToEditor();
    modeIndicator.textContent="Edit";modeIndicator.className="mode-edit";editorColorsEl.style.display="flex";updateEditorCount();
  }
}

/* Export/Import */
function exportLevel(){copyEditorToGrid();var d=JSON.stringify(grid,null,2);panelTitle.textContent="Export Level (JSON)";levelDataEl.value=d;levelPanel.classList.add("active");}
function importLevel(){panelTitle.textContent="Import Level (JSON)";levelDataEl.value=JSON.stringify(grid,null,2);levelPanel.classList.add("active");}

function handleExportOK(){levelPanel.classList.remove("active");}
function handleImportOK(){try{var d=JSON.parse(levelDataEl.value);if(!Array.isArray(d)||d.length!==ROWS||d[0].length!==COLS){alert("Invalid format: expected "+ROWS+" rows of "+COLS+" columns.");return;}for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){if(typeof d[r][c]!=="number"||d[r][c]<-1){alert("Invalid brick value at ["+r+","+c+"]: "+d[r][c]);return;}grid[r][c]=Math.floor(d[r][c]);}score=0;lives=MAX_LIVES;updateHUD();bricksLeftEl.textContent=countBricks();resetBall();state="game";modeIndicator.textContent="Game";modeIndicator.className="mode-game";}catch(e){alert("Invalid JSON: "+e.message);return;}levelPanel.classList.remove("active");}
function handleImportCancel(){levelPanel.classList.remove("active");}

/* Buttons */
btnPlay.addEventListener("click",function(){if(state==="editor")copyEditorToGrid();score=0;lives=MAX_LIVES;currentLevel++;updateHUD();bricksLeftEl.textContent=countBricks(grid);resetBall();hideMessage();setMode("playing");});
btnPause.addEventListener("click",function(){if(state==="playing")setMode("paused");else if(state==="paused")setMode("playing");});
btnEdit.addEventListener("click",function(){if(state==="editor"){copyEditorToGrid();score=0;lives=MAX_LIVES;updateHUD();bricksLeftEl.textContent=countBricks(grid);resetBall();setMode("game");}else setMode("editor");});
btnExport.addEventListener("click",exportLevel);
btnImport.addEventListener("click",importLevel);
btnClear.addEventListener("click",function(){if(state==="editor"){for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)editorGrid[r][c]=-1;updateEditorCount();}else{for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)grid[r][c]=-1;bricksLeftEl.textContent=countBricks();}});
panelOkBtn.addEventListener("click",function(){if(panelTitle.textContent==="Export Level (JSON)")handleExportOK();else handleImportOK();});
panelCancelBtn.addEventListener("click",handleImportCancel);

/* Color selection */
var colorBtns=document.querySelectorAll(".color-btn");for(var i=0;i<colorBtns.length;i++){(function(btn){btn.addEventListener("click",function(){selectedColor=parseInt(btn.dataset.color);for(var j=0;j<colorBtns.length;j++)colorBtns[j].classList.remove("active");btn.classList.add("active");});})(colorBtns[i]);}

/* Keyboard */
document.addEventListener("keydown",function(e){keysDown[e.key]=true;if(e.key==="Escape"){if(state==="editor")setMode("game");else if(state==="playing"||state==="paused")setMode(state==="playing"?"paused":"playing");}if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].indexOf(e.key)!==-1)e.preventDefault();if(e.altKey&&(e.key==="p"||e.key==="P")){e.preventDefault();btnPlay.click();return;}if(e.altKey&&(e.key==="e"||e.key==="E")){e.preventDefault();btnEdit.click();return;}if(e.altKey&&(e.key==="s"||e.key==="S")){e.preventDefault();exportLevel();return;}if(e.altKey&&(e.key==="l"||e.key==="L")){e.preventDefault();importLevel();return;}});
document.addEventListener("keyup",function(e){keysDown[e.key]=false;});

/* Mouse */
function getCanvasPos(cx,cy){var r=canvas.getBoundingClientRect();return{x:(cx-r.left)*(canvas.width/r.width),y:(cy-r.top)*(canvas.height/r.height)};}
function getEditorPreview(ox,oy){if(!mousePos)return null;var c=Math.floor((mousePos.x-ox)/editorCellW),r=Math.floor((mousePos.y-oy)/editorCellH);return{row:r,col:c};}

canvas.addEventListener("mousemove",function(e){mousePos=getCanvasPos(e.clientX,e.clientY);if(state==="editor"&&isMouseDown&&mousePos){var ox=(W-COLS*editorCellW)/2,oy=(H-ROWS*editorCellH)/2+20,c=Math.floor((mousePos.x-ox)/editorCellW),r=Math.floor((mousePos.y-oy)/editorCellH);if(r>=0&&c>=0&&r<ROWS&&c<COLS){editorGrid[r][c]=rightClickAction?-1:selectedColor;}updateEditorCount();}if((state==="game"||state==="playing")&&mousePos){paddleX=mousePos.x-paddleW/2;paddleX=Math.max(0,Math.min(W-paddleW,paddleX));}});

canvas.addEventListener("mousedown",function(e){e.preventDefault();isMouseDown=true;var pos=getCanvasPos(e.clientX,e.clientY);if(state==="editor"){rightClickAction=(e.button===2)||!!keysDown["Shift"];var ox=(W-COLS*editorCellW)/2,oy=(H-ROWS*editorCellH)/2+20,c=Math.floor((pos.x-ox)/editorCellW),r=Math.floor((pos.y-oy)/editorCellH);if(r>=0&&c>=0&&r<ROWS&&c<COLS){editorGrid[r][c]=rightClickAction?-1:selectedColor;}updateEditorCount();}else if((state==="game"||state==="playing"||state==="paused")&&pos){paddleX=pos.x-paddleW/2;paddleX=Math.max(0,Math.min(W-paddleW,paddleX));launchBall();}else if(state==="won"||state==="lost"){score=0;lives=MAX_LIVES;currentLevel++;updateHUD();bricksLeftEl.textContent=countBricks(grid);resetBall();hideMessage();setMode("playing");}});
canvas.addEventListener("mouseup",function(){isMouseDown=false;});
canvas.addEventListener("mouseleave",function(){isMouseDown=false;mousePos=null;});
canvas.addEventListener("contextmenu",function(e){e.preventDefault();});

/* Touch */
canvas.addEventListener("touchmove",function(e){e.preventDefault();var t=e.touches[0];if(!t)return;mousePos=getCanvasPos(t.clientX,t.clientY);if(state==="editor"&&isMouseDown&&mousePos){var ox=(W-COLS*editorCellW)/2,oy=(H-ROWS*editorCellH)/2+20,c=Math.floor((mousePos.x-ox)/editorCellW),r=Math.floor((mousePos.y-oy)/editorCellH);if(r>=0&&c>=0&&r<ROWS&&c<COLS){editorGrid[r][c]=selectedColor;}updateEditorCount();}if((state==="game"||state==="playing")&&mousePos){paddleX=mousePos.x-paddleW/2;paddleX=Math.max(0,Math.min(W-paddleW,paddleX));}}, {passive:false});
canvas.addEventListener("touchstart",function(e){e.preventDefault();isMouseDown=true;var t=e.touches[0];if(!t)return;mousePos=getCanvasPos(t.clientX,t.clientY);touchStartTime=Date.now();_touchTimer=null;touchStartCell={r:-1,c:-1};if(state==="editor"){var ox=(W-COLS*editorCellW)/2,oy=(H-ROWS*editorCellH)/2+20,c=Math.floor((mousePos.x-ox)/editorCellW),r=Math.floor((mousePos.y-oy)/editorCellH);if(r>=0&&c>=0&&r<ROWS&&c<COLS){touchStartCell={r:r,c:c};clearTimeout(_touchTimer);_touchTimer=setTimeout(function(){},500);}editorGrid[r][c]=selectedColor;updateEditorCount();}else if((state==="game"||state==="playing"||state==="paused")&&mousePos){paddleX=mousePos.x-paddleW/2;paddleX=Math.max(0,Math.min(W-paddleW,paddleX));launchBall();}else if(state==="won"||state==="lost"){score=0;lives=MAX_LIVES;currentLevel++;updateHUD();bricksLeftEl.textContent=countBricks(grid);resetBall();hideMessage();setMode("playing");}}, {passive:false});
canvas.addEventListener("touchend",function(){isMouseDown=false;clearTimeout(_touchTimer);_touchTimer=null;});
canvas.addEventListener("touchcancel",function(){isMouseDown=false;clearTimeout(_touchTimer);_touchTimer=null;});

/* Resize */
window.addEventListener("resize",function(){initDimensions();if(state!=="editor"){paddleY=H-paddleH-30;bricksLeftEl.textContent=countBricks(grid);}else updateEditorCount();});

/* Start */
initGame();updateHUD();bricksLeftEl.textContent=countBricks(grid);updateEditorCount();setMode("game");requestAnimationFrame(function loop(){update();render();animFrameId=requestAnimationFrame(loop);});
})();
</script>
</body>
</html>

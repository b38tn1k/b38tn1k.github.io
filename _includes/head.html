<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tells the browser dark is the intent, so scrollbars and form controls follow. -->
  <meta name="color-scheme" content="dark light">

  <title>{% if page.title and page.title != site.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }} &middot; {{ site.tagline }}{% endif %}</title>
  {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">

  <script>
    /* Applies a previously chosen theme before first paint so there is no flash.
       Without JS the stylesheet still follows the OS setting; only the manual
       override needs storing. */
    try {
      var t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">

  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/public/apple-touch-icon-precomposed.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/public/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/atom.xml' | relative_url }}">

  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/inv.png' | absolute_url }}">
</head>

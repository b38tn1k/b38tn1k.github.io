<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawer Organizer Tray Maker</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
#app { display: flex; width: 100%; height: 100%; }

/* Left Panel */
#controls { width: 320px; min-width: 320px; background: #16213e; padding: 16px; overflow-y: auto; border-right: 1px solid #0f3460; display: flex; flex-direction: column; gap: 8px; }
#controls h1 { font-size: 18px; color: #e94560; margin-bottom: 4px; text-align: center; }
.section { background: #0f3460; border-radius: 8px; padding: 12px; }
.section h2 { font-size: 13px; color: #e94560; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.param-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.param-row label { font-size: 12px; color: #a0a0b0; flex: 0 0 90px; }
.param-row input[type="number"] { width: 70px; padding: 4px 6px; border: 1px solid #533483; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; font-size: 12px; text-align: right; }
.param-row input[type="range"] { flex: 1; margin: 0 8px; accent-color: #e94560; height: 6px; }
.param-row .val { font-size: 11px; color: #e94560; min-width: 45px; text-align: right; }
#export-btn { background: #e94560; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: auto; }
#export-btn:hover { background: #c73652; }

/* Right Panel */
#preview-area { flex: 1; display: flex; flex-direction: column; position: relative; }
#canvas-container { flex: 1; position: relative; cursor: grab; }
#canvas-container:active { cursor: grabbing; }
#canvas-container canvas { width: 100%; height: 100%; display: block; }
#preview-hint { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #666; pointer-events: none; }

/* Bottom Panel */
#compartment-info { height: auto; min-height: 80px; background: #16213e; border-top: 1px solid #0f3460; padding: 10px 16px; display: flex; gap: 16px; align-items: center; overflow-x: auto; }
#compartment-info .info-block { background: #0f3460; border-radius: 6px; padding: 8px 12px; min-width: 120px; }
#compartment-info .info-block .label { font-size: 10px; color: #a0a0b0; text-transform: uppercase; letter-spacing: 0.5px; }
#compartment-info .info-block .value { font-size: 16px; color: #e94560; font-weight: bold; margin-top: 2px; }

/* Status */
#status { position: fixed; top: 8px; right: 8px; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; z-index: 1000; transition: all 0.3s; }
#status.success { background: #1b5e20; color: #a5d6a7; }
#status.error { background: #b71c1c; color: #ef9a9a; }
#status.pending { background: #f57f17; color: #fff9c4; }

/* Axis legend */
.axis-legend { position: absolute; top: 8px; left: 8px; font-size: 11px; pointer-events: none; }
.axis-legend span { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border-radius: 2px; vertical-align: middle; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; }
::-webkit-scrollbar-thumb { background: #533483; border-radius: 3px; }
</style>
</head>
<body>

<div id="status" class="pending">Running diagnostics...</div>

<div id="app">
  <div id="controls">
    <h1>📐 Tray Maker</h1>

    <div class="section">
      <h2>Outer Dimensions (mm)</h2>
      <div class="param-row">
        <label>Width (X)</label>
        <input type="range" id="outerW-slider" min="50" max="600" step="1" value="180">
        <input type="number" id="outerW-num" min="50" max="600" step="1" value="180">
      </div>
      <div class="param-row">
        <label>Depth (Y)</label>
        <input type="range" id="outerD-slider" min="50" max="400" step="1" value="120">
        <input type="number" id="outerD-num" min="50" max="400" step="1" value="120">
      </div>
      <div class="param-row">
        <label>Height (Z)</label>
        <input type="range" id="outerH-slider" min="10" max="200" step="1" value="30">
        <input type="number" id="outerH-num" min="10" max="200" step="1" value="30">
      </div>
    </div>

    <div class="section">
      <h2>Grid Layout</h2>
      <div class="param-row">
        <label>Columns (X)</label>
        <input type="range" id="cols-slider" min="1" max="20" step="1" value="3">
        <input type="number" id="cols-num" min="1" max="20" step="1" value="3">
      </div>
      <div class="param-row">
        <label>Rows (Y)</label>
        <input type="range" id="rows-slider" min="1" max="20" step="1" value="2">
        <input type="number" id="rows-num" min="1" max="20" step="1" value="2">
      </div>
    </div>

    <div class="section">
      <h2>Wall &amp; Floor (mm)</h2>
      <div class="param-row">
        <label>Wall Thickness</label>
        <input type="range" id="wall-slider" min="1" max="20" step="0.5" value="3">
        <input type="number" id="wall-num" min="1" max="20" step="0.5" value="3">
      </div>
      <div class="param-row">
        <label>Floor Thickness</label>
        <input type="range" id="floor-slider" min="1" max="20" step="0.5" value="3">
        <input type="number" id="floor-num" min="1" max="20" step="1" value="3">
      </div>
    </div>

    <button id="export-btn" title="Export as binary STL file">⬇ Export STL</button>
  </div>

  <div id="preview-area">
    <div id="canvas-container">
      <canvas id="preview-canvas"></canvas>
      <div class="axis-legend">
        <span style="background:#ff4444"></span>X
        <span style="background:#44ff44"></span>Y
        <span style="background:#4488ff"></span>Z
      </div>
      <div id="preview-hint">Drag to rotate · Scroll to zoom</div>
    </div>
  </div>

  <div id="compartment-info">
    <div class="info-block"><div class="label">Compartment Width</div><div class="value" id="ci-compW">—</div></div>
    <div class="info-block"><div class="label">Compartment Depth</div><div class="value" id="ci-compD">—</div></div>
    <div class="info-block"><div class="label">Compartment Height</div><div class="value" id="ci-compH">—</div></div>
    <div class="info-block"><div class="label">Total Compartments</div><div class="value" id="ci-total">—</div></div>
    <div class="info-block"><div class="label">Volume (L)</div><div class="value" id="ci-volume">—</div></div>
  </div>
</div>

<script>
/* ================================================================
   SECTION 1: PARAMETER MODEL
   ================================================================ */
const Params = {
  outerW: 180, outerD: 120, outerH: 30,
  cols: 3, rows: 2,
  wallT: 3, floorT: 3,

  syncUI() {
    const pairs = [
      ['outerW', this.outerW], ['outerD', this.outerD], ['outerH', this.outerH],
      ['cols', this.cols], ['rows', this.rows], ['wallT', this.wallT], ['floorT', this.floorT]
    ];
    for (const [key, val] of pairs) {
      const slider = document.getElementById(key + '-slider');
      const num = document.getElementById(key + '-num');
      if (slider) slider.value = val;
      if (num) num.value = val;
    }
  },

  readFromUI() {
    this.outerW = clamp(parseFloat(document.getElementById('outerW-num').value) || 180, 50, 600);
    this.outerD = clamp(parseFloat(document.getElementById('outerD-num').value) || 120, 50, 400);
    this.outerH = clamp(parseFloat(document.getElementById('outerH-num').value) || 30, 10, 200);
    this.cols   = clamp(parseInt(document.getElementById('cols-num').value) || 3, 1, 20);
    this.rows   = clamp(parseInt(document.getElementById('rows-num').value) || 2, 1, 20);
    this.wallT  = clamp(parseFloat(document.getElementById('wall-num').value) || 3, 1, 20);
    this.floorT = clamp(parseFloat(document.getElementById('floor-num').value) || 3, 1, 20);
  }
};

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ================================================================
   SECTION 2: COMPARTMENT CALCULATOR
   ================================================================ */
function calcCompartments(p) {
  const innerW = p.outerW - 2 * p.wallT;
  const innerD = p.outerD - 2 * p.wallT;
  const innerH = p.outerH - p.floorT;
  const compW = (innerW - (p.cols - 1) * p.wallT) / p.cols;
  const compD = (innerD - (p.rows - 1) * p.wallT) / p.rows;
  return { innerW, innerD, innerH, compW: Math.max(0, compW), compD: Math.max(0, compD), compH: Math.max(0, innerH) };
}

function updateCompartmentInfo() {
  const c = calcCompartments(Params);
  document.getElementById('ci-compW').textContent = c.compW.toFixed(1) + ' mm';
  document.getElementById('ci-compD').textContent = c.compD.toFixed(1) + ' mm';
  document.getElementById('ci-compH').textContent = c.compH.toFixed(1) + ' mm';
  document.getElementById('ci-total').textContent = Params.cols * Params.rows;
  const volL = (c.innerW * c.innerD * c.innerH) / 1e6;
  document.getElementById('ci-volume').textContent = volL.toFixed(2) + ' L';
}

/* ================================================================
   SECTION 3: VECTOR & PLANE MATH
   ================================================================ */
class Vec3 {
  constructor(x=0, y=0, z=0) { this.x=x; this.y=y; this.z=z; }
  clone() { return new Vec3(this.x, this.y, this.z); }
  add(v) { return new Vec3(this.x+v.x, this.y+v.y, this.z+v.z); }
  sub(v) { return new Vec3(this.x-v.x, this.y-v.y, this.z-v.z); }
  mul(s) { return new Vec3(this.x*s, this.y*s, this.z*s); }
  dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
  cross(v) { return new Vec3(this.y*v.z-this.z*v.y, this.z*v.x-this.x*v.z, this.x*v.y-this.y*v.x); }
  len() { return Math.sqrt(this.x*this.x + this.y*this.y + this.z*this.z); }
  normalize() { const l=this.len(); if(l<1e-10) return new Vec3(0,0,1); return this.mul(1/l); }
}

class Plane {
  constructor(normal, w) { this.normal = normal; this.w = w; }
  clone() { return new Plane(this.normal.slice(), this.w); }
  flip() { this.normal[0]*=-1; this.normal[1]*=-1; this.normal[2]*=-1; this.w *= -1; }
}

/* ================================================================
   SECTION 4: BSP TREE (Corrected CSG)
   Based on the classic "Constructive Solid Geometry" algorithm.
   ================================================================ */
const EPS = 1e-6;
const COPLANAR=0, FRONT=1, BACK=2, SPANNING=3;

class Polygon {
  constructor(vertices, normal) {
    this.vertices = vertices;
    this.normal = normal || this.computeNormal();
  }
  clone() { return new Polygon(this.vertices.map(v=>v.clone()), this.normal ? this.normal.clone() : null); }
  computeNormal() {
    const a=this.vertices[0], b=this.vertices[1], c=this.vertices[2];
    return (b.sub(a)).cross(c.sub(a)).normalize();
  }
  getPlane() { return new Plane(this.normal.slice(), this.normal.dot(this.vertices[0])); }
}

class BSPNode {
  constructor(polygons) {
    this.plane = null;
    this.front = null;
    this.back = null;
    this.polygons = [];
    if (polygons && polygons.length > 0) this.build(polygons);
  }

  clone() {
    const n = new BSPNode();
    n.plane = this.plane ? new Plane(this.plane.normal.slice(), this.plane.w) : null;
    n.front = this.front ? this.front.clone() : null;
    n.back = this.back ? this.back.clone() : null;
    n.polygons = this.polygons.map(p => p.clone());
    return n;
  }

  build(polygons) {
    if (polygons.length === 0) return;
    // Use first polygon as pivot plane
    const pivot = polygons[0];
    this.plane = pivot.getPlane();
    const frontPolys = [], backPolys = [], coplanarFront = [], coplanarBack = [];

    for (let i = 1; i < polygons.length; i++) {
      const poly = polygons[i];
      const side = this.classifyPolygon(poly);
      if (side === FRONT) frontPolys.push(poly);
      else if (side === BACK) backPolys.push(poly);
      else if (side === COPLANAR) {
        if (this.plane.normal.dot(poly.normal) > 0) coplanarFront.push(poly);
        else coplanarBack.push(poly);
      }
      else { // SPANNING
        const split = this.splitPolygon(poly);
        if (split.front.length > 0) frontPolys.push(...split.front);
        if (split.back.length > 0) backPolys.push(...split.back);
      }
    }

    // Add coplanar polygons to appropriate child
    if (coplanarFront.length > 0) {
      this.polygons = this.polygons.concat(coplanarFront);
      if (coplanarBack.length > 0) {
        if (!this.back) this.back = new BSPNode();
        this.back.build(coplanarBack);
      }
    } else {
      if (coplanarBack.length > 0) {
        this.polygons = this.polygons.concat(coplanarBack);
      }
    }

    // Recursively build children
    if (frontPolys.length > 0) this.front = new BSPNode(frontPolys);
    if (backPolys.length > 0) this.back = new BSPNode(backPolys);
  }

  classifyPolygon(poly) {
    let types = [];
    for (let i = 0; i < poly.vertices.length; i++) {
      const d = this.plane.normal.dot(poly.vertices[i]) - this.plane.w;
      types.push(d > EPS ? FRONT : d < -EPS ? BACK : COPLANAR);
    }
    if (types.every(t => t === FRONT)) return FRONT;
    if (types.every(t => t === BACK)) return BACK;
    if (types.every(t => t === COPLANAR)) return COPLANAR;
    return SPANNING;
  }

  splitPolygon(poly) {
    const result = { front: [], back: [] };
    const verts = poly.vertices;
    const len = verts.length;

    for (let i = 0; i < len; i++) {
      const j = (i + 1) % len;
      const ti = this.classifyVertex(verts[i]);
      const tj = this.classifyVertex(verts[j]);

      if (ti !== BACK && tj !== BACK) result.front.push(verts[i]);
      if (ti !== FRONT && tj !== FRONT) result.back.push(verts[i]);

      if ((ti === FRONT && tj === BACK) || (ti === BACK && tj === FRONT)) {
        const d = (this.plane.w - this.plane.normal.dot(verts[i])) /
                  this.plane.normal.dot(verts[i].sub(verts[j]));
        const interp = verts[i].add(verts[j].sub(verts[i]).mul(d));
        result.front.push(interp.clone());
        result.back.push(interp.clone());
      }
    }

    if (result.front.length >= 3) {
      result.front = this.triangulate(result.front, poly.normal);
    }
    if (result.back.length >= 3) {
      result.back = this.triangulate(result.back, poly.normal);
    }
    return result;
  }

  classifyVertex(v) {
    const d = this.plane.normal.dot(v) - this.plane.w;
    return d > EPS ? FRONT : d < -EPS ? BACK : COPLANAR;
  }

  triangulate(verts, normal) {
    // Fan triangulation of a convex polygon
    const result = [];
    for (let i = 1; i < verts.length - 1; i++) {
      result.push(new Polygon([verts[0].clone(), verts[i].clone(), verts[i+1].clone()], normal));
    }
    return result;
  }

  toPolygons() {
    let result = this.polygons.map(p => p.clone());
    if (this.front) result = result.concat(this.front.toPolygons());
    if (this.back) result = result.concat(this.back.toPolygons());
    return result;
  }

  invert() {
    for (let i = 0; i < this.polygons.length; i++) {
      this.polygons[i].vertices.reverse();
      const n = this.polygons[i].normal;
      n[0]*=-1; n[1]*=-1; n[2]*=-1;
    }
    if (this.plane) this.plane.flip();
    if (this.front) this.front.invert();
    if (this.back) this.back.invert();
    const tmp = this.front; this.front = this.back; this.back = tmp;
  }

  clipPolygons(polygons) {
    if (!this.plane) return polygons.slice();
    let frontList = [], backList = [];
    for (const poly of polygons) {
      const split = this.splitPolygon(poly);
      if (split.front.length > 0) frontList.push(...split.front);
      if (split.back.length > 0) backList.push(...split.back);
    }
    let result = [];
    if (this.front) result = result.concat(this.front.clipPolygons(frontList));
    else result = result.concat(frontList);
    return result;
  }
}

/* Boolean union: A ∪ B */
function csgUnion(a, b) {
  // Clip A's inside against B
  const aClip = a.clone();
  aClip.invert();
  aClip.polygons = aClip.clipPolygons(b.toPolygons());
  aClip.invert();

  // Clip B's inside against A
  const bClip = b.clone();
  bClip.invert();
  bClip.polygons = bClip.clipPolygons(a.toPolygons());
  bClip.invert();

  // Result is the union of both clipped trees
  const result = new BSPNode();
  result.polygons = aClip.toPolygons().concat(bClip.toPolygons());
  return result;
}

/* ================================================================
   SECTION 5: TRAY GEOMETRY GENERATOR
   Build tray from individual solid boxes and union them.
   ================================================================ */
function createBox(x0,y0,z0,x1,y1,z1) {
  const polys = [];
  // +X face (right)
  polys.push(new Polygon([new Vec3(x1,y0,z0), new Vec3(x1,y1,z0), new Vec3(x1,y1,z1), new Vec3(x1,y0,z1)]));
  // -X face (left)
  polys.push(new Polygon([new Vec3(x0,y1,z0), new Vec3(x0,y0,z0), new Vec3(x0,y0,z1), new Vec3(x0,y1,z1)]));
  // +Y face (back)
  polys.push(new Polygon([new Vec3(x0,y1,z0), new Vec3(x1,y1,z0), new Vec3(x1,y1,z1), new Vec3(x0,y1,z1)]));
  // -Y face (front)
  polys.push(new Polygon([new Vec3(x1,y0,z0), new Vec3(x0,y0,z0), new Vec3(x0,y0,z1), new Vec3(x1,y0,z1)]));
  // +Z face (top)
  polys.push(new Polygon([new Vec3(x0,y0,z1), new Vec3(x1,y0,z1), new Vec3(x1,y1,z1), new Vec3(x0,y1,z1)]));
  // -Z face (bottom)
  polys.push(new Polygon([new Vec3(x1,y0,z0), new Vec3(x1,y1,z0), new Vec3(x0,y1,z0), new Vec3(x0,y0,z0)]));
  return polys;
}

function generateTrayGeometry(p) {
  const W = p.outerW, D = p.outerD, H = p.outerH;
  const wt = p.wallT, ft = p.floorT;
  const cols = p.cols, rows = p.rows;

  let result = null;

  function addBox(x0,y0,z0,x1,y1,z1) {
    const polys = createBox(x0,y0,z0,x1,y1,z1);
    if (!result) {
      result = new BSPNode(polys);
    } else {
      result = csgUnion(result, new BSPNode(polys));
    }
  }

  // Floor plate (full width × depth, thickness ft)
  addBox(0, 0, 0, W, D, ft);

  // Back wall (along X at Y=D-wt to D)
  addBox(0, D-wt, 0, W, D, H);
  // Front wall (along X at Y=0 to wt)
  addBox(0, 0, 0, W, wt, H);
  // Left wall (along Z at X=0 to wt)
  addBox(0, 0, 0, wt, D, H);
  // Right wall (along Z at X=W-wt to W)
  addBox(W-wt, 0, 0, W, D, H);

  // Vertical dividers (along Y direction, spaced along X)
  const innerW = W - 2*wt;
  if (cols > 1 && innerW > wt * (cols-1)) {
    const spacing = innerW / cols;
    for (let i = 1; i < cols; i++) {
      const dx = wt + i * spacing - wt/2;
      addBox(dx, 0, ft, dx+wt, D-wt, H);
    }
  }

  // Horizontal dividers (along X direction, spaced along Y)
  const innerD = D - 2*wt;
  if (rows > 1 && innerD > wt * (rows-1)) {
    const spacing = innerD / rows;
    for (let i = 1; i < rows; i++) {
      const dy = wt + i * spacing - wt/2;
      addBox(wt, dy, ft, W-wt, dy+wt, H);
    }
  }

  return result ? result.toPolygons() : [];
}

/* ================================================================
   SECTION 6: STL EXPORTER (Binary Format)
   ================================================================ */
function exportSTL(polygons) {
  const triangles = [];
  for (const poly of polygons) {
    if (poly.vertices.length < 3) continue;
    for (let i = 1; i < poly.vertices.length - 1; i++) {
      triangles.push([poly.vertices[0], poly.vertices[i], poly.vertices[i+1]]);
    }
  }

  const numTriangles = triangles.length;
  const bufferSize = 80 + 4 + numTriangles * 50;
  const buffer = new ArrayBuffer(bufferSize);
  const view = new DataView(buffer);

  // Zero header (80 bytes)
  for (let i = 0; i < 80; i++) view.setUint8(i, 0);

  // Triangle count (little-endian uint32 at offset 80)
  view.setUint32(80, numTriangles, true);

  let offset = 84;
  for (const tri of triangles) {
    const e1 = tri[1].sub(tri[0]);
    const e2 = tri[2].sub(tri[0]);
    const n = e1.cross(e2).normalize();

    view.setFloat32(offset, n.x, true); offset += 4;
    view.setFloat32(offset, n.y, true); offset += 4;
    view.setFloat32(offset, n.z, true); offset += 4;

    for (const v of tri) {
      view.setFloat32(offset, v.x, true); offset += 4;
      view.setFloat32(offset, v.y, true); offset += 4;
      view.setFloat32(offset, v.z, true); offset += 4;
    }

    view.setUint16(offset, 0, true); offset += 2; // attribute byte count
  }

  return buffer;
}

function downloadSTL(polygons) {
  const buffer = exportSTL(polygons);
  const blob = new Blob([buffer], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tray_' + Params.outerW + 'x' + Params.outerD + 'x' + Params.outerH + '_' + Params.cols + 'x' + Params.rows + '.stl';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================================================================
   SECTION 7: 3D PREVIEW RENDERER (Canvas2D)
   ================================================================ */
class PreviewRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.rotationX = -0.5;
    this.rotationY = 0.6;
    this.zoom = 1.0;
    this.dragging = false;
    this.lastX = 0;
    this.lastY = 0;
    this.triangles = [];
    this.w = 0;
    this.h = 0;
    this.setupEvents();
    this.resize();
  }

  resize() {
    const container = this.canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = container.clientWidth * dpr;
    this.canvas.height = container.clientHeight * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = container.clientWidth;
    this.h = container.clientHeight;
    this.render();
  }

  setupEvents() {
    const c = this.canvas;
    c.addEventListener('mousedown', (e) => { this.dragging = true; this.lastX = e.clientX; this.lastY = e.clientY; });
    window.addEventListener('mousemove', (e) => {
      if (!this.dragging) return;
      const dx = e.clientX - this.lastX;
      const dy = e.clientY - this.lastY;
      this.rotationY += dx * 0.008;
      this.rotationX += dy * 0.008;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      this.render();
    });
    window.addEventListener('mouseup', () => { this.dragging = false; });
    c.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoom *= e.deltaY > 0 ? 0.92 : 1.08;
      this.zoom = Math.max(0.1, Math.min(10, this.zoom));
      this.render();
    }, { passive: false });

    c.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        this.dragging = true;
        this.lastX = e.touches[0].clientX;
        this.lastY = e.touches[0].clientY;
      }
    }, { passive: false });
    c.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!this.dragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - this.lastX;
      const dy = e.touches[0].clientY - this.lastY;
      this.rotationY += dx * 0.008;
      this.rotationX += dy * 0.008;
      this.lastX = e.touches[0].clientX;
      this.lastY = e.touches[0].clientY;
      this.render();
    }, { passive: false });
    c.addEventListener('touchend', () => { this.dragging = false; });

    window.addEventListener('resize', () => this.resize());
  }

  setTriangles(triangles) {
    this.triangles = triangles;
    this.render();
  }

  project(v) {
    let x = v.x * Math.cos(this.rotationY) - v.z * Math.sin(this.rotationY);
    let z = v.x * Math.sin(this.rotationY) + v.z * Math.cos(this.rotationY);
    let y = v.y;

    const y2 = y * Math.cos(this.rotationX) - z * Math.sin(this.rotationX);
    const z2 = y * Math.sin(this.rotationX) + z * Math.cos(this.rotationX);

    const fov = 500 * this.zoom;
    const dist = 400;
    const scale = fov / (dist + z2);

    return { x: this.w/2 + x * scale, y: this.h/2 - y2 * scale };
  }

  render() {
    const ctx = this.ctx;
    if (!ctx) return;
    ctx.clearRect(0, 0, this.w, this.h);

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, this.h);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(1, '#16213e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.w, this.h);

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < this.w; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.h); ctx.stroke();
    }
    for (let y = 0; y < this.h; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.w, y); ctx.stroke();
    }

    if (this.triangles.length === 0) return;

    // Sort by depth (painter's algorithm)
    const sorted = this.triangles.map(tri => {
      const avgZ = (tri[0].z + tri[1].z + tri[2].z) / 3;
      return { tri, z: avgZ };
    }).sort((a, b) => a.z - b.z);

    for (const { tri } of sorted) {
      const p0 = this.project(tri[0]);
      const p1 = this.project(tri[1]);
      const p2 = this.project(tri[2]);

      // Back-face culling via screen-space cross product
      const e1x = p1.x - p0.x, e1y = p1.y - p0.y;
      const e2x = p2.x - p0.x, e2y = p2.y - p0.y;
      if (e1x * e2y - e1y * e2x < 0) continue;

      // Lighting from world-space normal
      const e1w = tri[1].sub(tri[0]);
      const e2w = tri[2].sub(tri[0]);
      let n = e1w.cross(e2w).normalize();

      const lightDir = new Vec3(0.5, 0.7, 0.5).normalize();
      let intensity = Math.max(0, n.dot(lightDir));
      intensity = 0.3 + 0.7 * intensity;

      const r = Math.round(233 * intensity);
      const g = Math.round(69 * intensity);
      const b = Math.round(96 * intensity);

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.closePath();
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 0.5;
      ctx.stroke();
    }

    this.drawAxisIndicator();
  }

  drawAxisIndicator() {
    const cx = 40, cy = this.h - 40;
    const len = 25;
    const axes = [
      { dir: new Vec3(1,0,0), color: '#ff4444', label: 'X' },
      { dir: new Vec3(0,1,0), color: '#44ff44', label: 'Y' },
      { dir: new Vec3(0,0,1), color: '#4488ff', label: 'Z' }
    ];

    for (const axis of axes) {
      let x = axis.dir.x * Math.cos(this.rotationY) - axis.dir.z * Math.sin(this.rotationY);
      let z = axis.dir.x * Math.sin(this.rotationY) + axis.dir.z * Math.cos(this.rotationY);
      let y = axis.dir.y;
      const y2 = y * Math.cos(this.rotationX) - z * Math.sin(this.rotationX);
      const z2 = y * Math.sin(this.rotationX) + z * Math.cos(this.rotationX);

      const endX = cx + x * len;
      const endY = cy - y2 * len;

      this.ctx.beginPath();
      this.ctx.moveTo(cx, cy);
      this.ctx.lineTo(endX, endY);
      this.ctx.strokeStyle = axis.color;
      this.ctx.lineWidth = 2;
      this.ctx.stroke();

      this.ctx.fillStyle = axis.color;
      this.ctx.font = '10px sans-serif';
      this.ctx.fillText(axis.label, endX + 3, endY - 3);
    }
  }
}

/* ================================================================
   SECTION 8: UI WIRING
   ================================================================ */
function setupUI() {
  const bind = (sliderId, numId, key) => {
    const slider = document.getElementById(sliderId);
    const num = document.getElementById(numId);
    if (!slider || !num) return;
    slider.addEventListener('input', () => {
      Params[key] = parseFloat(slider.value);
      num.value = slider.value;
      onParamChange();
    });
    num.addEventListener('input', () => {
      Params[key] = parseFloat(num.value) || Params[key];
      slider.value = Params[key];
      onParamChange();
    });
  };

  bind('outerW-slider','outerW-num','outerW');
  bind('outerD-slider','outerD-num','outerD');
  bind('outerH-slider','outerH-num','outerH');
  bind('cols-slider','cols-num','cols');
  bind('rows-slider','rows-num','rows');
  bind('wall-slider','wall-num','wallT');
  bind('floor-slider','floor-num','floorT');

  document.getElementById('export-btn').addEventListener('click', () => {
    const polys = generateTrayGeometry(Params);
    if (polys.length === 0) {
      alert('Cannot generate geometry with current parameters.');
      return;
    }
    downloadSTL(polys);
  });

  onParamChange();
}

function onParamChange() {
  Params.readFromUI();
  updateCompartmentInfo();
  rebuildPreview();
}

let previewRenderer = null;

function rebuildPreview() {
  const polys = generateTrayGeometry(Params);
  if (polys.length === 0) return;

  const triangles = [];
  for (const poly of polys) {
    if (poly.vertices.length < 3) continue;
    for (let i = 1; i < poly.vertices.length - 1; i++) {
      triangles.push([poly.vertices[0], poly.vertices[i], poly.vertices[i+1]]);
    }
  }

  if (!previewRenderer) {
    previewRenderer = new PreviewRenderer(document.getElementById('preview-canvas'));
  }
  previewRenderer.setTriangles(triangles);
}

/* ================================================================
   SECTION 9: SELF-VERIFICATION
   ================================================================ */
function runVerification() {
  const statusEl = document.getElementById('status');
  const results = [];
  let allPassed = true;

  // Test 1: DOM structure
  try {
    const requiredIds = ['controls','preview-area','canvas-container','preview-canvas',
      'compartment-info','export-btn','status'];
    for (const id of requiredIds) {
      if (!document.getElementById(id)) throw new Error('Missing element: ' + id);
    }
    results.push('DOM structure: OK');
  } catch(e) { results.push('DOM structure: FAIL - ' + e.message); allPassed = false; }

  // Test 2: Parameter model
  try {
    const testParams = { outerW:180,outerD:120,outerH:30,cols:3,rows:2,wallT:3,floorT:3 };
    for (const [k,v] of Object.entries(testParams)) {
      if (typeof Params[k] !== 'number') throw new Error('Param ' + k + ' not a number');
    }
    results.push('Parameter model: OK');
  } catch(e) { results.push('Parameter model: FAIL - ' + e.message); allPassed = false; }

  // Test 3: Compartment calculation
  try {
    const c = calcCompartments(Params);
    if (c.compW <= 0 || c.compD <= 0 || c.compH <= 0) throw new Error('Invalid compartment dims');
    results.push('Compartment calc: OK (' + c.compW.toFixed(1) + 'x' + c.compD.toFixed(1) + 'x' + c.compH.toFixed(1) + ')');
  } catch(e) { results.push('Compartment calc: FAIL - ' + e.message); allPassed = false; }

  // Test 4: Geometry generation
  try {
    const polys = generateTrayGeometry(Params);
    if (polys.length === 0) throw new Error('No polygons generated');
    results.push('Geometry generation: OK (' + polys.length + ' polygons)');
  } catch(e) { results.push('Geometry generation: FAIL - ' + e.message); allPassed = false; }

  // Test 5: STL export validation
  try {
    const polys = generateTrayGeometry(Params);
    const buffer = exportSTL(polys);
    const view = new DataView(buffer);
    if (buffer.byteLength < 84) throw new Error('Buffer too small');
    const triCount = view.getUint32(80, true);
    if (triCount === 0) throw new Error('Zero triangles in STL');
    const expectedSize = 84 + triCount * 50;
    if (buffer.byteLength !== expectedSize) throw new Error('STL buffer size mismatch: ' + buffer.byteLength + ' vs ' + expectedSize);
    results.push('STL export validation: OK (' + triCount + ' triangles, ' + buffer.byteLength + ' bytes)');
  } catch(e) { results.push('STL export: FAIL - ' + e.message); allPassed = false; }

  // Test 6: Canvas2D context
  try {
    const canvas = document.getElementById('preview-canvas');
    if (!canvas || !canvas.getContext) throw new Error('Canvas element missing');
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('Canvas2D context unavailable');
    results.push('Canvas2D renderer: OK');
  } catch(e) { results.push('Canvas2D: FAIL - ' + e.message); allPassed = false; }

  // Test 7: Default values match spec
  try {
    if (Params.outerW !== 180 || Params.outerD !== 120 || Params.outerH !== 30) throw new Error('Default dims wrong');
    if (Params.cols !== 3 || Params.rows !== 2) throw new Error('Default grid wrong');
    results.push('Default values: OK (180x120x30, 3x2 grid)');
  } catch(e) { results.push('Default values: FAIL - ' + e.message); allPassed = false; }

  // Test 8: Wall/floor thickness validation
  try {
    const testP = Object.assign({}, Params);
    testP.wallT = 50;
    const c2 = calcCompartments(testP);
    if (c2.compW < 0) throw new Error('Negative compartment with thick walls');
    results.push('Thickness validation: OK');
  } catch(e) { results.push('Thickness validation: FAIL - ' + e.message); allPassed = false; }

  // Test 9: STL header bytes (first 80 should be zero)
  try {
    const polys = generateTrayGeometry(Params);
    const buffer = exportSTL(polys);
    let headerZero = true;
    for (let i = 0; i < 80; i++) {
      if (buffer[i] !== 0) { headerZero = false; break; }
    }
    if (!headerZero) throw new Error('STL header not zeroed');
    results.push('STL header: OK (zeroed)');
  } catch(e) { results.push('STL header: FAIL - ' + e.message); allPassed = false; }

  // Test 10: No external dependencies
  try {
    const scripts = document.querySelectorAll('script[src]');
    if (scripts.length > 0) throw new Error('Found ' + scripts.length + ' external script tags');
    results.push('No external deps: OK');
  } catch(e) { results.push('External deps: FAIL - ' + e.message); allPassed = false; }

  // Test 11: CSG union produces valid output
  try {
    const box1Polys = createBox(0,0,0,10,10,10);
    const box2Polys = createBox(5,5,5,15,15,15);
    const bsp1 = new BSPNode(box1Polys);
    const bsp2 = new BSPNode(box2Polys);
    const union = csgUnion(bsp1, bsp2);
    const unionPolys = union.toPolygons();
    if (unionPolys.length === 0) throw new Error('Empty union result');
    // Verify each polygon has at least 3 vertices
    for (const p of unionPolys) {
      if (p.vertices.length < 3) throw new Error('Polygon with < 3 vertices in union result');
    }
    results.push('CSG union: OK (' + unionPolys.length + ' polygons from 2 boxes)');
  } catch(e) { results.push('CSG union: FAIL - ' + e.message); allPassed = false; }

  // Test 12: STL triangle count matches polygon triangulation
  try {
    const polys = generateTrayGeometry(Params);
    let expectedTri = 0;
    for (const p of polys) {
      if (p.vertices.length >= 3) expectedTri += p.vertices.length - 2;
    }
    const buffer = exportSTL(polys);
    const view = new DataView(buffer);
    const actualTri = view.getUint32(80, true);
    if (expectedTri !== actualTri) throw new Error('Triangle count mismatch: expected ' + expectedTri + ' got ' + actualTri);
    results.push('Triangle count consistency: OK (' + actualTri + ' triangles)');
  } catch(e) { results.push('Triangle count: FAIL - ' + e.message); allPassed = false; }

  // Display results
  const resultText = results.join(' | ');
  if (allPassed) {
    statusEl.textContent = '✓ ALL CHECKS PASSED (' + results.length + '/' + results.length + ')';
    statusEl.className = 'success';
  } else {
    statusEl.textContent = '✗ SOME CHECKS FAILED: ' + resultText;
    statusEl.className = 'error';
  }

  console.log('=== Verification Results ===');
  results.forEach(r => console.log('  ' + r));
  console.log('===========================');
}

/* ================================================================
   INITIALIZATION
   ================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  setupUI();
  setTimeout(() => { runVerification(); }, 100);
});
</script>

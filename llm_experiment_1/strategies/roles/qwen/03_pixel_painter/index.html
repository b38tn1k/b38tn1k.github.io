<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Painter</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-dark: #1a1a2e;
    --bg-panel: #16213e;
    --bg-input: #0f3460;
    --bg-button: #533483;
    --bg-button-hover: #6b44a0;
    --text-primary: #e2e2e2;
    --text-muted: #9a9ab0;
    --border-color: #2a2a4a;
    --accent: #e94560;
    --canvas-bg: #e8e8e8;
    --checker-light: #cccccc;
    --checker-dark: #aaaaaa;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ---- Toolbar ---- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    z-index: 10;
    min-height: 48px;
  }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-right: 1px solid var(--border-color);
  }
  .toolbar-group:last-child { border-right: none; }

  .toolbar-group label {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  input[type="number"], input[type="text"] {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    width: 60px;
    text-align: center;
  }
  input[type="number"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  select {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }

  button {
    background: var(--bg-button);
    color: var(--text-primary);
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s;
  }
  button:hover { background: var(--bg-button-hover); }
  button:active { transform: scale(0.97); }

  .tool-btn {
    min-width: 36px;
    height: 34px;
    padding: 4px 8px;
    justify-content: center;
    font-size: 16px;
    position: relative;
  }
  .tool-btn.active {
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(233,69,96,0.4);
  }

  /* Tooltip */
  [data-tooltip] {
    position: relative;
  }
  [data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: var(--text-primary);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
  }
  [data-tooltip]:hover::after { opacity: 1; }

  /* ---- Main area ---- */
  .main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ---- Sidebar (palette) ---- */
  .sidebar {
    width: 240px;
    min-width: 200px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 10px;
    gap: 12px;
  }

  .sidebar-section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  /* Current color display */
  .current-color-display {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    border: 2px solid var(--border-color);
    margin-bottom: 6px;
    position: relative;
    background-image:
      linear-gradient(45deg, var(--checker-light) 25%, transparent 25%),
      linear-gradient(-45deg, var(--checker-light) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--checker-light) 75%),
      linear-gradient(-45deg, transparent 75%, var(--checker-light) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
  }
  .current-color-display .color-preview {
    position: absolute;
    inset: 4px;
    border-radius: 4px;
  }

  .color-picker-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .color-picker-wrap input[type="color"] {
    width: 48px;
    height: 36px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    padding: 0;
  }
  .color-picker-wrap input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  .color-picker-wrap input[type="color"]::-webkit-color-swatch { border-radius: 3px; border: 1px solid var(--border-color); }

  /* Color grid */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
  }
  .color-swatch {
    aspect-ratio: 1;
    border-radius: 3px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
    padding: 0;
    background: none;
  }
  .color-swatch:hover { transform: scale(1.15); z-index: 1; }
  .color-swatch.active {
    border-color: white;
    box-shadow: 0 0 0 2px var(--accent);
  }

  /* ---- Canvas area ---- */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    background: #12122a;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }

  .canvas-container {
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    touch-action: none;
  }

  /* Checkerboard behind canvas */
  .canvas-container::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background-image:
      linear-gradient(45deg, var(--checker-dark) 25%, transparent 25%),
      linear-gradient(-45deg, var(--checker-dark) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--checker-dark) 75%),
      linear-gradient(-45deg, transparent 75%, var(--checker-light) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }

  /* ---- Info bar ---- */
  .info-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 12px;
    background: var(--bg-panel);
    border-top: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .info-bar span { white-space: nowrap; }
  .undo-info { color: var(--text-primary); }

  /* ---- Zoom slider ---- */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--bg-input);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* ---- Responsive ---- */
  @media (max-width: 768px) {
    .sidebar {
      width: 180px;
      min-width: 0;
      padding: 6px;
      gap: 8px;
    }
    .color-grid { grid-template-columns: repeat(6, 1fr); }
    .toolbar { padding: 4px 8px; gap: 4px; }
  }

  @media (max-width: 540px) {
    .main-area { flex-direction: column; }
    .sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--border-color);
      max-height: 200px;
      flex-direction: row;
      flex-wrap: wrap;
      overflow-x: auto;
    }
    .sidebar-section { min-width: 140px; flex: 1; }
    .canvas-area { min-height: 300px; }
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-dark); }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--bg-button); }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-group">
    <label for="canvasW">Size:</label>
    <input type="number" id="canvasW" value="32" min="1" max="512" title="Canvas width in pixels">
    <span>x</span>
    <input type="number" id="canvasH" value="32" min="1" max="512" title="Canvas height in pixels">
    <button id="applySizeBtn" data-tooltip="Apply canvas size">Apply</button>
  </div>

  <div class="toolbar-group">
    <label>Preset:</label>
    <select id="sizePreset">
      <option value="8x8">8 × 8</option>
      <option value="16x16">16 × 16</option>
      <option value="32x32" selected>32 × 32</option>
      <option value="48x48">48 × 48</option>
      <option value="64x64">64 × 64</option>
      <option value="128x128">128 × 128</option>
    </select>
  </div>

  <div class="toolbar-group">
    <label>Tool:</label>
    <button class="tool-btn active" id="brushBtn" data-tool="brush" data-tooltip="Brush (B)">🖌️</button>
    <button class="tool-btn" id="eraserBtn" data-tool="eraser" data-tooltip="Eraser (E)">🧹</button>
  </div>

  <div class="toolbar-group">
    <label>Brush:</label>
    <select id="brushSize">
      <option value="1" selected>1×1</option>
      <option value="2">2×2</option>
      <option value="3">3×3</option>
    </select>
  </div>

  <div class="toolbar-group">
    <button id="undoBtn" data-tooltip="Undo (Ctrl+Z / Cmd+Z)">↩️ Undo</button>
    <button id="redoBtn" data-tooltip="Redo (Ctrl+Shift+Z)">↪️ Redo</button>
  </div>

  <div class="toolbar-group">
    <button id="clearBtn" data-tooltip="Clear canvas">🗑️ Clear</button>
    <button id="downloadBtn" data-tooltip="Download as PNG">⬇️ PNG</button>
  </div>
</div>

<!-- Main area -->
<div class="main-area">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Color</h3>
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
        <div class="current-color-display" id="currentColorDisplay">
          <div class="color-preview" id="currentColorPreview"></div>
        </div>
        <div class="color-picker-wrap" style="flex-direction:column; align-items:flex-start;">
          <label style="font-size:11px; color:var(--text-muted);">Custom</label>
          <input type="color" id="customColorPicker" value="#000000">
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Palette</h3>
      <div class="color-grid" id="colorGrid"></div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="pixelCanvas"></canvas>
    </div>
  </div>
</div>

<!-- Info bar -->
<div class="info-bar">
  <span id="cursorInfo">0, 0</span>
  <span>|</span>
  <span class="undo-info" id="undoCount">Undo: 0 steps</span>
  <span>|</span>
  <span>ZOOM:</span>
  <input type="range" id="zoomSlider" min="1" max="20" value="16" style="width:100px;">
  <span id="zoomValue">16×</span>
</div>

<script>
(function() {
  'use strict';

  // === Configuration ===
  const PALETTE_COLORS = [
    // Dark / blacks
    '#000000', '#1a1a2e', '#333333', '#4a4a5a',
    // Grays
    '#6b6b7d', '#888899', '#a0a0b0', '#c0c0cc',
    // Neutrals
    '#d4d4dc', '#e2e2e8', '#efeff5', '#ffffff',
    // Reds
    '#6b1020', '#a81818', '#d93030', '#ff5555',
    // Oranges
    '#b84500', '#e07000', '#ff9933', '#ffb74d',
    // Yellows
    '#c8a000', '#e6b800', '#ffd633', '#ffe57f',
    // Greens
    '#1a6b20', '#2e8b30', '#44aa44', '#66cc66',
    // Teals / Cyans
    '#0a7d7a', '#15a09c', '#22c5c0', '#4ddede',
    // Blues
    '#15386b', '#1e5bb8', '#3388dd', '#66b3ff',
    // Purples / Violets
    '#4a1080', '#6b2ab8', '#9944cc', '#c77dff',
    // Pinks
    '#8b2050', '#c0307a', '#e0509d', '#ff80bf',
  ];

  // === DOM refs ===
  const canvas = document.getElementById('pixelCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const canvasWInput = document.getElementById('canvasW');
  const canvasHInput = document.getElementById('canvasH');
  const sizePreset = document.getElementById('sizePreset');
  const applySizeBtn = document.getElementById('applySizeBtn');
  const brushBtn = document.getElementById('brushBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const brushSizeSelect = document.getElementById('brushSize');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const zoomSlider = document.getElementById('zoomSlider');
  const zoomValueEl = document.getElementById('zoomValue');
  const colorGrid = document.getElementById('colorGrid');
  const customColorPicker = document.getElementById('customColorPicker');
  const currentColorPreview = document.getElementById('currentColorPreview');
  const cursorInfo = document.getElementById('cursorInfo');
  const undoCount = document.getElementById('undoCount');
  const canvasArea = document.getElementById('canvasArea');

  // === State ===
  let state = {
    width: 32,
    height: 32,
    color: '#000000',
    tool: 'brush',      // 'brush' | 'eraser'
    brushSize: 1,
    zoom: 16,
    isDrawing: false,
    lastPixelX: null,
    lastPixelY: null,
  };

  const MAX_UNDO = 50;
  let undoStack = [];
  let redoStack = [];

  // === Canvas sizing ===
  function createPixelData(w, h) {
    const d = document.createElement('canvas');
    d.width = w;
    d.height = h;
    return d.getContext('2d').createImageData(w, h);
  }

  function initCanvas() {
    canvas.width = state.width;
    canvas.height = state.height;
    // Save initial blank state
    undoStack = [];
    redoStack = [];
    saveState();
    render();
    applyZoom();
  }

  function resizeCanvas(w, h) {
    w = Math.max(1, Math.min(512, Math.floor(w)));
    h = Math.max(1, Math.min(512, Math.floor(h)));
    state.width = w;
    state.height = h;
    canvasWInput.value = w;
    canvasHInput.value = h;

    const oldData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    // Preserve data in the top-left corner
    const newCanvas = document.createElement('canvas');
    newCanvas.width = w;
    newCanvas.height = h;
    const newCtx = newCanvas.getContext('2d');

    // Fill transparent
    newCtx.clearRect(0, 0, w, h);

    if (oldData) {
      const oldW = Math.min(oldData.width || canvas.width, w);
      const oldH = Math.min(oldData.height || canvas.height, h);
      try {
        newCtx.putImageData(oldData, 0, 0);
      } catch(e) { /* skip on invalid data */ }
    }

    // Save current for undo before replacing
    saveState();

    canvas.width = w;
    canvas.height = h;

    if (oldData) {
      try {
        ctx.putImageData(newCtx.getImageData(0, 0, w, h), 0, 0);
      } catch(e2) { /* ignore */ }
    } else {
      ctx.clearRect(0, 0, w, h);
    }

    render();
    applyZoom();
  }

  // === Undo / Redo ===
  function saveState() {
    const data = ctx.getImageData(0, 0, state.width, state.height);
    undoStack.push(data);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    // Clear redo on new action
    redoStack = [];
    updateUndoRedoUI();
  }

  function undo() {
    if (undoStack.length <= 1) return;
    // Push current state to redo
    const currentData = ctx.getImageData(0, 0, state.width, state.height);
    redoStack.push(currentData);
    // Pop previous state
    undoStack.pop();
    const prevData = undoStack[undoStack.length - 1];
    ctx.putImageData(prevData, 0, 0);
    render();
    updateUndoRedoUI();
  }

  function redo() {
    if (redoStack.length === 0) return;
    const nextData = redoStack.pop();
    saveState(); // save current to undo stack first
    ctx.putImageData(nextData, 0, 0);
    render();
    updateUndoRedoUI();
  }

  function updateUndoRedoUI() {
    undoCount.textContent = `Undo: ${undoStack.length - 1} step${undoStack.length - 1 !== 1 ? 's' : ''}`;
    undoBtn.style.opacity = undoStack.length <= 1 ? '0.4' : '1';
    redoBtn.style.opacity = redoStack.length === 0 ? '0.4' : '1';
  }

  // === Render (scaled canvas) ===
  function render() {
    const zoom = state.zoom;
    canvas.style.width = (state.width * zoom) + 'px';
    canvas.style.height = (state.height * zoom) + 'px';
  }

  function applyZoom() {
    canvas.style.width = (state.width * state.zoom) + 'px';
    canvas.style.height = (state.height * state.zoom) + 'px';
  }

  // === Pixel operations ===
  function getPixelPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((clientX - rect.left) / state.zoom);
    const y = Math.floor((clientY - rect.top) / state.zoom);
    return {
      x: Math.max(0, Math.min(state.width - 1, x)),
      y: Math.max(0, Math.min(state.height - 1, y))
    };
  }

  function drawAt(x, y) {
    const size = state.brushSize;
    const half = Math.floor(size / 2);
    if (state.tool === 'eraser') {
      ctx.clearRect(
        x - half,
        y - half,
        size,
        size
      );
    } else {
      // Fill with solid color at pixel level
      for (let dy = 0; dy < size; dy++) {
        for (let dx = 0; dx < size; dx++) {
          const px = x - half + dx;
          const py = y - half + dy;
          if (px >= 0 && px < state.width && py >= 0 && py < state.height) {
            ctx.fillStyle = state.color;
            ctx.fillRect(px, py, 1, 1);
          }
        }
      }
    }
  }

  function drawLine(x0, y0, x1, y1) {
    // Bresenham's line algorithm to fill gaps between positions
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1;
    const sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;

    while (true) {
      drawAt(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }

  // === Color Palette ===
  function buildPalette() {
    colorGrid.innerHTML = '';
    PALETTE_COLORS.forEach(color => {
      const btn = document.createElement('button');
      btn.className = 'color-swatch' + (color === state.color ? ' active' : '');
      btn.style.backgroundColor = color;
      if (color === '#ffffff' || color === '#efeff5' || color === '#e2e2e8' || color === '#d4d4dc') {
        btn.style.border = '1px solid #555';
      }
      btn.addEventListener('click', () => selectColor(color));
      // Tooltip via title
      btn.title = color;
      colorGrid.appendChild(btn);
    });
  }

  function selectColor(color) {
    state.color = color;
    currentColorPreview.style.backgroundColor = color;
    customColorPicker.value = color;

    // Update active swatch
    document.querySelectorAll('.color-swatch').forEach(sw => {
      sw.classList.toggle('active', rgbMatch(sw.style.backgroundColor, hexToRgb(color)));
    });
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function rgbMatch(a, b) {
    // Normalize for comparison
    const parse = (s) => s.match(/\d+/g).map(Number);
    const pa = parse(a), pb = parse(b);
    return pa[0] === pb[0] && pa[1] === pb[1] && pa[2] === pb[2];
  }

  function getActiveColor() {
    // Check if custom color picker is the "active" one
    // For simplicity, always use state.color which gets updated from both sources
    return state.color;
  }

  // === Drawing events ===
  function startDrawing(clientX, clientY) {
    state.isDrawing = true;
    const pos = getPixelPos(clientX, clientY);
    state.lastPixelX = pos.x;
    state.lastPixelY = pos.y;
    drawAt(pos.x, pos.y);
  }

  function continueDrawing(clientX, clientY) {
    if (!state.isDrawing) return;
    const pos = getPixelPos(clientX, clientY);
    if (pos.x !== state.lastPixelX || pos.y !== state.lastPixelY) {
      drawLine(state.lastPixelX, state.lastPixelY, pos.x, pos.y);
      state.lastPixelX = pos.x;
      state.lastPixelY = pos.y;
    }
  }

  function stopDrawing() {
    if (state.isDrawing) {
      state.isDrawing = false;
      saveState(); // Save after stroke completes
    }
  }

  // Mouse events
  canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    startDrawing(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', (e) => {
    if (state.isDrawing) {
      continueDrawing(e.clientX, e.clientY);
    }
    // Update cursor position display
    const pos = getPixelPos(e.clientX, e.clientY);
    cursorInfo.textContent = `${pos.x}, ${pos.y}`;
  });
  window.addEventListener('mouseup', stopDrawing);

  // Touch events
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    startDrawing(touch.clientX, touch.clientY);
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (!state.isDrawing) return;
    e.preventDefault();
    const touch = e.touches[0];
    continueDrawing(touch.clientX, touch.clientY);
  }, { passive: false });

  window.addEventListener('touchend', stopDrawing);
  window.addEventListener('touchcancel', stopDrawing);

  // Prevent scrolling while drawing on canvas
  canvasArea.addEventListener('wheel', (e) => {
    if (state.isDrawing) e.preventDefault();
  }, { passive: false });

  // === Tool selection ===
  function setTool(tool) {
    state.tool = tool;
    brushBtn.classList.toggle('active', tool === 'brush');
    eraserBtn.classList.toggle('active', tool === 'eraser');
  }

  brushBtn.addEventListener('click', () => setTool('brush'));
  eraserBtn.addEventListener('click', () => setTool('eraser'));

  // Brush size
  brushSizeSelect.addEventListener('change', (e) => {
    state.brushSize = parseInt(e.target.value, 10);
  });

  // === Canvas size controls ===
  applySizeBtn.addEventListener('click', () => {
    const w = parseInt(canvasWInput.value, 10) || 32;
    const h = parseInt(canvasHInput.value, 10) || 32;
    resizeCanvas(w, h);
  });

  sizePreset.addEventListener('change', (e) => {
    const [w, h] = e.target.value.split('x').map(Number);
    canvasWInput.value = w;
    canvasHInput.value = h;
    resizeCanvas(w, h);
  });

  // Allow Enter key on inputs to apply
  [canvasWInput, canvasHInput].forEach(input => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applySizeBtn.click();
    });
  });

  // === Clear ===
  clearBtn.addEventListener('click', () => {
    saveState();
    ctx.clearRect(0, 0, state.width, state.height);
    render();
  });

  // === Undo / Redo buttons ===
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  // === Zoom ===
  zoomSlider.addEventListener('input', (e) => {
    state.zoom = parseInt(e.target.value, 10);
    zoomValueEl.textContent = state.zoom + '×';
    applyZoom();
  });

  // === Download PNG ===
  downloadBtn.addEventListener('click', () => {
    // Create a temporary canvas at native resolution
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = state.width;
    tempCanvas.height = state.height;
    const tempCtx = tempCanvas.getContext('2d');

    // We need to draw the pixel data onto this new canvas
    // Get current imageData and put it at (0,0) of same size
    const imageData = ctx.getImageData(0, 0, state.width, state.height);
    tempCtx.putImageData(imageData, 0, 0);

    // Export
    tempCanvas.toBlob((blob) => {
      if (!blob) {
        // Fallback: use data URL
        const url = tempCanvas.toDataURL('image/png');
        triggerDownload(url, 'pixel-art.png');
        return;
      }
      const url = URL.createObjectURL(blob);
      triggerDownload(url, 'pixel-art.png');
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  });

  function triggerDownload(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // === Keyboard shortcuts ===
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;

    if (mod && e.shiftKey && (e.key === 'Z' || e.key === 'z')) {
      e.preventDefault();
      redo();
      return;
    }
    if (mod && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      undo();
      return;
    }

    // Tool shortcuts (no modifier)
    if (e.key === 'b' || e.key === 'B') setTool('brush');
    if (e.key === 'e' || e.key === 'E') setTool('eraser');
  });

  // === Color picker ===
  customColorPicker.addEventListener('input', (e) => {
    selectColor(e.target.value);
  });

  // === Init ===
  function init() {
    buildPalette();
    selectColor(state.color);
    setTool('brush');
    zoomSlider.value = state.zoom;
    zoomValueEl.textContent = state.zoom + '×';
    undoBtn.style.opacity = '0.4';
    redoBtn.style.opacity = '0.4';

    initCanvas();
  }

  init();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <a class="skip" href="#main">skip to content</a>
  {% include art.html %}

  <header class="masthead">
    {% include wordmark.html %}
    <p class="tagline">{{ site.tagline }}</p>
    <nav class="nav" aria-label="Sections">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>home</a>
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" hidden>
        <span class="theme-toggle-icon" aria-hidden="true">◐</span><span class="theme-toggle-label">light</span>
      </button>
    </nav>
  </header>

  <main id="main"{% if page.wide %} class="wide"{% endif %}>
    {{ content }}
  </main>

  <footer class="footer">
    <span>$ {{ site.title }}</span>
    <a href="{{ '/archive/' | relative_url }}">archive</a>
    <a href="{{ '/atom.xml' | relative_url }}">rss</a>
    <a href="{{ site.github }}">source</a>
    <a href="{{ '/old/' | relative_url }}">old index</a>
  </footer>

  <script>
    /* Progressive enhancement: the button stays hidden unless this runs. */
    (function () {
      var button = document.querySelector('.theme-toggle');
      if (!button) return;
      var root = document.documentElement;
      var label = button.querySelector('.theme-toggle-label');
      var icon = button.querySelector('.theme-toggle-icon');

      function active() {
        return root.getAttribute('data-theme') ||
          (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      }
      function paint() {
        var next = active() === 'dark' ? 'light' : 'dark';
        label.textContent = next;
        icon.textContent = next === 'light' ? '◐' : '◑';
        button.setAttribute('aria-label', 'Switch to ' + next + ' mode');
      }

      button.hidden = false;
      paint();
      button.addEventListener('click', function () {
        var next = active() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        paint();
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Art Painter</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#toolbar {
  background: #16213e;
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  border-bottom: 2px solid #0f3460;
  z-index: 10;
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  background: #1a1a2e;
  border-radius: 6px;
}

.tool-group label {
  font-size: 12px;
  color: #aaa;
  white-space: nowrap;
}

button, .tool-btn {
  background: #0f3460;
  color: #eee;
  border: 1px solid #533483;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
}

button:hover, .tool-btn:hover {
  background: #533483;
}

button:active, .tool-btn:active {
  background: #6a0dad;
}

button.active-tool {
  background: #e94560;
  border-color: #ff6b6b;
}

input[type="number"] {
  width: 60px;
  padding: 4px 6px;
  background: #1a1a2e;
  color: #eee;
  border: 1px solid #533483;
  border-radius: 4px;
  font-size: 13px;
}

input[type="color"] {
  width: 36px;
  height: 32px;
  border: 2px solid #533483;
  border-radius: 4px;
  cursor: pointer;
  background: transparent;
  padding: 0;
}

#color-palette {
  display: flex;
  gap: 3px;
  flex-wrap: wrap;
  max-width: 200px;
}

.palette-swatch {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s, transform 0.1s;
}

.palette-swatch:hover {
  transform: scale(1.15);
}

.palette-swatch.selected {
  border-color: #fff;
  box-shadow: 0 0 6px rgba(233, 69, 96, 0.8);
}

#canvas-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: auto;
  background: #111;
  position: relative;
}

#canvas-wrapper {
  position: relative;
  touch-action: none;
}

#pixel-canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: crosshair;
  background-image:
    linear-gradient(45deg, #333 25%, transparent 25%),
    linear-gradient(-45deg, #333 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #333 75%),
    linear-gradient(-45deg, transparent 75%, #333 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}

#overlay-canvas {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  image-rendering: pixelated;
}

#size-inputs {
  display: flex;
  align-items: center;
  gap: 4px;
}

#size-separator {
  font-size: 14px;
  color: #aaa;
}

#info-bar {
  background: #0f3460;
  padding: 4px 12px;
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: #aaa;
  align-items: center;
}

#info-bar span {
  white-space: nowrap;
}

#brush-size-control {
  display: flex;
  align-items: center;
  gap: 4px;
}

#brush-size-slider {
  width: 80px;
}

/* Dialog */
#size-dialog-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 100;
  justify-content: center;
  align-items: center;
}

#size-dialog-overlay.show { display: flex; }

#size-dialog {
  background: #16213e;
  padding: 24px;
  border-radius: 12px;
  border: 2px solid #533483;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 260px;
}

#size-dialog h3 {
  margin: 0;
  color: #e94560;
}

#size-dialog .dialog-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

#size-dialog button {
  padding: 8px 16px;
}

/* Responsive */
@media (max-width: 700px) {
  #toolbar { padding: 6px; gap: 4px; }
  .tool-group { padding: 3px 5px; }
  button, .tool-btn { padding: 5px 8px; font-size: 12px; }
  .palette-swatch { width: 20px; height: 20px; }
}
</style>
</head>
<body>

<div id="toolbar">
  <!-- Canvas Size -->
  <div class="tool-group">
    <label>Canvas:</label>
    <span id="size-label">8x8</span>
    <button id="btn-size" title="Change canvas size">&#9881;</button>
  </div>

  <!-- Brush / Eraser -->
  <div class="tool-group">
    <label>Tool:</label>
    <button id="btn-brush" class="active-tool" title="Brush (B)">&#128300; Brush</button>
    <button id="btn-eraser" title="Eraser (E)">&#9633; Eraser</button>
  </div>

  <!-- Brush Size -->
  <div class="tool-group" id="brush-size-control">
    <label>Size:</label>
    <input type="range" id="brush-size-slider" min="1" max="8" value="1" step="1">
    <span id="brush-size-val">1</span>
  </div>

  <!-- Color Palette -->
  <div class="tool-group">
    <label>Color:</label>
    <input type="color" id="color-picker" value="#000000" title="Custom color">
    <div id="color-palette"></div>
  </div>

  <!-- Actions -->
  <div class="tool-group">
    <button id="btn-undo" title="Undo (Ctrl+Z)">&#8617; Undo</button>
    <button id="btn-redo" title="Redo (Ctrl+Y)">&#8618; Redo</button>
    <button id="btn-clear" title="Clear canvas">&#128465; Clear</button>
    <button id="btn-export" title="Export as PNG">&#128190; Export PNG</button>
  </div>
</div>

<div id="canvas-container">
  <div id="canvas-wrapper">
    <canvas id="pixel-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
  </div>
</div>

<div id="info-bar">
  <span id="info-coords">X: - Y: -</span>
  <span id="info-pixels">Pixels: -</span>
  <span id="info-tool">Tool: Brush</span>
</div>

<!-- Size Change Dialog -->
<div id="size-dialog-overlay">
  <div id="size-dialog">
    <h3>Set Canvas Size</h3>
    <div class="dialog-row">
      <label>Width:</label>
      <input type="number" id="dialog-width" min="1" max="512" value="8">
    </div>
    <div class="dialog-row">
      <label>Height:</label>
      <input type="number" id="dialog-height" min="1" max="512" value="8">
    </div>
    <div class="dialog-row" style="gap:8px">
      <button id="btn-dialog-cancel">Cancel</button>
      <button id="btn-dialog-ok" style="background:#e94560;border-color:#ff6b6b;">Apply</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // --- Configuration ---
  var PALETTE_COLORS = [
    '#000000', '#1d2b53', '#7e2553', '#008751',
    '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8',
    '#ff004d', '#ffa300', '#ffec27', '#00e436',
    '#29adff', '#83769c', '#ff77a8', '#ffccaa',
    '#8855FF', '#00CCBB', '#FF8844', '#DDAAEE'
  ];

  var MAX_UNDO = 50;

  // --- State ---
  var canvasWidth = 8;
  var canvasHeight = 8;
  var currentColor = '#000000';
  var tool = 'brush'; // 'brush' | 'eraser'
  var brushSize = 1;
  var isDrawing = false;
  var lastPixelX = -1;
  var lastPixelY = -1;
  var historyStack = [];
  var redoStack = [];
  var currentPixelCount = 0;

  // --- DOM Elements ---
  var pixelCanvas = document.getElementById('pixel-canvas');
  var overlayCanvas = document.getElementById('overlay-canvas');
  var canvasWrapper = document.getElementById('canvas-wrapper');
  var ctx = pixelCanvas.getContext('2d');
  var octx = overlayCanvas.getContext('2d');

  var colorPicker = document.getElementById('color-picker');
  var colorPaletteEl = document.getElementById('color-palette');
  var brushSizeSlider = document.getElementById('brush-size-slider');
  var brushSizeVal = document.getElementById('brush-size-val');
  var sizeLabel = document.getElementById('size-label');
  var infoCoords = document.getElementById('info-coords');
  var infoPixels = document.getElementById('info-pixels');
  var infoTool = document.getElementById('info-tool');

  // --- Palette Setup ---
  function buildPalette() {
    PALETTE_COLORS.forEach(function(color) {
      var swatch = document.createElement('div');
      swatch.className = 'palette-swatch';
      swatch.style.background = color;
      if (color === currentColor) swatch.classList.add('selected');
      swatch.setAttribute('title', color);
      swatch.addEventListener('click', function() {
        selectColor(color);
      });
      swatch.addEventListener('touchstart', function(e) {
        e.preventDefault();
        selectColor(color);
      }, { passive: false });
      colorPaletteEl.appendChild(swatch);
    });
  }

  function selectColor(color) {
    currentColor = color;
    colorPicker.value = color;
    document.querySelectorAll('.palette-swatch').forEach(function(s) {
      s.classList.toggle('selected', s.getAttribute('title') === color);
    });
  }

  // --- Canvas Initialization ---
  function resizeCanvas(width, height) {
    var oldImageData = null;
    if (pixelCanvas.width > 0 && pixelCanvas.height > 0) {
      try {
        oldImageData = ctx.getImageData(0, 0, Math.min(canvasWidth, width), Math.min(canvasHeight, height));
      } catch(e) {}
    }

    canvasWidth = width;
    canvasHeight = height;
    pixelCanvas.width = width;
    pixelCanvas.height = height;
    overlayCanvas.width = width * getDevicePixelRatio();
    overlayCanvas.height = height * getDevicePixelRatio();

    var scale = getDevicePixelRatio();
    overlayCanvas.style.width = (width) + 'px';
    overlayCanvas.style.height = (height) + 'px';
    canvasWrapper.style.width = (width) + 'px';
    canvasWrapper.style.height = (height) + 'px';

    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    // Fill background white
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);

    // Restore old data if possible
    if (oldImageData) {
      try {
        var copyW = Math.min(canvasWidth, oldImageData.width);
        var copyH = Math.min(canvasHeight, oldImageData.height);
        var newData = ctx.createImageData(copyW, copyH);
        newData.data.set(oldImageData.data.slice(0, copyW * copyH * 4));
        ctx.putImageData(newData, 0, 0);
      } catch(e) {}
    }

    sizeLabel.textContent = width + 'x' + height;
    brushSizeSlider.max = Math.min(Math.max(width, height), 16);
    if (brushSize > Math.min(Math.max(width, height), 16)) {
      brushSize = Math.min(brushSize, Math.min(Math.max(width, height), 16));
      brushSizeSlider.value = brushSize;
      brushSizeVal.textContent = brushSize;
    }

    countPixels();
    saveState();
  }

  function getDevicePixelRatio() {
    return window.devicePixelRatio || 1;
  }

  // --- Drawing ---
  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b];
  }

  function getPixelColor(px, py) {
    if (px < 0 || px >= canvasWidth || py < 0 || py >= canvasHeight) return null;
    var data = ctx.getImageData(px, py, 1, 1).data;
    var r = data[0], g = data[1], b = data[2], a = data[3];
    if (a === 0) return '#ffffff';
    var rr = r.toString(16), gg = g.toString(16), bb = b.toString(16);
    if (rr.length < 2) rr = '0' + rr;
    if (gg.length < 2) gg = '0' + gg;
    if (bb.length < 2) bb = '0' + bb;
    return '#' + rr + gg + bb;
  }

  function paintRect(x, y) {
    var color = tool === 'eraser' ? '#ffffff' : currentColor;
    var rgb = hexToRgb(color);
    var size = brushSize;
    var half = Math.floor(size / 2);
    var startX = x - half;
    var startY = y - half;

    ctx.fillStyle = color;
    for (var dy = 0; dy < size; dy++) {
      for (var dx = 0; dx < size; dx++) {
        var px = startX + dx;
        var py = startY + dy;
        if (px >= 0 && px < canvasWidth && py >= 0 && py < canvasHeight) {
          ctx.fillRect(px, py, 1, 1);
        }
      }
    }
  }

  function countPixels() {
    var data = ctx.getImageData(0, 0, canvasWidth, canvasHeight).data;
    var count = 0;
    for (var i = 3; i < data.length; i += 4) {
      if (data[i] !== 0) count++;
    }
    currentPixelCount = count;
    infoPixels.textContent = 'Pixels: ' + count;
  }

  // --- Pixel coordinate from event ---
  function getPixelCoords(clientX, clientY) {
    var rect = pixelCanvas.getBoundingClientRect();
    var x = Math.floor((clientX - rect.left) / rect.width * canvasWidth);
    var y = Math.floor((clientY - rect.top) / rect.height * canvasHeight);
    return [x, y];
  }

  // --- Drawing handler ---
  function handleDraw(clientX, clientY) {
    var coords = getPixelCoords(clientX, clientY);
    var px = coords[0];
    var py = coords[1];
    if (px < 0 || px >= canvasWidth || py < 0 || py >= canvasHeight) return;

    paintRect(px, py);

    // Draw overlay indicator
    drawBrushPreview(px, py);

    infoCoords.textContent = 'X: ' + px + ' Y: ' + py;

    if (lastPixelX !== -1 && lastPixelY !== -1) {
      // Blerp between points
      var dx = Math.abs(px - lastPixelX);
      var dy = Math.abs(py - lastPixelY);
      var steps = Math.max(dx, dy, 1);
      for (var i = 1; i <= steps; i++) {
        var t = i / steps;
        var ix = Math.round(lastPixelX + (px - lastPixelX) * t);
        var iy = Math.round(lastPixelY + (py - lastPixelY) * t);
        paintRect(ix, iy);
      }
    }

    lastPixelX = px;
    lastPixelY = py;
  }

  function drawBrushPreview(px, py) {
    octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    var scale = getDevicePixelRatio();
    var sizePx = brushSize * scale;
    var xPx = px * scale;
    var yPx = py * scale;

    octx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
    octx.lineWidth = 1;
    octx.setLineDash([3, 3]);
    octx.strokeRect(xPx, yPx, sizePx, sizePx);
    octx.setLineDash([]);
  }

  function stopBrushPreview() {
    octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  }

  // --- Undo / Redo ---
  function saveState() {
    var data = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    historyStack.push(data);
    if (historyStack.length > MAX_UNDO) {
      historyStack.shift();
    }
    redoStack = [];
  }

  function undo() {
    if (historyStack.length <= 1) return;
    var currentState = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    redoStack.push(currentState);
    historyStack.pop();
    var prevState = historyStack[historyStack.length - 1];
    ctx.putImageData(prevState, 0, 0);
    countPixels();
  }

  function redo() {
    if (redoStack.length === 0) return;
    var currentState = ctx.getImageData(0, 0, canvasWidth, canvasHeight);
    historyStack.push(currentState);
    var nextState = redoStack.pop();
    ctx.putImageData(nextState, 0, 0);
    countPixels();
  }

  function clearCanvas() {
    saveState();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    currentPixelCount = 0;
    infoPixels.textContent = 'Pixels: 0';
  }

  // --- Export PNG ---
  function exportPNG() {
    saveState();
    var link = document.createElement('a');
    link.download = 'pixel-art-' + Date.now() + '.png';
    link.href = pixelCanvas.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // --- Mouse Events ---
  function setupMouseEvents() {
    pixelCanvas.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);

    overlayCanvas.addEventListener('mouseenter', onCanvasEnter);
    overlayCanvas.addEventListener('mouseleave', onCanvasLeave);

    // Touch events on both canvases
    pixelCanvas.addEventListener('touchstart', onTouchStart, { passive: false });
    pixelCanvas.addEventListener('touchmove', onTouchMove, { passive: false });
    pixelCanvas.addEventListener('touchend', onTouchEnd, { passive: false });
    overlayCanvas.addEventListener('touchstart', onTouchStart, { passive: false });
    overlayCanvas.addEventListener('touchmove', onTouchMove, { passive: false });
    overlayCanvas.addEventListener('touchend', onTouchEnd, { passive: false });
  }

  function onMouseDown(e) {
    e.preventDefault();
    isDrawing = true;
    lastPixelX = -1;
    lastPixelY = -1;
    handleDraw(e.clientX, e.clientY);
  }

  function onMouseMove(e) {
    var coords = getPixelCoords(e.clientX, e.clientY);
    infoCoords.textContent = 'X: ' + coords[0] + ' Y: ' + coords[1];
    drawBrushPreview(coords[0], coords[1]);

    if (isDrawing) {
      handleDraw(e.clientX, e.clientY);
    }
  }

  function onMouseUp() {
    if (isDrawing) {
      isDrawing = false;
      saveState();
      lastPixelX = -1;
      lastPixelY = -1;
    }
  }

  function onCanvasEnter() {
    // handled by pixel events
  }

  function onCanvasLeave() {
    if (!isDrawing) {
      stopBrushPreview();
    }
  }

  // --- Touch Events ---
  function onTouchStart(e) {
    e.preventDefault();
    isDrawing = true;
    lastPixelX = -1;
    lastPixelY = -1;
    var touch = e.touches[0];
    handleDraw(touch.clientX, touch.clientY);
  }

  function onTouchMove(e) {
    e.preventDefault();
    var touch = e.touches[0];
    var coords = getPixelCoords(touch.clientX, touch.clientY);
    infoCoords.textContent = 'X: ' + coords[0] + ' Y: ' + coords[1];
    drawBrushPreview(coords[0], coords[1]);

    if (isDrawing) {
      handleDraw(touch.clientX, touch.clientY);
    }
  }

  function onTouchEnd(e) {
    e.preventDefault();
    if (isDrawing) {
      isDrawing = false;
      saveState();
      lastPixelX = -1;
      lastPixelY = -1;
    }
    stopBrushPreview();
  }

  // --- UI Controls ---
  function setupUI() {
    // Color picker
    colorPicker.addEventListener('input', function(e) {
      selectColor(e.target.value);
    });

    // Brush size slider
    brushSizeSlider.addEventListener('input', function(e) {
      brushSize = parseInt(e.target.value, 10);
      brushSizeVal.textContent = brushSize;
    });

    // Tool buttons
    document.getElementById('btn-brush').addEventListener('click', function() {
      tool = 'brush';
      updateToolUI();
    });

    document.getElementById('btn-eraser').addEventListener('click', function() {
      tool = 'eraser';
      updateToolUI();
    });

    // Undo/Redo/Clear/Export
    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-redo').addEventListener('click', redo);
    document.getElementById('btn-clear').addEventListener('click', clearCanvas);
    document.getElementById('btn-export').addEventListener('click', exportPNG);

    // Size dialog
    var overlay = document.getElementById('size-dialog-overlay');
    document.getElementById('btn-size').addEventListener('click', function() {
      document.getElementById('dialog-width').value = canvasWidth;
      document.getElementById('dialog-height').value = canvasHeight;
      overlay.classList.add('show');
    });

    document.getElementById('btn-dialog-cancel').addEventListener('click', function() {
      overlay.classList.remove('show');
    });

    document.getElementById('btn-dialog-ok').addEventListener('click', function() {
      var w = parseInt(document.getElementById('dialog-width').value, 10);
      var h = parseInt(document.getElementById('dialog-height').value, 10);
      if (isNaN(w) || isNaN(h)) return;
      w = Math.max(1, Math.min(512, w));
      h = Math.max(1, Math.min(512, h));
      overlay.classList.remove('show');
      resizeCanvas(w, h);
    });

    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) overlay.classList.remove('show');
    });
  }

  function updateToolUI() {
    var brushBtn = document.getElementById('btn-brush');
    var eraserBtn = document.getElementById('btn-eraser');
    brushBtn.classList.toggle('active-tool', tool === 'brush');
    eraserBtn.classList.toggle('active-tool', tool === 'eraser');
    infoTool.textContent = 'Tool: ' + (tool === 'brush' ? 'Brush' : 'Eraser');
  }

  // --- Keyboard Shortcuts ---
  function setupKeyboard() {
    window.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT') return;

      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z') { e.preventDefault(); undo(); }
        else if (e.key === 'y' || (e.shiftKey && e.key === 'Z')) { e.preventDefault(); redo(); }
        else if (e.key === 's') { e.preventDefault(); exportPNG(); }
        return;
      }

      switch(e.key.toLowerCase()) {
        case 'b': tool = 'brush'; updateToolUI(); break;
        case 'e': tool = 'eraser'; updateToolUI(); break;
        case 'c': clearCanvas(); break;
        case '[': brushSize = Math.max(1, brushSize - 1); brushSizeSlider.value = brushSize; brushSizeVal.textContent = brushSize; break;
        case ']': brushSize = Math.min(parseInt(brushSizeSlider.max), brushSize + 1); brushSizeSlider.value = brushSize; brushSizeVal.textContent = brushSize; break;
      }
    });
  }

  // --- Initialization ---
  function init() {
    buildPalette();
    resizeCanvas(canvasWidth, canvasHeight);
    saveState(); // Initial state
    setupUI();
    setupMouseEvents();
    setupKeyboard();
  }

  // Wait for DOM to be ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>

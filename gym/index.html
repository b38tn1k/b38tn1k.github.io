<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Workout Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="rgba(50, 43, 88, 0.1)">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://unpkg.com/dragula@3.7.3/dist/dragula.min.css">
    <script src="https://unpkg.com/dragula@3.7.3/dist/dragula.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gap: 12px;
            --pad: 12px;
            --bg: #1e1b2e;
            --bg-alt: #2a2542;
            --ink: #e8e7f3;
            --muted: #aaa3d4;
            --accent: #9effff;
            --accent2: #ffb3f3;
            --card: #25213a;
            --border: #3c3660;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            color: var(--ink);
            background: radial-gradient(circle at 20% 20%, #322b58 0%, #1a1630 100%);
            background-attachment: fixed;
            min-height: 100svh;
            overflow-x: hidden;
        }

        .wrap {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 12px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            padding-right: calc(12px + env(safe-area-inset-right, 0px));
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            padding-left: calc(12px + env(safe-area-inset-left, 0px));
            display: grid;
            gap: var(--gap);
            box-sizing: border-box;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--gap);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: var(--pad);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        h1,
        h2 {
            margin: 0 0 6px 0;
            letter-spacing: 0.03em;
        }

        label {
            font-size: 14px;
            color: var(--muted);
            display: block;
            margin-bottom: 4px;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #222;
            color: var(--ink);
            font-size: 16px;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .card input,
        .card select {
            max-width: 100%;
            box-sizing: border-box;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: var(--gap);
        }

        button {
            border: none;
            border-radius: 14px;
            background: var(--accent2);
            color: #1e1b2e;
            font-weight: 600;
            padding: 12px 12px;
            font-size: 14px;
            min-height: 44px;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 6px rgba(255, 179, 243, 0.4);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
        }

        button.primary {
            background: var(--accent);
            color: #1e1b2e;
            box-shadow: 0 2px 6px rgba(158, 255, 255, 0.5);
        }

        button:active {
            transform: scale(0.97);
            background: #87f3f3;
        }

        .stack {
            display: grid;
            gap: 8px;
        }

        .exercise {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }


        .exercise h4 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .exercise small {
            color: var(--muted);
        }

        .exercise .desc {
            display: block;
            margin-top: 6px;
            font-size: 14px;
            color: #bbb;
        }

        .exercise.open .desc {
            display: block;
        }

        .lists {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--gap);
        }

        .list {
            min-height: clamp(220px, 36vh, 420px);
            background: #181818;
            border: 1px dashed #333;
            border-radius: 10px;
            padding: 8px;
            overflow: auto;
        }

        .list h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
        }

        .meta {
            font-size: 13px;
            color: var(--muted);
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            align-items: stretch;
        }

        .timer .timebox {
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
            font-size: clamp(16px, 2.3vw, 22px);
            padding: 8px 10px;
            border-radius: 8px;
            color: var(--accent);
            background: rgba(42, 37, 66, 0.9);
            border: 1px solid var(--border);
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .timer button {
            width: 100%;
        }

        #phase,
        #clock,
        #nowDoing {
            grid-column: 1 / -1;
        }

        .running {
            color: var(--accent2);
            font-weight: 600;
        }

        .footer {
            font-size: 12px;
            color: var(--muted);
        }

        .inline {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        #p5-timer {
            width: 100%;
            height: clamp(220px, 38vh, 420px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem 0;
            overflow: hidden;
        }

        canvas {
            max-width: 100%;
            height: auto !important;
        }

        .exercise-controls .add-btn svg {
            stroke: #7effa0;
        }

        @media (max-width: 900px) {
            body {
                background-attachment: scroll;
            }

            .grid-3 {
                grid-template-columns: 1fr;
            }

            .inline button {
                flex: 1 1 100%;
            }
        }

        @media (max-width: 640px) {
            .wrap {
                --gap: 10px;
                --pad: 10px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .timer {
                grid-template-columns: 1fr;
            }

            .timer button {
                font-size: 15px;
            }

            #p5-timer {
                height: clamp(200px, 34vh, 320px);
                padding: 0.4rem 0;
            }

            .list {
                min-height: clamp(180px, 30vh, 320px);
            }

            .exercise h4 {
                font-size: 14px;
            }
        }

        #p5-timer canvas {
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(158, 255, 255, 0.2);
        }

        /* === Clean, consistent button icon colors (no glow) === */
        .exercise-controls .add-btn {
            color: #52ff52 !important;
            /* vivid green icon */
            font-weight: 700;
            background: none !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .exercise-controls .remove-btn {
            color: #ff4040 !important;
            /* bright red icon */
            font-weight: 700;
            background: none !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .exercise-controls button:hover {
            color: #ffffff !important;
            filter: brightness(1.3);
        }

        .exercise-controls .remove-btn svg {
            stroke: #ff7b7b;
        }

        .exercise-controls .move-up svg,
        .exercise-controls .move-down svg {
            stroke: #25213a;
        }
    </style>

</head>

<body>
    <div class="wrap">
        <div class="card stack">
            <div id="p5-timer"></div>
            <div class="timer">
                <div id="phase" class="timebox">Idle</div>
                <div id="clock" class="timebox">00:00</div>
                <div id="nowDoing" class="timebox">-</div>
                <button id="start" class="primary">Start</button>
                <button id="pause">Pause</button>
                <button id="reset">Reset</button>
            </div>
            <div id="nextDoing" class="timebox">Next: -</div>
        </div>
        <div class="row">
            <div class="card stack">
                <h1>Workout Builder</h1>
                <div>
                    <label for="mode">Workout type</label>
                    <select id="mode">
                        <option value="strength">Strength</option>
                        <option value="core">Core</option>
                        <option value="hiit">HIIT</option>
                    </select>
                </div>
                <div>
                    <label for="perSet">Exercises per set</label>
                    <input id="perSet" type="number" min="1" value="4" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div>
                    <label for="sets">Number of sets</label>
                    <input id="sets" type="number" min="1" value="3" inputmode="numeric" pattern="[0-9]*">
                </div>
                <div class="grid-3">
                    <div>
                        <label for="workSec">Work (seconds)</label>
                        <input id="workSec" type="number" min="5" value="60" inputmode="numeric" pattern="[0-9]*">
                    </div>
                    <div>
                        <label for="restSec">Short Rest (seconds)</label>
                        <input id="restSec" type="number" min="0" value="15" inputmode="numeric" pattern="[0-9]*">
                    </div>
                    <div>
                        <label for="setBreakSec">Set Break (seconds)</label>
                        <input id="setBreakSec" type="number" min="0" value="120" inputmode="numeric" pattern="[0-9]*">
                    </div>
                </div>
                <div class="inline">
                    <button id="generate" class="primary">Generate Plan</button>
                    <button id="shuffle">Shuffle</button>
                    <button id="clear">Clear</button>
                </div>
                <div class="meta">No duplicates within a set. You can drag to reorder. Click an exercise name to toggle
                    description.</div>
            </div>
        </div>
        <div class="row">
            <div class="card">
                <h2>Today's Workout</h2>
                <div id="set" class="list"></div>
            </div>
        </div>
        <div class="row">
            <div class="card">
                <h2>Exercise Pool</h2>
                <div id="pool" class="list"></div>
            </div>
        </div>
    </div>

    <script>
        // Pick a random number from 0 to 4
        const n = Math.floor(Math.random() * 5);

        // Set the background image using that number
        document.body.style.backgroundImage = `url('bg${n}.gif')`;
        /* =========================
           Data load and filtering
           ========================= */

        /**
         * Load exercise data from a URL. Falls back to embedded JSON if fetch fails.
         */
        async function loadData() {
            // Always load from the fixed URL, fallback to embedded if fetch fails
            const url = "https://b38tn1k.github.io/gym/excercises.json";
            try {
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) throw new Error("Bad response");
                const json = await res.json();
                return json;
            } catch (e) {
                console.warn("Failed to fetch external JSON, using embedded data. Error:", e);
            }
            const embedded = document.getElementById("exercise-data").textContent;
            return JSON.parse(embedded);
        }

        /**
         * Filter exercises by mode and return a pool for selection.
         * Rules:
         *  - HIIT prefers conditioning and fast core patterns
         *  - Strength prefers upper, lower, full, plus core strength options
         *  - Core focuses on core category
         */
        function poolForMode(all, mode) {
            const list = all.exercises.filter(ex => ex.modes.includes(mode));
            if (mode === "hiit") {
                // Slight prioritization: conditioning and fast core first
                const preferred = list.filter(ex => ex.category === "conditioning" || ex.category === "core");
                const others = list.filter(ex => !preferred.includes(ex));
                return [...preferred, ...others];
            }
            if (mode === "strength") {
                const preferred = list.filter(ex => ex.category === "upper" || ex.category === "lower" || ex.category === "full");
                const others = list.filter(ex => !preferred.includes(ex));
                return [...preferred, ...others];
            }
            // core
            return list.filter(ex => ex.category === "core");
        }

        /**
         * Sample N unique exercises from an array without duplicates.
         */
        function sampleUnique(arr, n) {
            const copy = [...arr];
            // Fisher-Yates shuffle
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy.slice(0, Math.max(0, Math.min(n, copy.length)));
        }

        /* =========================
           DOM builders
           ========================= */

        /**
         * Create an exercise DOM card with click to show description.
         * Includes move up/down, add, and remove buttons for mobile usability.
         */
        function makeExerciseEl(ex) {
            const el = document.createElement("div");
            el.className = "exercise";
            el.dataset.id = ex.id;
            el.innerHTML = `
  <div class="exercise-header">
    <h4>${ex.name}</h4>
    <div class="exercise-controls">
      <button class="move-up" title="Move Up">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
      <button class="move-down" title="Move Down">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M19 12l-7 7-7-7"/>
        </svg>
      </button>
      <button class="add-btn" title="Add to Workout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52ff52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button class="remove-btn" title="Remove">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff4040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
  <small>${ex.category} - ${ex.equipment && ex.equipment.length ? ex.equipment.join(", ") : "no equipment"}</small>
  <div class="desc">${ex.description}</div>
  `;
            // el.querySelector("h4").addEventListener("click", () => el.classList.toggle("open"));
            return el;
        }

        /**
         * Render a list of exercises into a container.
         */
        function renderList(container, items) {
            container.innerHTML = "";
            items.forEach(ex => container.appendChild(makeExerciseEl(ex)));
        }

        /* =========================
           Plan generation
           ========================= */

        /**
         * Build a new set template based on UI and current data pool.
         */
        function buildSetTemplate(state) {
            const mode = state.ui.mode.value;
            const perSet = parseInt(state.ui.perSet.value, 10);
            const pool = poolForMode(state.data, mode);
            const pick = sampleUnique(pool, perSet);
            state.plan.setTemplate = pick.map(ex => ex.id);
            renderSetFromIds(state);
        }

        /**
         * Refresh setTemplate from current set list DOM order.
         */
        function updateSetTemplate(state) {
            state.plan.setTemplate = [...state.ui.setList.querySelectorAll(".exercise")].map(n => n.dataset.id);
        }

        /**
         * Render the set template from stored ids.
         * Wires up move-up, move-down, add, and remove buttons for mobile.
         */
        function renderSetFromIds(state) {
            const setIds = state.plan.setTemplate;
            const setItems = setIds.map(id => state.data.exercises.find(e => e.id === id)).filter(Boolean);
            renderList(state.ui.setList, setItems);
            // Wire up controls for each exercise in the set list
            state.ui.setList.querySelectorAll(".exercise").forEach(el => {
                const btnUp = el.querySelector(".move-up");
                const btnDown = el.querySelector(".move-down");
                const btnRemove = el.querySelector(".remove-btn");
                const btnAdd = el.querySelector(".add-btn");
                // Hide add button fully in set list
                if (btnAdd) {
                    btnAdd.style.display = "none";
                    btnAdd.style.opacity = "1";
                    btnAdd.style.pointerEvents = "auto";
                    btnAdd.style.color = "var(--accent)";
                }
                // Show remove button in set list
                if (btnRemove) {
                    btnRemove.style.display = "inline-block";
                    btnRemove.style.opacity = "1";
                    btnRemove.style.pointerEvents = "auto";
                    btnRemove.style.color = "#ff5252";
                }
                // Remove from set and put back to pool
                if (btnRemove) {
                    btnRemove.addEventListener("click", (e) => {
                        e.stopPropagation();
                        el.remove();
                        updateSetTemplate(state);
                        // Only put back to pool if not already in pool
                        if (![...state.ui.poolList.querySelectorAll(".exercise")].some(n => n.dataset.id === el.dataset.id)) {
                            // When returning to pool, show only add-btn, hide others
                            const poolEl = makeExerciseEl(state.data.exercises.find(ex => ex.id === el.dataset.id));
                            // Set controls for pool: show add-btn, hide move/remove
                            const controls = poolEl.querySelector(".exercise-controls");
                            if (controls) {
                                controls.querySelectorAll("button").forEach(btn => {
                                    if (btn.classList.contains("add-btn")) {
                                        btn.style.display = "inline-block";
                                        btn.style.opacity = "1";
                                        btn.style.pointerEvents = "auto";
                                        // btn.style.color = "var(--accent)";
                                    } else {
                                        btn.style.display = "none";
                                    }
                                });
                            }
                            state.ui.poolList.appendChild(poolEl);
                            // Wire up add-btn for this poolEl
                            const btnAddPool = poolEl.querySelector(".add-btn");
                            if (btnAddPool) {
                                btnAddPool.onclick = (e2) => {
                                    e2.stopPropagation();
                                    const ex = state.data.exercises.find(e => e.id === poolEl.dataset.id);
                                    if (!ex) return;
                                    const existing = [...state.ui.setList.querySelectorAll(".exercise")].some(n => n.dataset.id === ex.id);
                                    if (existing) return;
                                    const newEl = makeExerciseEl(ex);
                                    // When moving to set, hide add-btn, show remove-btn
                                    const addBtnSet = newEl.querySelector(".add-btn");
                                    const removeBtnSet = newEl.querySelector(".remove-btn");
                                    if (addBtnSet) {
                                        addBtnSet.style.display = "none";
                                        addBtnSet.style.opacity = "1";
                                        addBtnSet.style.pointerEvents = "auto";
                                        addBtnSet.style.color = "var(--accent)";
                                    }
                                    if (removeBtnSet) {
                                        removeBtnSet.style.display = "inline-block";
                                        removeBtnSet.style.opacity = "1";
                                        removeBtnSet.style.pointerEvents = "auto";
                                        removeBtnSet.style.color = "#ff5252";
                                    }
                                    // Wire up set controls
                                    const btnUpSet = newEl.querySelector(".move-up");
                                    const btnDownSet = newEl.querySelector(".move-down");
                                    if (btnUpSet) btnUpSet.addEventListener("click", (ev) => {
                                        ev.stopPropagation();
                                        const prev = newEl.previousElementSibling;
                                        if (prev) newEl.parentNode.insertBefore(newEl, prev);
                                        updateSetTemplate(state);
                                    });
                                    if (btnDownSet) btnDownSet.addEventListener("click", (ev) => {
                                        ev.stopPropagation();
                                        const next = newEl.nextElementSibling;
                                        if (next) newEl.parentNode.insertBefore(next, newEl);
                                        updateSetTemplate(state);
                                    });
                                    if (removeBtnSet) {
                                        removeBtnSet.addEventListener("click", (ev) => {
                                            ev.stopPropagation();
                                            newEl.remove();
                                            updateSetTemplate(state);
                                            // Only append back to pool if not already present
                                            if (![...state.ui.poolList.querySelectorAll(".exercise")].some(n => n.dataset.id === ex.id)) {
                                                // Pool controls
                                                const poolEl2 = makeExerciseEl(ex);
                                                const controls2 = poolEl2.querySelector(".exercise-controls");
                                                if (controls2) {
                                                    controls2.querySelectorAll("button").forEach(btn => {
                                                        if (btn.classList.contains("add-btn")) {
                                                            btn.style.display = "inline-block";
                                                            btn.style.opacity = "1";
                                                            btn.style.pointerEvents = "auto";
                                                            // btn.style.color = "var(--accent)";
                                                        } else {
                                                            btn.style.display = "none";
                                                        }
                                                    });
                                                }
                                                state.ui.poolList.appendChild(poolEl2);
                                                // Wire up add-btn again
                                                const btnAddPool2 = poolEl2.querySelector(".add-btn");
                                                if (btnAddPool2) {
                                                    btnAddPool2.onclick = btnAddPool.onclick;
                                                }
                                            }
                                        });
                                    }
                                    state.ui.setList.appendChild(newEl);
                                    updateSetTemplate(state);
                                };
                            }
                        }
                    });
                }
                // Move up in set
                if (btnUp) {
                    btnUp.addEventListener("click", (e) => {
                        e.stopPropagation();
                        const prev = el.previousElementSibling;
                        if (prev) el.parentNode.insertBefore(el, prev);
                        updateSetTemplate(state);
                    });
                }
                // Move down in set
                if (btnDown) {
                    btnDown.addEventListener("click", (e) => {
                        e.stopPropagation();
                        const next = el.nextElementSibling;
                        if (next) el.parentNode.insertBefore(next, el);
                        updateSetTemplate(state);
                    });
                }
            });
            // Wire up add button for pool items
            state.ui.poolList.querySelectorAll(".exercise").forEach(el => {
                const controls = el.querySelector(".exercise-controls");
                if (controls) {
                    controls.querySelectorAll("button").forEach(btn => {
                        if (btn.classList.contains("add-btn")) {
                            btn.style.display = "inline-block";
                            btn.style.opacity = "1";
                            btn.style.pointerEvents = "auto";
                            // btn.style.color = "var(--accent)";
                        } else {
                            btn.style.display = "none";
                        }
                    });
                }
                const btnAdd = el.querySelector(".add-btn");
                if (btnAdd) {
                    btnAdd.onclick = (e) => {
                        e.stopPropagation();
                        const ex = state.data.exercises.find(e => e.id === el.dataset.id);
                        if (!ex) return;
                        const existing = [...state.ui.setList.querySelectorAll(".exercise")].some(n => n.dataset.id === ex.id);
                        if (existing) return;
                        const newEl = makeExerciseEl(ex);
                        // Hide add-btn, show remove-btn in set
                        const addBtnSet = newEl.querySelector(".add-btn");
                        const removeBtnSet = newEl.querySelector(".remove-btn");
                        if (addBtnSet) {
                            addBtnSet.style.display = "none";
                            addBtnSet.style.opacity = "1";
                            addBtnSet.style.pointerEvents = "auto";
                            addBtnSet.style.color = "var(--accent)";
                        }
                        if (removeBtnSet) {
                            removeBtnSet.style.display = "inline-block";
                            removeBtnSet.style.opacity = "1";
                            removeBtnSet.style.pointerEvents = "auto";
                            removeBtnSet.style.color = "#ff5252";
                        }
                        // Wire up set controls
                        const btnUpSet = newEl.querySelector(".move-up");
                        const btnDownSet = newEl.querySelector(".move-down");
                        if (btnUpSet) btnUpSet.addEventListener("click", (ev) => {
                            ev.stopPropagation();
                            const prev = newEl.previousElementSibling;
                            if (prev) newEl.parentNode.insertBefore(newEl, prev);
                            updateSetTemplate(state);
                        });
                        if (btnDownSet) btnDownSet.addEventListener("click", (ev) => {
                            ev.stopPropagation();
                            const next = newEl.nextElementSibling;
                            if (next) newEl.parentNode.insertBefore(next, newEl);
                            updateSetTemplate(state);
                        });
                        if (removeBtnSet) {
                            removeBtnSet.addEventListener("click", (ev) => {
                                ev.stopPropagation();
                                newEl.remove();
                                updateSetTemplate(state);
                                // Only append back to pool if not already present
                                if (![...state.ui.poolList.querySelectorAll(".exercise")].some(n => n.dataset.id === ex.id)) {
                                    // Pool controls
                                    const poolEl2 = makeExerciseEl(ex);
                                    const controls2 = poolEl2.querySelector(".exercise-controls");
                                    if (controls2) {
                                        controls2.querySelectorAll("button").forEach(btn => {
                                            if (btn.classList.contains("add-btn")) {
                                                btn.style.display = "inline-block";
                                                btn.style.opacity = "1";
                                                btn.style.pointerEvents = "auto";
                                                // btn.style.color = "var(--accent)";
                                            } else {
                                                btn.style.display = "none";
                                            }
                                        });
                                    }
                                    state.ui.poolList.appendChild(poolEl2);
                                    // Wire up add-btn again
                                    const btnAddPool2 = poolEl2.querySelector(".add-btn");
                                    if (btnAddPool2) {
                                        btnAddPool2.onclick = btnAdd.onclick;
                                    }
                                }
                            });
                        }
                        state.ui.setList.appendChild(newEl);
                        updateSetTemplate(state);
                    };
                }
            });
            // Update set template order
            updateSetTemplate(state);
        }

        /**
         * Get current set template as exercise objects.
         */
        function currentSetExercises(state) {
            const ids = [...state.ui.setList.querySelectorAll(".exercise")].map(n => n.dataset.id);
            return ids.map(id => state.data.exercises.find(e => e.id === id)).filter(Boolean);
        }

        /* =========================
           Timer engine
           ========================= */

        /**
         * Build the time sequence for all sets:
         * For each set:
         *   For each exercise in setTemplate: Work -> Short Rest (skip rest after last exercise)
         *   After last exercise: Set Break
         */
        function buildTimeline(state) {
            const perSetItems = currentSetExercises(state);
            const sets = parseInt(state.ui.sets.value, 10);
            const work = parseInt(state.ui.workSec.value, 10);
            const rest = parseInt(state.ui.restSec.value, 10);
            const setBreak = parseInt(state.ui.setBreakSec.value, 10);

            const timeline = [];
            if (sets > 0 && perSetItems.length > 0) {
                timeline.push({ phase: "Starting In", seconds: 5, label: "Get ready" });
            }
            for (let s = 1; s <= sets; s++) {
                perSetItems.forEach((ex, idx) => {
                    timeline.push({ phase: "Work", seconds: work, label: `Set ${s}: ${ex.name}` });
                    const isLast = idx === perSetItems.length - 1;
                    if (!isLast && rest > 0) {
                        timeline.push({ phase: "Short Rest", seconds: rest, label: `Set ${s}: Rest` });
                    }
                });
                if (setBreak > 0 && s !== sets) {
                    timeline.push({ phase: "Set Break", seconds: setBreak, label: `Between sets ${s} and ${s + 1}` });
                }
            }
            return timeline;
        }

        /**
         * Run the timeline with start, pause, reset controls.
         */
        function setupTimer(state) {
            let timeline = [];
            let idx = 0;
            let remaining = 0;
            let handle = null;
            let audioCtx = null;
            let lastBeepKey = "";

            function fmt(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            }

            function ensureAudio() {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    if (!Ctx) return null;
                    audioCtx = new Ctx();
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            function beep(freq = 880, duration = 0.08, gainValue = 0.05) {
                const ctx = ensureAudio();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const now = ctx.currentTime;

                osc.type = "sine";
                osc.frequency.value = freq;
                gain.gain.value = 0;

                osc.connect(gain);
                gain.connect(ctx.destination);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(gainValue, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.start(now);
                osc.stop(now + duration);
            }

            function maybeCountdownBeep(item, secondsLeft) {
                if (!item || secondsLeft <= 0) return;
                const shouldBeep = item.phase === "Starting In" ? secondsLeft <= 5 : secondsLeft <= 3;
                if (!shouldBeep) return;
                const key = `${idx}:${secondsLeft}`;
                if (key === lastBeepKey) return;
                lastBeepKey = key;
                beep(secondsLeft === 1 ? 1100 : 800, 0.07, 0.04);
            }

            function updateUI() {
                const item = timeline[idx];
                if (!item) {
                    state.ui.phase.textContent = "Done";
                    state.ui.clock.textContent = "00:00";
                    state.ui.nowDoing.textContent = "-";
                    if (state.ui.nextDoing) state.ui.nextDoing.textContent = "Next: -";
                    state.ui.phase.classList.remove("running");
                    return;
                }
                state.ui.phase.textContent = item.phase;
                state.ui.clock.textContent = fmt(remaining);
                state.ui.nowDoing.textContent = item.label;
                maybeCountdownBeep(item, remaining);
                if (state.ui.nextDoing) {
                    const next = timeline[idx + 1];
                    state.ui.nextDoing.textContent = next ? "Next: " + next.label : "Next: -";
                }
                state.ui.phase.classList.add("running");
            }

            function tick() {
                remaining -= 1;
                if (remaining <= 0) {
                    idx += 1;
                    if (idx >= timeline.length) {
                        clearInterval(handle);
                        handle = null;
                        updateUI();
                        return;
                    }
                    remaining = timeline[idx].seconds;
                }
                updateUI();
            }

            function start() {
                if (!timeline.length) {
                    timeline = buildTimeline(state);
                    idx = 0;
                    remaining = timeline[0]?.seconds || 0;
                }
                if (handle) return;
                handle = setInterval(tick, 1000);
                updateUI();
            }

            function pause() {
                if (handle) {
                    clearInterval(handle);
                    handle = null;
                    state.ui.phase.classList.remove("running");
                }
            }

            function reset() {
                pause();
                timeline = [];
                idx = 0;
                remaining = 0;
                lastBeepKey = "";
                state.ui.phase.textContent = "Idle";
                state.ui.clock.textContent = "00:00";
                state.ui.nowDoing.textContent = "-";
                if (state.ui.nextDoing) state.ui.nextDoing.textContent = "Next: -";
            }

            state.timer = { start, pause, reset };
        }

        /* =========================
           App init
           ========================= */

        (async function init() {
            const state = {
                data: null,
                drake: null,
                plan: { setTemplate: [] },
                ui: {
                    mode: document.getElementById("mode"),
                    perSet: document.getElementById("perSet"),
                    sets: document.getElementById("sets"),
                    workSec: document.getElementById("workSec"),
                    restSec: document.getElementById("restSec"),
                    setBreakSec: document.getElementById("setBreakSec"),
                    poolList: document.getElementById("pool"),
                    setList: document.getElementById("set"),
                    generate: document.getElementById("generate"),
                    shuffle: document.getElementById("shuffle"),
                    clear: document.getElementById("clear"),
                    startBtn: document.getElementById("start"),
                    pauseBtn: document.getElementById("pause"),
                    resetBtn: document.getElementById("reset"),
                    phase: document.getElementById("phase"),
                    clock: document.getElementById("clock"),
                    nowDoing: document.getElementById("nowDoing"),
                    nextDoing: document.getElementById("nextDoing"),
                }
            };
            // Expose state to global scope for dynamic handlers
            window.__STATE__ = state;

            // Load embedded data first
            state.data = await loadData();

            // Render initial pool for default mode
            const initialPool = poolForMode(state.data, state.ui.mode.value);
            renderList(state.ui.poolList, initialPool);

            // Create a default set
            buildSetTemplate(state);
            // setupDragula(state); // Dragula is disabled in favor of mobile controls
            setupTimer(state);

            // Events
            state.ui.mode.addEventListener("change", () => {
                const pool = poolForMode(state.data, state.ui.mode.value);
                renderList(state.ui.poolList, pool);
            });

            state.ui.generate.addEventListener("click", () => {
                buildSetTemplate(state);
            });

            state.ui.shuffle.addEventListener("click", () => {
                const current = currentSetExercises(state);
                const shuffled = sampleUnique(current, current.length);
                state.plan.setTemplate = shuffled.map(e => e.id);
                renderSetFromIds(state);
            });

            state.ui.clear.addEventListener("click", () => {
                state.plan.setTemplate = [];
                renderSetFromIds(state);
            });

            // Timer controls
            state.ui.startBtn.addEventListener("click", () => state.timer.start());
            state.ui.pauseBtn.addEventListener("click", () => state.timer.pause());
            state.ui.resetBtn.addEventListener("click", () => state.timer.reset());
        })();

        // ---- p5.js timer visualization ----
        (function setupP5Timer() {
            let timerState = {
                phase: "Idle",
                remaining: 0,
                total: 1,
            };
            // Find DOM elements
            function getTimerDom() {
                return {
                    phase: document.getElementById("phase"),
                    clock: document.getElementById("clock"),
                };
            }
            function updateFromDom() {
                const dom = getTimerDom();
                timerState.phase = dom.phase.textContent || "Idle";
                timerState.remaining = parseClock(dom.clock.textContent || "00:00");
                timerState.total = timerState.remaining > 0 ? timerState.remaining : 1;
            }
            function parseClock(str) {
                // "MM:SS" -> seconds
                const m = str.split(":");
                if (m.length !== 2) return 0;
                return parseInt(m[0], 10) * 60 + parseInt(m[1], 10);
            }
            let prevPhase = null, prevRem = null;
            // p5.js sketch
            new window.p5((p) => {
                let phaseColor = "#00bfa5";
                let totalSec = 1;
                let remSec = 0;
                let curPhase = "Idle";
                let curLabel = "";
                let ringThickness = 18;
                let baseSize = 0;
                let prevPhase = null, prevRem = null;

                function getCanvasSize() {
                    const parent = document.getElementById("p5-timer");
                    const maxWidth = parent ? parent.clientWidth : window.innerWidth;
                    const maxHeight = parent ? parent.clientHeight : window.innerHeight * 0.45;
                    const size = Math.min(maxWidth, maxHeight, window.innerHeight * 0.45);
                    return Math.max(180, Math.floor(size));
                }

                p.setup = function () {
                    const size = getCanvasSize();
                    const c = p.createCanvas(size, size);
                    c.parent("p5-timer");
                    p.angleMode(p.RADIANS);
                    baseSize = size;
                };

                p.windowResized = function () {
                    const size = getCanvasSize();
                    p.resizeCanvas(size, size);
                    baseSize = size;
                };

                p.draw = function () {
                    updateFromDom();
                    curPhase = timerState.phase;
                    remSec = timerState.remaining;

                    // Pull current exercise name if in Work phase
                    const nowDoingEl = document.getElementById("nowDoing");
                    const nextDoingEl = document.getElementById("nextDoing");
                    curLabel = nowDoingEl ? nowDoingEl.textContent : "";

                    // Estimate total for this phase
                    if (curPhase !== prevPhase || remSec > prevRem) totalSec = remSec;
                    prevPhase = curPhase;
                    prevRem = remSec;

                    // Color by phase
                    // if (curPhase === "Work") phaseColor = "#00e676";
                    // else if (curPhase === "Short Rest") phaseColor = "#ffd600";
                    // else if (curPhase === "Set Break") phaseColor = "#2979ff";
                    // else phaseColor = "#333";
                    if (curPhase === "Work") phaseColor = "#7effa0";      // mint green
                    else if (curPhase === "Short Rest") phaseColor = "#ffd6a5"; // warm peach
                    else if (curPhase === "Set Break") phaseColor = "#b8b3ff";  // lavender blue
                    else phaseColor = "#665c8a";
                    p.background("#1b1730");
                    p.stroke("#3c3660");

                    // Fraction remaining
                    const frac = totalSec > 0 ? remSec / totalSec : 1;

                    // Background
                    p.clear();
                    p.background(20);

                    const size = Math.min(p.width, p.height) * 0.8;
                    const cx = p.width / 2;
                    const cy = p.height / 2;

                    // Outer ring
                    p.strokeWeight(ringThickness);
                    p.stroke("#222");
                    p.noFill();
                    p.arc(cx, cy, size, size, 0, 2 * Math.PI);

                    // Active arc
                    p.stroke(phaseColor);
                    const endAng = -Math.PI / 2 + 2 * Math.PI * frac;
                    p.arc(cx, cy, size, size, -Math.PI / 2, endAng);

                    // Text
                    p.noStroke();
                    p.fill("#fff");
                    p.textAlign(p.CENTER, p.CENTER);

                    // What to show inside
                    let displayText = curPhase;
                    if (curPhase === "Work" && curLabel && !curLabel.includes("Rest")) {
                        displayText = curLabel.replace(/^Set \d+:\s*/, ""); // remove "Set X:" prefix
                    }

                    // Dynamically determine font size so text fits within the circle
                    let maxWidth = size * 0.7;
                    let fontSize = size / 10;
                    p.textSize(fontSize);
                    while (p.textWidth(displayText) > maxWidth && fontSize > 10) {
                        fontSize -= 1;
                        p.textSize(fontSize);
                    }

                    // Draw main label
                    p.text(displayText, cx, cy - 10);

                    // Draw time below label
                    const timeFontSize = size / 12;
                    const min = Math.floor(remSec / 60);
                    const sec = remSec % 60;
                    const timeText = (min > 0 ? min + ":" : "") + sec.toString().padStart(2, "0");
                    p.textSize(timeFontSize);
                    p.fill("#aaa");
                    const textGap = p.height / 10;
                    p.text(timeText, cx, cy + textGap);
                    p.textSize(timeFontSize / 3);
                    p.text(nextDoingEl.innerText, cx, cy + textGap * 2);

                };
            });
        })();
    </script>

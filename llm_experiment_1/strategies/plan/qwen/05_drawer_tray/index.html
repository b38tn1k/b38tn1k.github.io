<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawer Tray Maker — 3D Configurator &amp; STL Export</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 340px; --bg: #1a1d23; --panel: #252830; --border: #363b45;
    --text: #e0e3ea; --text-dim: #8a90a0; --accent: #4e9af1; --accent-h: #6aadff;
  }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; padding: 20px 18px; gap: 14px;
  }
  .sidebar h1 { font-size: 18px; font-weight: 700; color: var(--accent); }
  .sidebar .subtitle { font-size: 11px; color: var(--text-dim); margin-top: -8px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-dim); font-weight: 600; padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-top: 4px; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .field label { font-size: 13px; color: var(--text-dim); min-width: 42px; }
  .field input[type=number] {
    width: 76px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--text); font-size: 13px; text-align: right; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .unit { font-size: 11px; color: var(--text-dim); width: 28px; text-align: right; }

  /* Dimension grid */
  .dim-grid { display: grid; gap: 6px; }
  .dim-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 4px; text-align: center; }
  .dim-cell .label { font-size: 10px; color: var(--text-dim); margin-bottom: 2px; }
  .dim-cell .value { font-size: 13px; font-weight: 600; color: var(--accent); line-height: 1.4; }

  /* Grid preview */
  .grid-preview { display: flex; justify-content: center; padding: 6px 0; }
  .grid-canvas { border: 1px solid var(--border); border-radius: 4px; background: var(--bg); max-width: 100%; }

  /* Export button */
  .btn-export {
    width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #3a7bd5); color: #fff;
    font-size: 14px; font-weight: 600; letter-spacing: .3px; transition: opacity .15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-export:hover { opacity: .88; }
  .btn-export svg { width: 18px; height: 18px; }

  /* Canvas area */
  .canvas-area { flex: 1; position: relative; overflow: hidden; }
  #viewer { width: 100%; height: 100%; display: block; cursor: grab; }
  #viewer:active { cursor: grabbing; }
  .info-badge {
    position: absolute; bottom: 12px; left: 12px; background: rgba(37,40,48,.85);
    backdrop-filter: blur(6px); padding: 6px 12px; border-radius: 6px; font-size: 11px; color: var(--text-dim);
    pointer-events: none;
  }

  .sidebar::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 800px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: 0; max-height: 45vh; overflow-y: auto; }
    .canvas-area { min-height: 300px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <h1>📐 Drawer Tray Maker</h1>
    <p class="subtitle">Design compartments · Preview in 3D · Export STL</p>

    <div class="section-title">Outer Dimensions</div>
    <div class="field"><label>Width</label><input type="number" id="pW" min="60" max="600" step="1" value="180"><span class="unit">mm</span></div>
    <div class="field"><label>Depth</label><input type="number" id="pD" min="60" max="500" step="1" value="120"><span class="unit">mm</span></div>
    <div class="field"><label>Height</label><input type="number" id="pH" min="10" max="150" step="1" value="30"><span class="unit">mm</span></div>

    <div class="section-title" style="margin-top:8px;">Grid</div>
    <div class="field"><label>Columns</label><input type="number" id="pNc" min="1" max="10" step="1" value="3"><span class="unit">pcs</span></div>
    <div class="field"><label>Rows</label><input type="number" id="pNr" min="1" max="8" step="1" value="2"><span class="unit">pcs</span></div>

    <div class="section-title" style="margin-top:8px;">Thicknesses</div>
    <div class="field"><label>Wall</label><input type="number" id="ptw" min="1" max="10" step="0.25" value="3"><span class="unit">mm</span></div>
    <div class="field"><label>Floor</label><input type="number" id="pft" min="1" max="6" step="0.25" value="2"><span class="unit">mm</span></div>

    <div class="section-title" style="margin-top:8px;">Compartment Dimensions</div>
    <div class="dim-grid" id="dimGrid"></div>

    <div class="section-title" style="margin-top:8px;">Grid Preview</div>
    <div class="grid-preview"><canvas class="grid-canvas" id="gridCanvas" width="240" height="160"></canvas></div>

    <button class="btn-export" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      Export STL
    </button>
  </div>

  <!-- Canvas -->
  <div class="canvas-area">
    <canvas id="viewer"></canvas>
    <div class="info-badge" id="infoBadge">Left‑drag: rotate · Scroll: zoom · Right‑drag: pan</div>
  </div>
</div>

<!-- Three.js via CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter }  from 'three/addons/exporters/STLExporter.js';

/* ═══ helpers ═══ */
const $ = id => document.getElementById(id);

const params = { W:180, D:120, H:30, ncols:3, nrows:2, tw:3, ft:2 };
const rangeMap = { pW:[60,600], pD:[60,500], pH:[10,150], pNc:[1,10], pNr:[1,8], ptw:[1,10], pft:[1,6] };

/* ═══ Compartment math ═══ */
function compartmentSize() {
  const { W, D, ncols, nrows, tw } = params;
  return {
    cellW: Math.max(0, (W - tw * (ncols + 1)) / ncols),
    cellD: Math.max(0, (D - tw * (nrows + 1)) / nrows),
  };
}

/* ═══ Read parameters ═══ */
function readParams() {
  for (const id of ['pW','pD','pH'])      params[id[1]] = parseFloat($(id).value) || params[id[1]];
  params.ncols = parseInt($('pNc').value, 10) || params.ncols;
  params.nrows = parseInt($('pNr').value, 10) || params.nrows;
  params.tw    = parseFloat($('ptw').value)   || params.tw;
  params.ft    = parseFloat($('pft').value)   || params.ft;
}

/* ═══ Compartment dimensions table ═══ */
function updateDims() {
  const { ncols, nrows } = params;
  const s = compartmentSize();
  let html = '';
  for (let r = 0; r < nrows; r++) {
    for (let c = 0; c < ncols; c++) {
      const vol = s.cellW * s.cellD * (params.H - params.ft);
      html += `<div class="dim-cell">
        <div class="label">C${c+1}R${r+1}</div>
        <div class="value">${s.cellW.toFixed(2)} × ${s.cellD.toFixed(2)}</div>
        <div style="font-size:10px;color:var(--text-dim);margin-top:2px;">≈${vol.toFixed(0)} mm³</div>
      </div>`;
    }
  }
  $('dimGrid').innerHTML = html;
}

/* ═══ Grid preview diagram (canvas) ═══ */
function updateGridPreview() {
  const cv = $('gridCanvas'), ctx = cv.getContext('2d');
  const W = params.W, D = params.D;
  const pad = 10;
  const maxW = 240 - pad*2, maxH = 160 - pad*2;
  const scale = Math.min(maxW / W, maxH / D);
  const dw = W * scale, dh = D * scale;
  const ox = (240 - dw)/2, oy = (160 - dh)/2;

  ctx.clearRect(0, 0, 240, 160);
  // outline
  ctx.strokeStyle = '#4e9af1'; ctx.lineWidth = 1.5;
  ctx.strokeRect(ox, oy, dw, dh);
  ctx.fillStyle = 'rgba(78,154,241,.05)';
  ctx.fillRect(ox, oy, dw, dh);

  const { ncols, nrows, tw } = params;
  ctx.strokeStyle = '#6aadff'; ctx.lineWidth = 1;
  // column dividers (vertical lines on screen = front-to-back in 3D)
  for (let c = 1; c < ncols; c++) {
    const x = ox + (tw * (c+0.5)) * scale;
    ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy+dh); ctx.stroke();
  }
  // row dividers (horizontal lines on screen)
  for (let r = 1; r < nrows; r++) {
    const y = oy + (tw * (r+0.5)) * scale;
    ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox+dw, y); ctx.stroke();
  }
  // labels
  ctx.fillStyle = '#8a90a0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let r = 0; r < nrows; r++) {
    for (let c = 0; c < ncols; c++) {
      const lx = ox + tw*scale + (c+0.5) * compartmentSize().cellW * scale;
      const ly = oy + tw*scale + (r+0.5) * compartmentSize().cellD * scale;
      ctx.fillText(`C${c+1}R${r+1}`, lx, ly);
    }
  }
  // outer dims
  ctx.fillStyle = '#e0e3ea'; ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`${W} mm`, ox+dw/2, oy-4);
  ctx.save(); ctx.translate(ox-4, oy+dh/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(`${D} mm`, 0, 0); ctx.restore();
}

/* ═══ Three.js scene ═══ */
const canvas = $('viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene   = new THREE.Scene();
scene.background = new THREE.Color('#1e222a');

const camera    = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
const controls  = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.2);
dl.position.set(200, 300, 250); scene.add(dl);
const bl = new THREE.DirectionalLight(0x8899bb, 0.35);
bl.position.set(-150, -100, -200); scene.add(bl);

// Tray material
const mat = new THREE.MeshPhongMaterial({ color: 0x7a8b9a, specular: 0x111111, shininess: 12, side: THREE.DoubleSide });

const trayGroup = new THREE.Group();
scene.add(trayGroup);

/* ═══ Geometry builder — per-face planes (watertight) ═══ */
/**
 * Add a thin wall panel using three.js BoxGeometry.
 * The box naturally gives outward-facing normals on all 6 sides;
 * thickness is along one axis so only the two large faces matter visually.
 */
function addWall(cx, cy, cz, lengthAlongX, heightAlongY, thick, out) {
  // Wall runs along X for 'lengthAlongX' mm, has height 'heightAlongY',
  // and thickness 'thick' along Z (front-to-back direction in local space).
  const g = new THREE.BoxGeometry(lengthAlongX, heightAlongY, thick);
  g.translate(cx, cy, cz);
  out.push(g);
}

function addFloorPanel(fx, fy, fz, w, d) {
  // Flat panel lying in XZ plane (normal = -Y), thickness negligible for geometry.
  const g = new THREE.BoxGeometry(w, 0.01, d);
  g.translate(fx, fy, fz);
  return g;
}

/* ═══ Build tray mesh ═══ */
function buildTray() {
  // Dispose old geometries
  while (trayGroup.children.length) {
    const c = trayGroup.children[0];
    c.geometry?.dispose();
    trayGroup.remove(c);
  }

  const { W, D, H, ncols, nrows, tw, ft } = params;
  const s = compartmentSize();
  if (s.cellW <= 0 || s.cellD <= 0) return; // invalid — walls consume everything

  /* ── Outer shell: 4 walls meeting at corners ── */
  // Front wall (along X, span [-W/2,W/2]; along Z, centered near +D/2)
  addWall(0,        H/2,  D/2 - tw/2, W, H, tw, trayGroup.children);
  // Back wall  (along X, at -Z edge)
  addWall(0,        H/2, -D/2 + tw/2, W, H, tw, trayGroup.children);
  // Left wall  (along Z, at -X edge): thickness along X, depth D along Z
  addWall(-W/2+tw/2, H/2,   0,        tw, H, D, trayGroup.children);
  // Right wall (along Z, at +X edge)
  addWall( W/2-tw/2, H/2,   0,       tw, H, D, trayGroup.children);

  /* ── Internal column dividers (run front↔back along Z) ── */
  for (let c = 1; c < ncols; c++) {
    // Center: start from cavity left edge, shift by (cellW+tw) per cell, add tw/2 to center the wall
    const baseX = -W/2 + tw/2 + c * (s.cellW + tw);
    // Column divider has thickness along X, depth D along Z
    addWall(baseX, H/2, 0, tw, H, D, trayGroup.children);
  }

  /* ── Internal row dividers (run left↔right along X) ── */
  for (let r = 1; r < nrows; r++) {
    const baseZ = -D/2 + tw/2 + r * (s.cellD + tw);
    addWall(0, H/2, baseZ, W, H, tw, trayGroup.children);
  }

  /* ── Floor panels (one per compartment) ── */
  for (let r = 0; r < nrows; r++) {
    for (let c = 0; c < ncols; c++) {
      // Cell c (0-indexed) starts at cavity edge + c*(cellW+tw)
      const fx = -W/2 + tw + c * (s.cellW + tw) + s.cellW/2;
      const fz = -D/2 + tw + r * (s.cellD + tw) + s.cellD/2;
      trayGroup.children.push(addFloorPanel(fx, ft/2, fz, s.cellW, s.cellD));
    }
  }

  // Merge all geometries into a single geometry for clean rendering / STL export
  const merged = mergeGeometries(trayGroup.children.map(c => c.geometry));
  const mesh = new THREE.Mesh(merged, mat);
  trayGroup.clear();
  trayGroup.add(mesh);

  // Center model at origin
  const box = new THREE.Box3().setFromObject(trayGroup);
  const center = box.getCenter(new THREE.Vector3());
  trayGroup.children.forEach(c => c.translate(-center.x, -center.y, -center.z));
}

/* ═══ Geometry merge (handles indexed & non-indexed) ═══ */
function mergeGeometries(geos) {
  let vertCount = 0;
  const posArrs = [], normArrs = [];
  for (const g of geos) {
    const p = g.getAttribute('position');
    if (!p) continue;
    posArrs.push(p.array);
    normArrs.push(g.getAttribute('normal')?.array || new Float32Array(p.array.length));
    vertCount += p.count;
  }

  const positions = new Float32Array(vertCount * 3);
  const normals   = new Float32Array(vertCount * 3);
  let off = 0;
  for (let i = 0; i < geos.length; i++) {
    const g = geos[i];
    const p = g.getAttribute('position');
    if (!p) continue;
    positions.set(p.array, off * 3);
    normals.set(normArrs[i], off * 3);
    off += p.count;
  }

  return new THREE.BufferGeometry()
    .setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
    .setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
}

/* ═══ Fit camera to model ═══ */
function fitCamera() {
  const box = new THREE.Box3().setFromObject(trayGroup);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  let dist = maxDim / (2 * Math.tan(fov / 2)) * 1.8;
  controls.target.copy(center);
  camera.position.set(center.x + size.x*0.4, center.y + size.y*1.3, center.z + dist);
  controls.update();
}

/* ═══ Resize ═══ */
function onResize() {
  const area = canvas.parentElement;
  camera.aspect = area.clientWidth / area.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(area.clientWidth, area.clientHeight);
}
window.addEventListener('resize', onResize);
onResize();

/* ═══ Rebuild ──── */
function rebuild() {
  readParams();
  buildTray();
  updateDims();
  updateGridPreview();
  fitCamera();
}

let rafId;
function debouncedRebuild() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(rebuild); }

for (const id of ['pW','pD','pH','pNc','pNr','ptw','pft']) {
  const el = $(id);
  el.addEventListener('input', () => {
    const [lo, hi] = rangeMap[id];
    let v = +el.value;
    if (isNaN(v) || v < lo) v = lo;
    if (v > hi) v = hi;
    el.value = v;
    debouncedRebuild();
  });
}

/* ═══ Animation loop ──── */
(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();

// Initial build
rebuild();

/* ═══ STL Export ──── */
$('btnExport').addEventListener('click', () => {
  // Clone the tray geometry (remove materials)
  const group = new THREE.Group();
  while (trayGroup.children.length) {
    const c = trayGroup.children[0];
    c.material = null;
    group.add(c.clone());
  }
  const exporter = new STLExporter();
  const result = exporter.parse(group, { binary: false }); // ASCII for readability
  const blob   = new Blob([result], { type: 'text/plain' });
  const url    = URL.createObjectURL(blob);
  const a      = document.createElement('a');
  const { nrows, ncols } = params;
  a.href = url;
  a.download = `tray_${nrows}x${ncols}.stl`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>

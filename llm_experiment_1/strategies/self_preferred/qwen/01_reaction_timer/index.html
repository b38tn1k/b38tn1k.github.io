<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time Tester</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-idle: #1a1a2e;
    --bg-waiting: #16213e;
    --bg-stimulus: #c0392b;
    --bg-result: #27ae60;
    --bg-summary: #2c3e50;
    --text-light: #ecf0f1;
    --text-muted: #95a5a6;
    --accent: #3498db;
    --gold: #f1c40f;
  }

  html, body {
    height: 100%; width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg-idle); color: var(--text-light);
    transition: background-color 0.3s ease;
    cursor: default;
  }

  body.state-waiting { background: var(--bg-waiting); }
  body.state-stimulus   { background: var(--bg-stimulus); cursor: pointer; }
  body.state-result     { background: var(--bg-result); }
  body.state-summary    { background: var(--bg-summary); cursor: default; }

  /* ── Header / Progress ── */
  #header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px 24px; z-index: 10;
    background: rgba(0,0,0,0.25); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.9; }

  #progress { display: flex; gap: 8px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
    transition: background 0.3s, border-color 0.3s, transform 0.2s;
  }
  .dot.active { background: var(--gold); border-color: var(--gold); transform: scale(1.2); }
  .dot.done   { background: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.6); }

  /* ── Main Click Area ── */
  #main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; max-width: 700px; padding: 80px 24px 24px; text-align: center;
  }

  #message {
    font-size: clamp(28px, 6vw, 56px); font-weight: 700; line-height: 1.2;
    margin-bottom: 16px; min-height: 3em; display: flex; align-items: center; justify-content: center;
  }

  #sub-message {
    font-size: clamp(14px, 2.5vw, 20px); color: var(--text-muted);
    margin-bottom: 32px; min-height: 1.5em;
  }

  #click-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 18px 48px; font-size: clamp(16px, 3vw, 22px); font-weight: 600;
    color: var(--text-light); background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25); border-radius: 16px;
    cursor: pointer; transition: all 0.2s ease; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  #click-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); transform: scale(1.03); }
  #click-btn:active { transform: scale(0.97); }

  /* ── Results Table ── */
  #results-panel { display: none; width: 100%; }
  #results-panel.visible { display: block; }

  .trial-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; margin-bottom: 6px; border-radius: 10px;
    background: rgba(255,255,255,0.07); font-size: clamp(14px, 2.5vw, 18px);
  }
  .trial-row .label { opacity: 0.7; }
  .trial-row .value { font-weight: 700; font-variant-numeric: tabular-nums; }

  #stats-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px; margin-top: 16px;
  }
  .stat-card {
    padding: 14px 10px; border-radius: 10px; text-align: center;
    background: rgba(255,255,255,0.08);
  }
  .stat-card .stat-label { font-size: 12px; opacity: 0.6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .stat-value { font-size: clamp(20px, 3vw, 28px); font-weight: 700; color: var(--gold); }

  /* ── Status (self-verify) ── */
  #status {
    position: fixed; bottom: 12px; right: 16px;
    padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: rgba(0,0,0,0.5); color: var(--text-muted); z-index: 20;
  }
  #status.success { color: #2ecc71; }
  #status.error   { color: #e74c3c; }

  /* ── Animations ── */
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.6; } }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }

  @keyframes fadeIn { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .fade-in { animation: fadeIn 0.35s ease forwards; }

  /* ── Export button ── */
  #export-btn {
    margin-top: 20px; padding: 12px 32px; font-size: 16px; font-weight: 600;
    color: var(--text-light); background: rgba(52,152,219,0.3); border: 2px solid rgba(52,152,219,0.5);
    border-radius: 12px; cursor: pointer; transition: all 0.2s; outline: none;
  }
  #export-btn:hover { background: rgba(52,152,219,0.5); }

  /* ── Restart button ── */
  #restart-btn {
    margin-top: 12px; padding: 12px 32px; font-size: 16px; font-weight: 600;
    color: var(--text-light); background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px; cursor: pointer; transition: all 0.2s; outline: none;
  }
  #restart-btn:hover { background: rgba(255,255,255,0.2); }

  /* ── False-start flash ── */
  @keyframes shake {
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-5px); }
    80%{ transform: translateX(5px); }
  }
  .shake { animation: shake 0.4s ease; }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    #header { padding: 12px 16px; }
    #header h1 { font-size: 15px; }
    .dot { width: 12px; height: 12px; }
  }
</style>
</head>
<body>

<!-- Header with progress dots -->
<div id="header">
  <h1>⚡ Reaction Time</h1>
  <div id="progress"></div>
</div>

<!-- Main content area -->
<div id="main">
  <div id="message"></div>
  <div id="sub-message"></div>
  <button id="click-btn" style="display:none;">Start</button>
  <div id="results-panel"></div>
</div>

<!-- Self-verify status -->
<div id="status">Checking…</div>

<script>
(function() {
  "use strict";

  // ═══════════════════════════════════════════
  // CONSTANTS
  // ═══════════════════════════════════════════
  const NUM_TRIALS    = 5;
  const MIN_WAIT_MS   = 2000;
  const MAX_WAIT_MS   = 6000;
  const FALSE_START_PENALTY_MS = 1000; // add penalty to trial time if false start

  // ═══════════════════════════════════════════
  // DOM REFERENCES
  // ═══════════════════════════════════════════
  const body          = document.body;
  const messageEl     = document.getElementById("message");
  const subMessageEl  = document.getElementById("sub-message");
  const clickBtn      = document.getElementById("click-btn");
  const progressEl    = document.getElementById("progress");
  const resultsPanel  = document.getElementById("results-panel");
  const statusEl      = document.getElementById("status");

  // ═══════════════════════════════════════════
  // STATE MACHINE
  // ═══════════════════════════════════════════
  var State = { IDLE: 0, WAITING: 1, STIMULUS: 2, RESULT: 3, SUMMARY: 4 };
  var state = State.IDLE;

  var currentTrial   = 0;
  var trials         = [];       // { time: ms|null, falseStart: bool }
  var waitTimeout    = null;     // setTimeout handle
  var stimulusTime   = 0;        // performance.now() when stimulus appeared

  // ═══════════════════════════════════════════
  // INITIALIZATION
  // ═══════════════════════════════════════════
  function init() {
    buildProgressDots();
    showIdle();
    runSelfVerify();
  }

  function buildProgressDots() {
    progressEl.innerHTML = "";
    for (var i = 0; i < NUM_TRIALS; i++) {
      var dot = document.createElement("div");
      dot.className = "dot";
      dot.dataset.index = i;
      progressEl.appendChild(dot);
    }
  }

  function updateProgress() {
    var dots = progressEl.querySelectorAll(".dot");
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = "dot";
      if (i < currentTrial) dots[i].classList.add("done");
      else if (i === currentTrial) dots[i].classList.add("active");
    }
  }

  // ═══════════════════════════════════════════
  // SCREEN STATES
  // ═══════════════════════════════════════════
  function clearAll() {
    body.className = "";
    clickBtn.style.display = "none";
    resultsPanel.classList.remove("visible");
    resultsPanel.innerHTML = "";
  }

  function showIdle() {
    state = State.IDLE;
    clearAll();
    body.className = "";
    messageEl.textContent = "⚡ Reaction Time Tester";
    subMessageEl.textContent = "Click Start when you're ready.";
    clickBtn.style.display = "inline-flex";
    clickBtn.textContent = "▶  Start";
    currentTrial = 0;
    trials = [];
    updateProgress();
  }

  function showWaiting() {
    state = State.WAITING;
    clearAll();
    body.className = "state-waiting";
    messageEl.textContent = "Wait for green…";
    subMessageEl.textContent = "Don't click yet!";
    updateProgress();
  }

  function showStimulus() {
    state = State.STIMULUS;
    clearAll();
    body.className = "state-stimulus";
    messageEl.textContent = "🟢 CLICK NOW!";
    subMessageEl.textContent = "";
    stimulusTime = performance.now();

    // Make the whole body clickable
    body.addEventListener("click", handleBodyClick);
    body.addEventListener("touchstart", handleTouchStart, { passive: true });
  }

  function showResult(timeMs) {
    state = State.RESULT;
    clearAll();
    body.className = "state-result";
    messageEl.textContent = timeMs + " ms";
    subMessageEl.textContent = timeMs < 200 ? "🔥 Incredible!" :
                                timeMs < 300 ? "⚡ Great!" :
                                timeMs < 400 ? "👍 Good" :
                                timeMs < 600 ? "😐 Okay" : "🐢 Slow";

    if (currentTrial < NUM_TRIALS) {
      clickBtn.style.display = "inline-flex";
      clickBtn.textContent = currentTrial + 1 < NUM_TRIALS ? "Next Trial →" : "See Results";
      clickBtn.onclick = function() {
        body.removeEventListener("click", handleBodyClick);
        body.removeEventListener("touchstart", handleTouchStart);
        if (currentTrial >= NUM_TRIALS) showSummary();
        else startTrial();
      };
    }
  }

  function showFalseStart() {
    state = State.RESULT;
    clearAll();
    body.className = "state-stimulus shake";
    messageEl.textContent = "❌ Too early!";
    subMessageEl.textContent = "You clicked before the stimulus appeared.";

    clickBtn.style.display = "inline-flex";
    clickBtn.textContent = "Try Again";
    clickBtn.onclick = function() {
      body.classList.remove("shake");
      startTrial();
    };
  }

  function showSummary() {
    state = State.SUMMARY;
    clearAll();
    body.className = "state-summary";
    messageEl.textContent = "📊 Results Summary";
    subMessageEl.textContent = "";
    resultsPanel.classList.add("visible");

    var times = trials.map(function(t) { return t.time; });
    var mean  = arithmeticMean(times);
    var medianVal = calcMedian(times);
    var best  = Math.min.apply(null, times);
    var worst = Math.max.apply(null, times);
    var sd    = stdDev(times);

    // Per-trial rows
    var html = "";
    for (var i = 0; i < trials.length; i++) {
      var t = trials[i];
      var cls = t.falseStart ? "false-start" : "";
      html += '<div class="trial-row fade-in" style="animation-delay:' + (i * 0.05) + 's">' +
                '<span class="label">Trial ' + (i + 1) + (t.falseStart ? ' ⚠️' : '') + '</span>' +
                '<span class="value">' + t.time + ' ms</span>' +
              '</div>';
    }

    // Stats cards
    html += '<div id="stats-bar">';
    html += statCard("Mean", Math.round(mean) + " ms");
    html += statCard("Median", Math.round(medianVal) + " ms");
    html += statCard("Best", best + " ms");
    html += statCard("Worst", worst + " ms");
    html += statCard("Std Dev", Math.round(sd) + " ms");
    html += '</div>';

    // Buttons
    html += '<button id="export-btn" style="display:inline-flex;margin-top:20px;padding:12px 32px;font-size:16px;font-weight:600;color:#ecf0f1;background:rgba(52,152,219,0.3);border:2px solid rgba(52,152,219,0.5);border-radius:12px;cursor:pointer;">📥 Export JSON</button>';
    html += '<button id="restart-btn" style="display:inline-flex;margin-top:12px;padding:12px 32px;font-size:16px;font-weight:600;color:#ecf0f1;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);border-radius:12px;cursor:pointer;">🔄 Restart</button>';

    resultsPanel.innerHTML = html;

    // Export handler
    document.getElementById("export-btn").addEventListener("click", function() { exportResults(); });
    document.getElementById("restart-btn").addEventListener("click", function() { showIdle(); });
  }

  function statCard(label, value) {
    return '<div class="stat-card">' +
             '<div class="stat-label">' + label + '</div>' +
             '<div class="stat-value">' + value + '</div>' +
           '</div>';
  }

  // ═══════════════════════════════════════════
  // GAME FLOW
  // ═══════════════════════════════════════════
  function startGame() {
    currentTrial = 0;
    trials = [];
    startTrial();
  }

  function startTrial() {
    updateProgress();
    showWaiting();
    var delay = MIN_WAIT_MS + Math.random() * (MAX_WAIT_MS - MIN_WAIT_MS);
    waitTimeout = setTimeout(function() {
      showStimulus();
    }, delay);
  }

  function handleBodyClick(e) {
    if (state !== State.STIMULUS) return;
    e.preventDefault();
    finishTrial(false);
  }

  function handleTouchStart(e) {
    if (state !== State.STIMULUS) return;
    // Prevent default to avoid double-fire with click
    var changed = e.changedTouches[0];
    var el = document.elementFromPoint(changed.clientX, changed.clientY);
    if (el && el.tagName === "BUTTON") return; // let button handle it
    finishTrial(false);
  }

  function finishTrial(isFalseStart) {
    body.removeEventListener("click", handleBodyClick);
    body.removeEventListener("touchstart", handleTouchStart);

    var timeMs = null;
    if (!isFalseStart) {
      timeMs = Math.round(performance.now() - stimulusTime);
    }

    trials[currentTrial] = { time: timeMs, falseStart: isFalseStart };
    currentTrial++;

    if (isFalseStart) {
      showFalseStart();
    } else {
      showResult(timeMs);
    }
  }

  // ═══════════════════════════════════════════
  // MATH HELPERS
  // ═══════════════════════════════════════════
  function arithmeticMean(arr) {
    var sum = 0;
    for (var i = 0; i < arr.length; i++) sum += arr[i];
    return sum / arr.length;
  }

  function calcMedian(arr) {
    var sorted = arr.slice().sort(function(a, b) { return a - b; });
    var mid = Math.floor(sorted.length / 2);
    if (sorted.length % 2 === 0) return (sorted[mid - 1] + sorted[mid]) / 2;
    return sorted[mid];
  }

  function stdDev(arr) {
    var m = arithmeticMean(arr);
    var sqDiffs = [];
    for (var i = 0; i < arr.length; i++) sqDiffs.push(Math.pow(arr[i] - m, 2));
    return Math.sqrt(arithmeticMean(sqDiffs));
  }

  // ═══════════════════════════════════════════
  // EXPORT
  // ═══════════════════════════════════════════
  function exportResults() {
    var times = trials.map(function(t) { return t.time; });
    var data = {
      generated: new Date().toISOString(),
      numTrials: NUM_TRIALS,
      trials: trials,
      statistics: {
        mean: Math.round(arithmeticMean(times)),
        median: Math.round(calcMedian(times)),
        best: Math.min.apply(null, times),
        worst: Math.max.apply(null, times),
        stdDev: Math.round(stdDev(times))
      }
    };
    var json = JSON.stringify(data, null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "reaction-time-results.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  // ═══════════════════════════════════════════
  // SELF-VERIFY
  // ═══════════════════════════════════════════
  function runSelfVerify() {
    var errors = [];

    // 1. Check DOM structure
    if (!messageEl) errors.push("Missing #message");
    if (!subMessageEl) errors.push("Missing #sub-message");
    if (!clickBtn) errors.push("Missing #click-btn");
    if (!progressEl) errors.push("Missing #progress");
    if (!resultsPanel) errors.push("Missing #results-panel");
    if (!statusEl) errors.push("Missing #status");

    // 2. Check state constants
    if (typeof State !== "object") errors.push("State enum not defined");
    var expectedStates = ["IDLE", "WAITING", "STIMULUS", "RESULT", "SUMMARY"];
    for (var i = 0; i < expectedStates.length; i++) {
      if (!(expectedStates[i] in State)) errors.push("Missing State." + expectedStates[i]);
    }

    // 3. Check math functions exist and work
    try {
      var testArr = [1, 2, 3, 4, 5];
      if (arithmeticMean(testArr) !== 3) errors.push("arithmeticMean incorrect");
      if (calcMedian(testArr) !== 3) errors.push("calcMedian incorrect");
      var sd = stdDev(testArr);
      if (isNaN(sd)) errors.push("stdDev returned NaN");
    } catch(e) { errors.push("Math function error: " + e.message); }

    // 4. Check constants
    if (NUM_TRIALS !== 5) errors.push("NUM_TRIALS should be 5");
    if (MIN_WAIT_MS < 1000) errors.push("MIN_WAIT_MS too low");
    if (MAX_WAIT_MS <= MIN_WAIT_MS) errors.push("MAX_WAIT_MS not > MIN_WAIT_MS");

    // 5. Check performance.now availability
    if (typeof performance === "undefined" || typeof performance.now !== "function") {
      errors.push("performance.now() unavailable");
    }

    // 6. Check Blob/URL API for export
    if (typeof Blob !== "function") errors.push("Blob constructor unavailable");
    if (typeof URL !== "object" || typeof URL.createObjectURL !== "function") {
      errors.push("URL.createObjectURL unavailable");
    }

    // 7. Verify HTML is valid (basic check)
    var doctype = document.doctype;
    if (!doctype || doctype.name !== "html") errors.push("Missing or invalid DOCTYPE");

    // 8. Check no external resources are referenced
    var allElements = document.querySelectorAll("*");
    for (var j = 0; j < allElements.length; j++) {
      var el = allElements[j];
      var href = el.getAttribute("href") || "";
      var src = el.getAttribute("src") || "";
      if (href.indexOf("http") === 0 && href.indexOf(window.location.origin) !== 0) {
        errors.push("External href found: " + href);
      }
      if (src.indexOf("http") === 0 && src.indexOf(window.location.origin) !== 0) {
        errors.push("External src found: " + src);
      }
    }

    // Report result
    if (errors.length === 0) {
      statusEl.textContent = "✓ SUCCESS — All checks passed";
      statusEl.className = "success";
    } else {
      statusEl.textContent = "✗ FAILED (" + errors.length + " issues)";
      statusEl.className = "error";
      console.error("Self-verify errors:", errors);
    }
  }

  // ═══════════════════════════════════════════
  // EVENT BINDING
  // ═══════════════════════════════════════════
  clickBtn.addEventListener("click", function() {
    if (state === State.IDLE) startGame();
  });

  // Keyboard support: Space/Enter to activate
  document.addEventListener("keydown", function(e) {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      clickBtn.click();
    }
  });

  // ═══════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

})();
</script>
</body>
</html>

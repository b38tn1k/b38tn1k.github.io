<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time Tester</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --accent: #5ad1ff;
    --green: #4ade80;
    --red: #ff5d6c;
    --amber: #fbbf24;
    --text: #e6e9f5;
    --muted: #8b93b0;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1c2140 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
    -webkit-user-select: none;
    user-select: none;
  }

  .app {
    width: 100%;
    max-width: 640px;
  }

  header.app-head {
    text-align: center;
    margin-bottom: 18px;
  }

  header.app-head h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header.app-head p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }

  /* Stage: the big clickable area */
  .stage {
    position: relative;
    background: var(--panel);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    min-height: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    touch-action: manipulation;
  }

  .state-waiting { border-color: rgba(255,255,255,0.08); }
  .state-ready   { background: #2a3b2e; border-color: rgba(74,222,128,0.35); }
  .state-go      { background: #1f4a3a; border-color: rgba(74,222,128,0.7); }
  .state-result  { background: #171b2e; border-color: rgba(90,209,255,0.5); }
  .state-false   { background: #3a1f24; border-color: rgba(255,93,108,0.7); }
  .state-done    { background: #171b2e; border-color: rgba(255,255,255,0.08); }

  .emoji {
    font-size: 3.2rem;
    line-height: 1;
    margin-bottom: 18px;
    transition: transform 0.15s ease;
  }

  .title {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--muted);
    max-width: 420px;
  }

  .big-ms {
    font-size: 4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin: 6px 0 10px;
  }
  .big-ms small {
    font-size: 1.2rem;
    font-weight: 500;
    color: var(--muted);
    margin-left: 6px;
  }

  .hint {
    margin-top: 22px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .kbd {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 0.8rem;
    font-family: inherit;
  }

  /* Progress strip */
  .progress {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }
  .dot {
    width: 34px;
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    transition: background 0.25s ease;
  }
  .dot.done { background: var(--accent); }
  .dot.current { background: rgba(255,255,255,0.35); }
  .dot.false { background: var(--red); }

  /* Results table */
  .results {
    width: 100%;
    margin-top: 8px;
    text-align: left;
  }
  .results table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
  }
  .results th, .results td {
    padding: 9px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .results th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .results tr:last-child td { border-bottom: none; }
  .results td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .results tr.best td.num { color: var(--green); }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(255,93,108,0.15);
    color: var(--red);
    border: 1px solid rgba(255,93,108,0.3);
  }

  .summary-row {
    display: flex;
    gap: 14px;
    margin: 18px 0 6px;
    flex-wrap: wrap;
  }
  .stat {
    flex: 1;
    min-width: 110px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px 14px;
    text-align: center;
  }
  .stat .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .value small { font-size: 0.8rem; font-weight: 500; color: var(--muted); }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    color: #06121a;
    background: var(--accent);
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.97); }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  button.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.18);
  }

  .hidden { display: none !important; }

  footer.foot {
    text-align: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.78rem;
  }

  @media (max-width: 480px) {
    .big-ms { font-size: 3rem; }
    .stage { min-height: 300px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="app-head">
      <h1>⚡ Reaction Time Tester</h1>
      <p>Click or press Space when the screen turns green. 5 trials.</p>
    </header>

    <div id="stage" class="state-waiting" tabindex="0">
      <!-- content injected by JS -->
    </div>

    <div class="progress" id="progress">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <footer class="foot">Average human reaction time is ~250&nbsp;ms. Results are stored only in this session.</footer>
  </div>

<script>
(function () {
  "use strict";

  const TOTAL_TRIALS = 5;
  const MIN_WAIT = 800;   // ms
  const MAX_WAIT = 3500;  // ms

  const stage = document.getElementById("stage");
  const progressEl = document.getElementById("progress");
  const dots = progressEl.querySelectorAll(".dot");

  // Game state
  let trial = 0;                 // current trial index (1-based count)
  let phase = "idle";            // idle | waiting | go | done
  let readyAt = 0;               // timestamp when screen went green
  let waitTimer = null;
  const results = [];            // {ms, falseStart}

  // ---- Rendering ---------------------------------------------------------
  function setPhase(p) { phase = p; }

  function render() {
    // update progress dots
    dots.forEach((dot, i) => {
      dot.className = "dot";
      if (i < trial - 1) {
        dot.classList.add("done");
        if (results[i] && results[i].falseStart) dot.classList.add("false");
      } else if (i === trial - 1 && (phase === "waiting" || phase === "go")) {
        dot.classList.add("current");
      }
    });

    const cls = {
      idle: "state-waiting",
      waiting: "state-ready",
      go: "state-go",
      result: "state-result",
      false: "state-false",
      done: "state-done"
    }[phase] || "state-waiting";
    stage.className = cls;

    if (phase === "idle") {
      stage.innerHTML = `
        <div class="emoji">🎯</div>
        <div class="title">Ready to test?</div>
        <div class="subtitle">We run <strong>${TOTAL_TRIALS}</strong> trials. Wait for the screen to turn <strong style="color:var(--green)">green</strong>, then react as fast as you can.</div>
        <div class="hint">Press <span class="kbd">Space</span> or click to start</div>`;
    } else if (phase === "waiting") {
      stage.innerHTML = `
        <div class="emoji">🟢</div>
        <div class="title">Wait for it…</div>
        <div class="subtitle">Don't click until it turns green. A false start will cost you this trial.</div>
        <div class="hint">Hold back — wait for green!</div>`;
    } else if (phase === "go") {
      stage.innerHTML = `
        <div class="emoji">💥</div>
        <div class="title">CLICK!</div>
        <div class="hint">As fast as you can!</div>`;
    } else if (phase === "result") {
      const last = results[trial - 1];
      const ms = last.ms;
      let verdict = ms < 200 ? "Too fast — were you guessing?" :
                    ms < 250 ? "Quick reflexes!" :
                    ms < 350 ? "Solid reaction." : "Take your time next time.";
      stage.innerHTML = `
        <div class="emoji">${last.falseStart ? "⚠️" : "🎉"}</div>
        <div class="title">${last.falseStart ? "False start!" : "Your time"}</div>
        <div class="big-ms">${last.falseStart ? "—" : ms + ""}<small>ms</small></div>
        <div class="subtitle">${verdict}</div>
        <div class="hint">Press <span class="kbd">Space</span> to continue</div>`;
    } else if (phase === "done") {
      renderDone();
    }
  }

  function renderDone() {
    const valid = results.filter(r => !r.falseStart).map(r => r.ms);
    const allValid = valid.length === results.length;
    const avg = valid.reduce((a, b) => a + b, 0) / (valid.length || 1);
    const best = valid.length ? Math.min(...valid) : null;
    const worst = valid.length ? Math.max(...valid) : null;

    let rows = results.map((r, i) => `
      <tr class="${r.falseStart ? "" : (r.ms === best ? "best" : "")}">
        <td>Trial ${i + 1}</td>
        <td class="num">${r.falseStart ? "—" : r.ms}</td>
        <td>${r.falseStart ? '<span class="badge">false start</span>' : (r.ms === best ? "🏆 best" : "")}</td>
      </tr>`).join("");

    stage.innerHTML = `
      <div class="emoji">${allValid ? "🏅" : "📊"}</div>
      <div class="title">Results Summary</div>
      <div class="summary-row">
        <div class="stat"><div class="label">Average</div><div class="value">${Math.round(avg)}<small>ms</small></div></div>
        <div class="stat"><div class="label">Best</div><div class="value" style="color:var(--green)">${best == null ? "—" : best}<small>ms</small></div></div>
        <div class="stat"><div class="label">Spread</div><div class="value">${worst == null ? "—" : (worst - best)}<small>ms</small></div></div>
      </div>
      <div class="results">
        <table>
          <thead><tr><th>Trial</th><th style="text-align:right">Time</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="actions">
        <button id="restartBtn">Play again</button>
      </div>
      <div class="hint" style="margin-top:16px">${allValid ? "No false starts — clean run!" : "Some trials were false starts; your average uses valid trials only."}</div>
    `;
    document.getElementById("restartBtn").addEventListener("click", reset);
  }

  // ---- Logic -------------------------------------------------------------
  function startGame() {
    if (phase !== "idle" && phase !== "done") return;
    reset();
    nextTrial();
  }

  function reset() {
    trial = 0;
    results.length = 0;
    clearWait();
    setPhase("idle");
    render();
  }

  function nextTrial() {
    trial += 1;
    setPhase("waiting");
    render();
    const wait = MIN_WAIT + Math.random() * (MAX_WAIT - MIN_WAIT);
    waitTimer = setTimeout(() => {
      waitTimer = null;
      go();
    }, wait);
  }

  function go() {
    setPhase("go");
    render();
    readyAt = performance.now();
  }

  function clearWait() {
    if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
  }

  function handlePress() {
    if (phase === "idle" || phase === "done") { startGame(); return; }
    if (phase === "waiting") {
      // false start
      clearWait();
      const r = { ms: null, falseStart: true };
      results.push(r);
      setPhase("false");
      render();
      setTimeout(() => {
        if (trial >= TOTAL_TRIALS) { setPhase("done"); render(); return; }
        setPhase("result");
        render();
      }, 700);
      return;
    }
    if (phase === "go") {
      const ms = Math.round(performance.now() - readyAt);
      results.push({ ms, falseStart: false });
      setPhase("result");
      render();
      setTimeout(() => {
        if (trial >= TOTAL_TRIALS) { setPhase("done"); render(); return; }
        setPhase("result"); // keep showing result until user presses
      }, 0);
      return;
    }
    if (phase === "result") {
      if (trial >= TOTAL_TRIALS) { setPhase("done"); render(); return; }
      nextTrial();
      return;
    }
  }

  // ---- Events ------------------------------------------------------------
  stage.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    handlePress();
  });

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      handlePress();
    }
  });

  // keep stage focused for keyboard
  stage.addEventListener("blur", () => {});

  // ---- Init --------------------------------------------------------------
  setPhase("idle");
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Painter</title>
<style>
  :root {
    --bg: #1e1e24;
    --panel: #2a2a33;
    --panel-2: #33333f;
    --border: #454552;
    --text: #e6e6ec;
    --muted: #9a9aa8;
    --accent: #5b9dff;
    --accent-hover: #4a8cf0;
    --danger: #ff6b6b;
    --grid-line: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header.topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    background: linear-gradient(180deg, #30303b, #26262f);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  header.topbar h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.3px;
  }

  header.topbar .spacer { flex: 1; }

  .canvas-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: auto;
    background:
      linear-gradient(45deg, #25252c 25%, transparent 25%),
      linear-gradient(-45deg, #25252c 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #25252c 75%),
      linear-gradient(-45deg, transparent 75%, #25252c 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #202026;
  }

  #display {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:
      repeating-conic-gradient(#2f2f37 0% 25%, #27272e 0% 50%) 0 / 20px 20px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    touch-action: none;
    cursor: crosshair;
    max-width: 100%;
    max-height: 100%;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-start;
    padding: 16px 18px;
    background: #26262f;
    border-top: 1px solid var(--border);
  }

  .tool-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tool-group .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: 600;
  }

  .btn-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  button.tool, button.ctl {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  button.tool:hover, button.ctl:hover { background: #3c3c48; }
  button.tool:active, button.ctl:active { transform: translateY(1px); }

  button.tool.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d1b2b;
    font-weight: 600;
  }

  button.ctl.danger:hover { background: #4a2b2b; border-color: var(--danger); color: var(--danger); }
  button.ctl.primary:hover { background: var(--accent-hover); border-color: var(--accent); color: #fff; }

  .palette {
    display: grid;
    grid-template-columns: repeat(8, 24px);
    gap: 4px;
  }

  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: 2px solid rgba(255, 255, 255, 0.12);
    cursor: pointer;
    transition: transform 0.1s, border-color 0.1s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active {
    border-color: #fff;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .color-picker-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type="color"] {
    width: 36px;
    height: 36px;
    padding: 0;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: none;
    cursor: pointer;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }

  .size-input {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 13px;
  }
  input[type="number"] {
    width: 58px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    text-align: center;
  }
  input[type="number"]:focus { outline: none; border-color: var(--accent); }

  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
  }

  kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: inherit;
  }

  @media (max-width: 720px) {
    .palette { grid-template-columns: repeat(6, 24px); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🎨 Pixel Painter</h1>
    <div class="spacer"></div>
    <button class="ctl" id="btn-undo" title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
    <button class="ctl" id="btn-redo" title="Redo (Shift+Ctrl/Cmd+Z)">↷ Redo</button>
    <button class="ctl danger" id="btn-clear" title="Clear canvas">🗑 Clear</button>
    <button class="ctl primary" id="btn-export" title="Download as PNG">⬇ Export PNG</button>
  </header>

  <div class="canvas-wrap">
    <canvas id="display"></canvas>
  </div>

  <div class="toolbar">
    <div class="tool-group">
      <span class="label">Tools</span>
      <div class="btn-row">
        <button class="tool active" data-tool="brush">🖌 Brush</button>
        <button class="tool" data-tool="eraser">🧽 Eraser</button>
      </div>
      <div class="hint">Click or drag on the canvas to paint.</div>
    </div>

    <div class="tool-group">
      <span class="label">Color</span>
      <div class="color-picker-wrap">
        <input type="color" id="color-picker" value="#5b9dff">
      </div>
      <div class="hint">Current: <span id="hex">#5b9dff</span></div>
    </div>

    <div class="tool-group">
      <span class="label">Palette</span>
      <div class="palette" id="palette"></div>
    </div>

    <div class="tool-group">
      <span class="label">Canvas Size</span>
      <div class="size-input">
        <input type="number" id="size-w" value="32" min="1" max="512">
        <span>×</span>
        <input type="number" id="size-h" value="32" min="1" max="512">
        <span>px</span>
        <button class="ctl" id="btn-apply">Apply</button>
      </div>
      <div class="hint">Presets: 16×16, 32×32, 64×64.</div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- Config ----
  var PALETTE = [
    "#000000", "#1d2b53", "#7e2553", "#008751",
    "#ab5236", "#ff99aa", "#ffec27", "#cf0000",
    "#00b4d6", "#0090ff", "#a6ff00", "#ff8c42",
    "#ffffff", "#c7d5dd", "#808080", "#4a4a4a"
  ];

  // ---- State ----
  var W = 32, H = 32;
  var currentTool = "brush";
  var currentColor = "#5b9dff";
  var pixelData = null; // WxH RGBA Uint8ClampedArray
  var displayScale = 1;

  var undoStack = [];
  var redoStack = [];
  var MAX_UNDO = 60;

  var paintDirty = true; // need to re-render to display canvas

  // ---- Elements ----
  var canvas = document.getElementById("display");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  var sizeWEl = document.getElementById("size-w");
  var sizeHEl = document.getElementById("size-h");
  var hexEl = document.getElementById("hex");

  // ---- Pixel data helpers ----
  function newPixelData(w, h) {
    return new Uint8ClampedArray(w * h * 4);
  }

  function index(x, y) {
    return (y * W + x) * 4;
  }

  function setPixel(x, y, rgba) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var i = index(x, y);
    pixelData[i] = rgba[0];
    pixelData[i + 1] = rgba[1];
    pixelData[i + 2] = rgba[2];
    pixelData[i + 3] = rgba[3];
  }

  function getPixel(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    var i = index(x, y);
    return [pixelData[i], pixelData[i + 1], pixelData[i + 2], pixelData[i + 3]];
  }

  function hexToRGBA(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b, 255];
  }

  var ERASOR = [0, 0, 0, 0];

  // ---- Rendering ----
  function applySize(w, h) {
    W = Math.max(1, Math.min(512, w | 0));
    H = Math.max(1, Math.min(512, h | 0));
    pixelData = newPixelData(W, H);
    undoStack = [];
    redoStack = [];
    paintDirty = true;
    fitDisplay();
    render();
  }

  function fitDisplay() {
    // Choose a scale so the pixel canvas fits nicely in the viewport.
    var maxW = Math.floor(document.querySelector(".canvas-wrap").clientWidth - 48);
    var maxH = Math.floor(document.querySelector(".canvas-wrap").clientHeight - 48);
    maxW = Math.max(64, maxW);
    maxH = Math.max(64, maxH);
    var scale = Math.max(1, Math.min(Math.floor(maxW / W), Math.floor(maxH / H)));
    displayScale = Math.min(scale, 64);
    if (displayScale < 1) displayScale = 1;
    canvas.width = W * displayScale;
    canvas.height = H * displayScale;
    canvas.style.width = canvas.width + "px";
    canvas.style.height = canvas.height + "px";
  }

  function render() {
    var imgData = ctx.createImageData(W, H);
    imgData.set(pixelData);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(makeSourceImage(imgData), 0, 0, canvas.width, canvas.height);
    drawGrid();
    paintDirty = false;
  }

  // Build an ImageSource (offscreen canvas) for crisp nearest-neighbor scaling.
  var srcCanvas = document.createElement("canvas");
  var srcCtx = srcCanvas.getContext("2d");
  function makeSourceImage(imgData) {
    srcCanvas.width = W;
    srcCanvas.height = H;
    srcCtx.putImageData(imgData, 0, 0);
    return srcCanvas;
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.10)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    var s = displayScale;
    for (var x = 1; x < W; x++) {
      ctx.moveTo(x * s + 0.5, 0);
      ctx.lineTo(x * s + 0.5, H * s);
    }
    for (var y = 1; y < H; y++) {
      ctx.moveTo(0, y * s + 0.5);
      ctx.lineTo(W * s, y * s + 0.5);
    }
    ctx.stroke();
    // border
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W * s - 1, H * s - 1);
    ctx.restore();
  }

  // ---- Painting ----
  function sampleEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var px = (e.clientX - rect.left) * scaleX;
    var py = (e.clientY - rect.top) * scaleY;
    var gx = Math.floor(px / displayScale);
    var gy = Math.floor(py / displayScale);
    return { x: gx, y: gy, inside: gx >= 0 && gy >= 0 && gx < W && gy < H };
  }

  function paintAt(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var rgba = currentTool === "eraser" ? ERASOR : hexToRGBA(currentColor);
    setPixel(x, y, rgba);
  }

  function pushUndo() {
    undoStack.push(Uint8ClampedArray.from(pixelData));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    paintDirty = true;
  }

  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(Uint8ClampedArray.from(pixelData));
    pixelData = undoStack.pop();
    paintDirty = true;
    render();
  }

  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(Uint8ClampedArray.from(pixelData));
    pixelData = redoStack.pop();
    paintDirty = true;
    render();
  }

  // ---- Pointer drawing with drag support ----
  var painting = false;
  var lastCell = null;

  function startPaint(e) {
    if (e.button !== undefined && e.pointerType === "mouse" && e.button !== 0) return;
    painting = true;
    lastCell = null;
    var p = sampleEvent(e);
    if (p.inside) {
      pushUndo();
      paintAt(p.x, p.y);
      lastCell = { x: p.x, y: p.y };
      paintDirty = true;
      render();
    }
    e.preventDefault();
  }

  function movePaint(e) {
    if (!painting) return;
    var p = sampleEvent(e);
    if (!p.inside) { lastCell = null; return; }
    var cx = p.x, cy = p.y;
    if (lastCell && (cx !== lastCell.x || cy !== lastCell.y)) {
      // interpolate along the line so fast drags don't leave gaps
      var dx = Math.abs(cx - lastCell.x);
      var dy = Math.abs(cy - lastCell.y);
      var steps = Math.max(dx, dy);
      for (var i = 1; i <= steps; i++) {
        var tx = Math.round(lastCell.x + (cx - lastCell.x) * (i / steps));
        var ty = Math.round(lastCell.y + (cy - lastCell.y) * (i / steps));
        paintAt(tx, ty);
      }
      lastCell = { x: cx, y: cy };
      paintDirty = true;
    }
    if (paintDirty) render();
  }

  function endPaint() {
    if (!painting) return;
    painting = false;
    lastCell = null;
  }

  // ---- Pointer events (mouse + touch unified) ----
  canvas.addEventListener("pointerdown", startPaint);
  window.addEventListener("pointermove", movePaint);
  window.addEventListener("pointerup", endPaint);
  window.addEventListener("pointercancel", endPaint);
  // Prevent context menu on long-press (touch)
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // Prevent scrolling while drawing on touch
  canvas.addEventListener("touchstart", function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

  // ---- Pointer capture for smooth drag outside canvas ----
  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
  });

  // ---- Palette build ----
  var paletteEl = document.getElementById("palette");
  function buildPalette() {
    paletteEl.innerHTML = "";
    PALETTE.forEach(function (color) {
      var sw = document.createElement("div");
      sw.className = "swatch";
      sw.style.backgroundColor = color;
      sw.title = color;
      sw.addEventListener("click", function () {
        selectColor(color);
      });
      paletteEl.appendChild(sw);
    });
    updateSwatchActive();
  }

  function selectColor(color) {
    currentColor = color;
    if (currentTool === "eraser") {
      // switching color exits eraser
      selectTool("brush");
    }
    document.getElementById("color-picker").value = color;
    hexEl.textContent = color;
    updateSwatchActive();
  }

  function updateSwatchActive() {
    var swatches = paletteEl.children;
    for (var i = 0; i < swatches.length; i++) {
      var c = swatches[i].style.backgroundColor;
      // normalize hex compare
      swatches[i].classList.toggle("active", normalizeHex(c) === currentColor.toLowerCase());
    }
  }

  function normalizeHex(c) {
    // canvas returns rgb() or rgba(); convert to #hex
    if (c.charAt(0) === "#") return c.toLowerCase();
    var m = c.match(/\d+/g);
    if (!m) return c;
    return "#" + ((1 << 24) + (parseInt(m[0]) << 16) + (parseInt(m[1]) << 8) + parseInt(m[2])).toString(16).slice(1);
  }

  // ---- Color picker ----
  document.getElementById("color-picker").addEventListener("input", function (e) {
    selectColor(e.target.value.toUpperCase());
  });

  // ---- Tools ----
  function selectTool(tool) {
    currentTool = tool;
    var buttons = document.querySelectorAll("button.tool");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("active", buttons[i].dataset.tool === tool);
    }
    canvas.style.cursor = tool === "eraser" ? "cell" : "crosshair";
  }

  document.querySelectorAll("button.tool").forEach(function (btn) {
    btn.addEventListener("click", function () {
      selectTool(btn.dataset.tool);
    });
  });

  // ---- Undo / Redo buttons ----
  document.getElementById("btn-undo").addEventListener("click", undo);
  document.getElementById("btn-redo").addEventListener("click", redo);

  // ---- Clear ----
  document.getElementById("btn-clear").addEventListener("click", function () {
    if (confirm("Clear the entire canvas? This cannot be undone.")) {
      pushUndo();
      pixelData = newPixelData(W, H);
      paintDirty = true;
      render();
    }
  });

  // ---- Apply size ----
  document.getElementById("btn-apply").addEventListener("click", function () {
    var w = parseInt(sizeWEl.value, 10);
    var h = parseInt(sizeHEl.value, 10);
    if (isNaN(w) || isNaN(h) || w < 1 || h < 1) {
      alert("Please enter valid positive dimensions.");
      return;
    }
    if (w > 512 || h > 512) {
      alert("Maximum canvas size is 512×512.");
      return;
    }
    var hasContent = false;
    for (var i = 3; i < pixelData.length; i += 4) {
      if (pixelData[i + 3] > 0) { hasContent = true; break; }
    }
    var msg = "Change canvas size to " + w + "×" + h + "?\n\nThis will clear the canvas.";
    if (hasContent) {
      msg = "Changing canvas size will CLEAR the current artwork.\n\nNew size: " + w + "×" + h + " (current canvas will be erased).";
      if (!confirm(msg)) return;
    }
    applySize(w, h);
  });

  // ---- Export ----
  document.getElementById("btn-export").addEventListener("click", function () {
    var exportCanvas = document.createElement("canvas");
    exportCanvas.width = W;
    exportCanvas.height = H;
    var ectx = exportCanvas.getContext("2d");
    var img = ectx.createImageData(W, H);
    img.set(pixelData);
    ectx.putImageData(img, 0, 0);
    var url = exportCanvas.toDataURL("image/png");
    var a = document.createElement("a");
    a.href = url;
    a.download = "pixel-art-" + W + "x" + H + ".png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  // ---- Keyboard shortcuts ----
  window.addEventListener("keydown", function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    var key = e.key.toLowerCase();
    if (key === "z") {
      if (e.shiftKey) { e.preventDefault(); redo(); }
      else { e.preventDefault(); undo(); }
    } else if (key === "y") {
      if (e.shiftKey) return; // let browser handle default
      e.preventDefault(); redo();
    }
  });

  // ---- Resize handling ----
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      fitDisplay();
      render();
    }, 150);
  });

  // ---- Init ----
  buildPalette();
  applySize(32, 32);
  selectTool("brush");

})();
</script>
</body>
</html>

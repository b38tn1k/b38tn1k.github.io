<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Painter</title>
<style>
  :root {
    --bg: #1e1e24;
    --panel: #2a2a33;
    --panel2: #33333d;
    --accent: #6c8cff;
    --accent2: #4a63d6;
    --text: #e8e8ef;
    --muted: #9a9aa8;
    --border: #3d3d48;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #app { display: flex; height: 100%; }

  /* Toolbar */
  #toolbar {
    width: 280px; min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto; padding: 12px;
    gap: 14px;
  }
  #toolbar h1 {
    font-size: 18px; margin: 0; font-weight: 700;
    letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 8px;
  }
  #toolbar h1 .logo {
    width: 20px; height: 20px; border-radius: 4px;
    background: conic-gradient(from 45deg, #6c8cff 25%, #ff6c9d 25% 50%, #6cffc4 50% 75%, #ffd36c 75%);
  }
  .section {
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px;
  }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); margin: 0 0 8px; font-weight: 600;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  label.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  label.field input[type=number] {
    width: 64px; background: #1e1e24; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 14px;
    text-align: center;
  }
  .sep { width: 10px; height: 100%; align-self: center; color: var(--muted); text-align: center; }

  button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
    user-select: none;
  }
  button:hover { background: #3d3d48; }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent2); border-color: var(--accent2); }
  button.primary:hover { background: var(--accent); }

  .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .btn-icon { justify-content: center; flex: 1; }

  /* Palette */
  #palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .swatch {
    aspect-ratio: 1; border-radius: 4px; cursor: pointer;
    border: 2px solid transparent; overflow: hidden; position: relative;
  }
  .swatch:hover { border-color: #fff; }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .swatch .half { position: absolute; inset: 0; }
  .swatch .half.b { bottom: 0; right: 0; width: 50%; height: 50%; }

  #currentColor {
    width: 44px; height: 44px; border-radius: 8px;
    border: 2px solid var(--border); cursor: pointer; overflow: hidden;
  }
  #currentColor input {
    position: absolute; inset: -10px; width: 60px; height: 60px;
    cursor: pointer; opacity: 0;
  }

  /* Tools */
  .tool-btns { display: flex; gap: 6px; }
  .tool-btns button { flex: 1; justify-content: center; }
  .tool-btns button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Canvas area */
  #stage {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background:
      linear-gradient(45deg, #26262c 25%, transparent 25%),
      linear-gradient(-45deg, #26262c 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #26262c 75%),
      linear-gradient(-45deg, transparent 75%, #26262c 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    background-color: #1a1a1f;
  }
  #canvasWrap {
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  #artCanvas { display: block; image-rendering: pixelated; background: transparent; }
  #overlay {
    position: absolute; inset: 0;
    background-size: 100% 100%;
    pointer-events: none;
  }
  #checker {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(45deg, #cccc 25%, transparent 25%),
      linear-gradient(-45deg, #cccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #cccc 75%),
      linear-gradient(-45deg, transparent 75%, #cccc 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    opacity: 0; transition: opacity 0.15s;
  }

  /* Status bar */
  #status {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(0,0,0,0.6); color: var(--text);
    padding: 4px 10px; border-radius: 6px; font-size: 12px;
    display: flex; gap: 12px; pointer-events: none;
    backdrop-filter: blur(4px);
  }
  #status span { color: var(--muted); }

  /* Zoom controls */
  #zoomControls {
    position: absolute; bottom: 8px; right: 8px;
    display: flex; gap: 4px; background: rgba(0,0,0,0.6);
    padding: 4px; border-radius: 6px;
  }
  #zoomControls button {
    background: transparent; border: none; color: var(--text);
    padding: 4px 10px; font-size: 16px; font-weight: 700;
  }
  #zoomControls button:hover { background: rgba(255,255,255,0.12); }
  #zoomBtns label { display: inline; }

  .hint { font-size: 11px; color: var(--muted); line-height: 1.4; margin-top: 6px; }

  /* Modal */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 100;
    backdrop-filter: blur(2px);
  }
  #modal.show { display: flex; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-box h3 { margin: 0 0 14px; font-size: 16px; }
  .modal-box .row { margin-bottom: 12px; }
  .modal-box label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  .modal-box input[type=number] {
    width: 100%; background: #1e1e24; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 8px; font-size: 14px;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  @media (max-width: 720px) {
    #toolbar { width: 220px; min-width: 220px; padding: 8px; gap: 10px; }
    #palette { grid-template-columns: repeat(6, 1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1><span class="logo"></span> Pixel Painter</h1>

    <div class="section">
      <h2>Canvas Size</h2>
      <div class="row">
        <label class="field">Width
          <input type="number" id="widthInput" value="32" min="1" max="512">
        </label>
        <span class="sep">✕</span>
        <label class="field">Height
          <input type="number" id="heightInput" value="32" min="1" max="512">
        </label>
      </div>
      <div class="row wrap" style="margin-top:8px;">
        <button id="presetSquare">Square</button>
        <button id="presetPortrait">Portrait</button>
        <button id="presetLandscape">Landscape</button>
        <button id="presetCustom" class="primary">Apply</button>
      </div>
    </div>

    <div class="section">
      <h2>Tools</h2>
      <div class="tool-btns">
        <button id="toolBrush" class="tool-btn active" title="Brush (B)">🖌️ Brush</button>
        <button id="toolFill" class="tool-btn" title="Fill bucket (G)">🪣 Fill</button>
        <button id="toolEraser" class="tool-btn" title="Eraser (E)">🧽 Eraser</button>
        <button id="toolEyedropper" class="tool-btn" title="Picker (I)">💧 Pick</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <label class="field" style="flex:1;">Brush size
          <input type="range" id="brushSize" min="1" max="8" value="1">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Current Color</h2>
      <div class="row">
        <div id="currentColor" style="background:#000000;"></div>
        <input type="text" id="hexInput" value="#000000" style="background:#1e1e24;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:14px;width:90px;">
        <input type="color" id="colorPicker" value="#000000" style="position:absolute;left:-9999px;">
      </div>
    </div>

    <div class="section">
      <h2>Palette</h2>
      <div id="palette"></div>
      <div class="hint">Click to pick. Click the current color to enter a custom hex.</div>
    </div>

    <div class="section">
      <h2>Actions</h2>
      <div class="btn-grid">
        <button id="undoBtn" class="btn-icon">↶ Undo</button>
        <button id="redoBtn" class="btn-icon">↷ Redo</button>
        <button id="clearBtn" class="btn-icon">🗑️ Clear</button>
        <button id="exportBtn" class="btn-icon primary">⬇️ Export PNG</button>
      </div>
      <div class="hint">Undo/Redo (Ctrl/Cmd+Z / Shift+Ctrl+Z). Scroll to zoom.</div>
    </div>
  </div>

  <div id="stage">
    <div id="canvasWrap">
      <canvas id="artCanvas"></canvas>
      <div id="overlay"></div>
      <div id="checker"></div>
    </div>
    <div id="status">
      <span id="statusSize">32 × 32</span>
      <span id="statusPos">0, 0</span>
      <span id="statusTool">Brush</span>
    </div>
    <div id="zoomControls">
      <button id="zoomOut">−</button>
      <button id="zoomReset">100%</button>
      <button id="zoomIn">+</button>
    </div>
  </div>
</div>

<div id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">New Canvas</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- State ----------
  const canvas = document.getElementById("artCanvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  const overlay = document.getElementById("overlay");
  const checker = document.getElementById("checker");

  let W = 32, H = 32;
  let zoom = 20;              // display scale factor (px per pixel)
  let tool = "brush";
  let color = "#000000";
  let brushSize = 1;
  let erasing = false;

  // undo/redo stacks store DataURL snapshots of the full canvas
  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 60;
  let suppressHistory = false;

  // ---------- Default palette (8x4 grid with 2-color swatches) ----------
  const PALETTE = [
    "#000000","#413c51","#5b3a52","#873c57","#a53b4f","#d55f69","#f0a1a0","#ffffff",
    "#2f2a3a","#6b5883","#934b6d","#c14a5f","#e05a52","#ff8c7a","#ffc7a0","#f7e9d5",
    "#183a18","#3f6b2f","#5a9e3b","#8bc34a","#c0d14a","#e2d674","#f0e18c","#fdf6c4",
    "#143643","#1f5c6b","#2f8da0","#4aa3c7","#5fb0d6","#9cc7dd","#c8e0ec","#eef8fb",
    "#2c1f4d","#4a2f86","#6b3fb5","#8a4fe0","#b16ee6","#d19cff","#e9bcf2","#f8ecff",
    "#4d1f1f","#863a2f","#c05a2f","#e07a2f","#f0a14a","#ffca6c","#ffdfa0","#ffeec4",
    "#3a2f2f","#6b5340","#9e7a4a","#c39b5a","#d6b56c","#e8d18c","#f4e6b0","#fdf6e3",
    "#1f3a4d","#2f6b86","#3f9ec0","#5abfe0","#74d1e8","#a3e2ee","#d1f2f8","#f2fbfd",
  ];

  // ---------- Element refs ----------
  const $ = (id) => document.getElementById(id);
  const widthInput = $("widthInput");
  const heightInput = $("heightInput");

  // ---------- Canvas setup ----------
  function resizeCanvas(w, h) {
    W = Math.max(1, Math.min(512, w | 0));
    H = Math.max(1, Math.min(512, h | 0));
    const prevData = (W !== canvas.width || H !== canvas.height)
      ? ctx.getImageData(0, 0, Math.min(W, canvas.width), Math.min(H, canvas.height))
      : null;

    canvas.width = W;
    canvas.height = H;
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = "#00000000";
    ctx.clearRect(0, 0, W, H);

    // copy old pixels where they fit
    if (prevData) {
      ctx.putData(prevData, 0, 0);
    }
    render();
  }

  function render() {
    canvas.style.width = W * zoom + "px";
    canvas.style.height = H * zoom + "px";
    overlay.style.width = canvas.style.width;
    overlay.style.height = canvas.style.height;
    overlay.style.backgroundImage = "none";
    checker.style.width = canvas.style.width;
    checker.style.height = canvas.style.height;
    $("statusSize").textContent = W + " × " + H;
    applyChecker();
  }

  function applyChecker() {
    // show checkerboard overlay when eraser mode is on
    checker.style.opacity = erasing ? "1" : "0";
  }

  // ---------- History ----------
  function snapshot() {
    return canvas.toDataURL("image/png");
  }
  function pushHistory() {
    if (suppressHistory) return;
    const s = snapshot();
    undoStack.push(s);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(snapshot());
    loadSnapshot(undoStack.pop());
    updateHistoryButtons();
  }
  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(snapshot());
    loadSnapshot(redoStack.pop());
    updateHistoryButtons();
  }
  function loadDataURL(url) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(img, 0, 0);
      render();
    };
    img.src = url;
  }
  function loadSnapshot(url) {
    suppressHistory = true;
    loadDataURL(url);
    suppressHistory = false;
  }
  function updateHistoryButtons() {
    $("undoBtn").disabled = undoStack.length === 0;
    $("redoBtn").disabled = redoStack.length === 0;
  }

  // ---------- Pixel operations ----------
  function clearCanvas() {
    pushHistory();
    ctx.clearRect(0, 0, W, H);
    render();
  }

  function setPixel(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    if (erasing) {
      ctx.clearRect(x, y, 1, 1);
    } else if (tool === "brush") {
      const r = brushSize - 1;
      ctx.fillStyle = color;
      ctx.fillRect(x - r, y - r, brushSize, brushSize);
    }
  }

  function floodFill(sx, sy) {
    sx = Math.floor(sx); sy = Math.floor(sy);
    if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;
    const idx = (sy * W + sx) * 4;
    const target = [data[idx], data[idx+1], data[idx+2], data[idx+3]];
    const c = hexToRgb(color);
    if (target[0] === c.r && target[1] === c.g && target[2] === c.b && target[3] === 255) return;

    const stack = [[sx, sy]];
    const matches = (ix, iy) => {
      const i = (iy * W + ix) * 4;
      return data[i] === target[0] && data[i+1] === target[1] && data[i+2] === target[2] && data[i+3] === target[3];
    };
    while (stack.length) {
      const [px, py] = stack.pop();
      if (px < 0 || py < 0 || px >= W || py >= H) continue;
      if (!matches(px, py)) continue;
      const i = (py * W + px) * 4;
      data[i] = c.r; data[i+1] = c.g; data[i+2] = c.b; data[i+3] = 255;
      stack.push([px+1, py], [px-1, py], [px, py+1], [px, py-1]);
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function pickAt(x, y) {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const d = ctx.getImageData(x, y, 1, 1).data;
    const hex = "#" + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, "0")).join("");
    setColor(hex);
  }

  // ---------- Drawing events ----------
  let painting = false;
  let lastPos = null;

  function getCanvasPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    let clientX, clientY;
    if (evt.touches && evt.touches.length) {
      clientX = evt.touches[0].clientX; clientY = evt.touches[0].clientY;
    } else if (evt.changedTouches && evt.changedTouches.length) {
      clientX = evt.changedTouches[0].clientX; clientY = evt.changedTouches[0].clientY;
    } else {
      clientX = evt.clientX; clientY = evt.clientY;
    }
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function lerpPixels(p0, p1) {
    // smooth line between two points for fast drags
    const dx = Math.abs(p1.x - p0.x);
    const dy = Math.abs(p1.y - p0.y);
    const steps = Math.max(dx, dy);
    if (steps === 0) { setPixel(p1.x, p1.y); return; }
    for (let t = 0; t <= steps; t++) {
      const u = t / steps;
      setPixel(p0.x + (p1.x - p0.x) * u, p0.y + (p1.y - p0.y) * u);
    }
  }

  function startDraw(evt) {
    evt.preventDefault();
    const p = getCanvasPos(evt);
    const x = Math.floor(p.x), y = Math.floor(p.y);

    if (tool === "eyedropper") { pickAt(p.x, p.y); return; }
    if (tool === "fill") { pushHistory(); floodFill(p.x, p.y); render(); return; }

    painting = true;
    erasing = (tool === "eraser");
    applyChecker();
    lastPos = p;
    setPixel(p.x, p.y);
    render();
  }

  function moveDraw(evt) {
    const p = getCanvasPos(evt);
    $("statusPos").textContent = Math.floor(p.x) + ", " + Math.floor(p.y);
    if (!painting) return;
    evt.preventDefault();
    lerpPixels(lastPos, p);
    lastPos = p;
  }

  function endDraw(evt) {
    if (!painting) return;
    evt.preventDefault();
    painting = false;
    lastPos = null;
    erasing = false;
    applyChecker();
  }

  canvas.addEventListener("mousedown", startDraw);
  window.addEventListener("mousemove", moveDraw);
  window.addEventListener("mouseup", endDraw);

  canvas.addEventListener("touchstart", startDraw, { passive: false });
  window.addEventListener("touchmove", moveDraw, { passive: false });
  window.addEventListener("touchend", endDraw, { passive: false });
  window.addEventListener("touchcancel", endDraw, { passive: false });

  // prevent context menu on long-press
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---------- Zoom ----------
  function setZoom(z) {
    zoom = Math.max(2, Math.min(60, Math.round(z)));
    render();
    $("zoomReset").textContent = zoom + "%";
  }
  canvas.parentElement.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
    setZoom(zoom * factor);
  }, { passive: false });

  $("zoomIn").onclick = () => setZoom(zoom * 1.2);
  $("zoomOut").onclick = () => setZoom(zoom / 1.2);
  $("zoomReset").onclick = () => setZoom(20);

  // ---------- Color handling ----------
  function setColor(hex) {
    if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
    color = hex.toLowerCase();
    $("currentColor").style.background = color;
    $("hexInput").value = color;
    $("colorPicker").value = color;
    syncActiveSwatch();
  }

  function syncActiveSwatch() {
    document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
    // highlight swatch if color matches
    const low = color.toLowerCase();
    // build flat list of single colors from palette (ignore 2-color swatches match)
    PALETTE.forEach((p, i) => {
      // only solid swatches (those without .b)
    });
  }

  function buildPalette() {
    const pal = $("palette");
    pal.innerHTML = "";
    PALETTE.forEach((hex) => {
      const div = document.createElement("div");
      div.className = "swatch";
      div.style.background = hex;
      div.dataset.hex = hex;
      div.title = hex;
      div.addEventListener("click", () => setColor(hex));
      pal.appendChild(div);
    });
  }

  $("currentColor").addEventListener("click", () => $("colorPicker").click());
  $("colorPicker").addEventListener("input", (e) => setColor(e.target.value));
  $("hexInput").addEventListener("change", (e) => setColor(e.target.value));
  $("hexInput").addEventListener("input", (e) => {
    const v = e.target.value;
    $("currentColor").style.background = v.startsWith("#") ? v : "#000000";
  });

  // ---------- Tools ----------
  const toolButtons = {
    brush: $("toolBrush"),
    fill: $("toolFill"),
    eraser: $("toolEraser"),
    eyedropper: $("toolEyedropper"),
  };
  const toolNames = { brush: "Brush", fill: "Fill", eraser: "Eraser", eyedropper: "Picker" };

  function selectTool(t) {
    tool = t;
    erasing = (t === "eraser");
    Object.values(toolButtons).forEach(b => b.classList.remove("active"));
    toolButtons[t].classList.add("active");
    $("statusTool").textContent = toolNames[t];
    applyChecker();
    canvas.style.cursor = (t === "eyedropper") ? "crosshair" : (t === "eraser" ? "cell" : "pointer");
  }

  Object.entries(toolButtons).forEach(([t, el]) => {
    el.addEventListener("click", () => selectTool(t));
  });

  $("brushSize").addEventListener("input", (e) => { brushSize = parseInt(e.target.value, 10); });

  // ---------- Canvas size / new modal ----------
  let modalMode = null;

  function openSizeModal(isResize) {
    modalMode = isResize ? "resize" : "new";
    $("modalTitle").textContent = isResize ? "Resize Canvas" : "New Canvas";
    const body = $("modalBody");
    body.innerHTML = `
      <label>Width (pixels, 1–512)</label>
      <div class="row"><input type="number" id="mWidth" min="1" max="512" value="${W}"><span class="sep">✕</span>
      <label style="margin:0;">Height</label>
      <input type="number" id="mHeight" min="1" max="512" value="${H}"></div>
      <div class="hint">${isResize ? "Existing art is preserved where it fits." : "This clears the current canvas."}</div>
    `;
    $("modal").classList.add("show");
    setTimeout(() => body.querySelector("input").focus(), 50);
  }

  $("presetSquare").onclick = () => { openSizeModal(false); const s = Math.max(8, W, H); $("mWidth").value = s; $("mHeight").value = s; };
  $("presetPortrait").onclick = () => { openSizeModal(false); $("mWidth").value = Math.round(W); $("mHeight").value = Math.round(H * 1.5); };
  $("presetLandscape").onclick = () => { openSizeModal(false); $("mWidth").value = Math.round(W * 1.5); $("mHeight").value = Math.round(H); };
  $("presetCustom").onclick = () => {
    pushHistory();
    resizeCanvas(+widthInput.value || 1, +heightInput.value || 1);
  };
  $("modalCancel").onclick = () => $("modal").classList.remove("show");
  $("modalOk").onclick = () => {
    const w = +$("mWidth").value, h = +$("mHeight").value;
    $("modal").classList.remove("show");
    if (modalMode === "new") {
      pushHistory();
      clearCanvas();
      resizeCanvas(w, h);
    } else {
      resizeCanvas(w, h);
    }
    widthInput.value = W; heightInput.value = H;
  };
  $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("show"); });

  widthInput.addEventListener("change", () => { widthInput.value = Math.max(1, Math.min(512, +widthInput.value || 1)); });
  heightInput.addEventListener("change", () => { heightInput.value = Math.max(1, Math.min(512, +heightInput.value || 1)); });

  // ---------- Actions ----------
  $("undoBtn").onclick = undo;
  $("redoBtn").onclick = redo;
  $("clearBtn").onclick = () => {
    showModalConfirm("Clear Canvas", "Clear the entire canvas?", () => {
      pushHistory();
      clearCanvas();
    });
  };
  $("exportBtn").onclick = () => {
    const link = document.createElement("a");
    link.download = "pixel-art-" + W + "x" + H + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  };

  function showModalConfirm(title, msg, onOk) {
    $("modalTitle").textContent = title;
    $("modalBody").innerHTML = `<p style="margin:0 0 12px;font-size:14px;color:var(--text);">${msg}</p>`;
    $("modalOk").onclick = () => { $("modal").classList.remove("show"); $("modalOk").onclick = null; onOk(); };
    $("modal").classList.add("show");
  }

  // ---------- Keyboard shortcuts ----------
  window.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === "z") { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (mod && e.key === "y") { e.preventDefault(); redo(); }
    else if (e.key === "b" || e.key === "B") selectTool("brush");
    else if (e.key === "g" || e.key === "G") selectTool("fill");
    else if (e.key === "e" || e.key === "E") selectTool("eraser");
    else if (e.key === "i" || e.key === "I") selectTool("eyedropper");
    else if (e.key === "[") setZoom(zoom / 1.2);
    else if (e.key === "]") setZoom(zoom * 1.2);
  });

  // ---------- Init ----------
  function init() {
    buildPalette();
    resizeCanvas(32, 32);
    setColor("#000000");
    selectTool("brush");
    setZoom(20);
    pushHistory();
    updateHistoryButtons();
  }
  init();
})();
</script>
</body>
</html>

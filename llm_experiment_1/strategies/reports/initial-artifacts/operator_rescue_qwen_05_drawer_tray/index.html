<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawer Organizer Tray Maker</title>
<style>
  :root {
    --bg-primary: #1a1a2e;
    --bg-secondary: #16213e;
    --bg-panel: #0f3460;
    --accent: #e94560;
    --accent-hover: #ff6b81;
    --text-primary: #eee;
    --text-secondary: #aab;
    --border-color: #2a3a5c;
    --input-bg: #0d2137;
    --table-stripe: #1a2d4e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Title bar */
  #title-bar {
    background: var(--bg-secondary);
    border-bottom: 2px solid var(--accent);
    padding: 10px 24px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    user-select: none;
  }

  #title-bar .icon { font-size: 22px; }

  /* Main area */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left panel */
  #controls-panel {
    width: 340px;
    min-width: 320px;
    max-width: 400px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex-shrink: 0;
  }

  #controls-panel::-webkit-scrollbar { width: 6px; }
  #controls-panel::-webkit-scrollbar-track { background: transparent; }
  #controls-panel::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .param-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .param-row label {
    flex: 0 0 90px;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: right;
  }

  .param-row input[type="number"] {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 7px 10px;
    font-size: 14px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    outline: none;
    transition: border-color 0.2s;
    width: 0;
  }

  .param-row input[type="number"]:focus {
    border-color: var(--accent);
  }

  .param-row .unit {
    font-size: 12px;
    color: var(--text-secondary);
    min-width: 28px;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

  .btn-secondary {
    background: var(--bg-panel);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }
  .btn-secondary:hover { background: #1a4a80; transform: translateY(-1px); }

  /* Table */
  .data-table-wrap {
    background: var(--bg-panel);
    border-radius: 8px;
    overflow: hidden;
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  table.data-table thead th {
    background: rgba(0,0,0,0.25);
    padding: 8px 10px;
    text-align: left;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 1px solid var(--border-color);
  }

  table.data-table tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: var(--text-primary);
  }

  table.data-table tbody tr:nth-child(even) td {
    background: rgba(255,255,255,0.03);
  }

  table.data-table tbody td:first-child {
    color: var(--text-secondary);
    font-family: inherit;
  }

  /* Warning */
  .warning {
    background: #3d2a00;
    border: 1px solid #8a6a00;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    color: #f0c040;
    display: none;
  }
  .warning.visible { display: block; }

  /* Right panel — 3D canvas */
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, #0a0a1a 0%, #121830 100%);
  }

  #viewport canvas { display: block; }

  #canvas-label {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    pointer-events: none;
    user-select: none;
  }

  /* Status bar */
  #status-bar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-secondary);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }

  #status-bar.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="title-bar">
    <span class="icon">📦</span>
    Drawer Organizer Tray Maker
  </div>
  <div id="main">
    <div id="controls-panel">
      <!-- Input parameters -->
      <div>
        <div class="section-title">Outer Dimensions (mm)</div>
        <div class="param-row">
          <label for="outerL">Length</label>
          <input type="number" id="outerL" min="20" max="1000" step="1" value="180">
          <span class="unit">mm</span>
        </div>
        <div class="param-row">
          <label for="outerW">Width</label>
          <input type="number" id="outerW" min="20" max="1000" step="1" value="120">
          <span class="unit">mm</span>
        </div>
        <div class="param-row">
          <label for="outerH">Height</label>
          <input type="number" id="outerH" min="5" max="300" step="1" value="30">
          <span class="unit">mm</span>
        </div>
      </div>

      <div>
        <div class="section-title">Grid Layout</div>
        <div class="param-row">
          <label for="columns">Columns</label>
          <input type="number" id="columns" min="1" max="50" step="1" value="3">
        </div>
        <div class="param-row">
          <label for="rows">Rows</label>
          <input type="number" id="rows" min="1" max="50" step="1" value="2">
        </div>
      </div>

      <div>
        <div class="section-title">Thickness (mm)</div>
        <div class="param-row">
          <label for="wallT">Wall</label>
          <input type="number" id="wallT" min="0.5" max="50" step="0.5" value="2">
          <span class="unit">mm</span>
        </div>
        <div class="param-row">
          <label for="floorT">Floor</label>
          <input type="number" id="floorT" min="0.5" max="50" step="0.5" value="2">
          <span class="unit">mm</span>
        </div>
      </div>

      <!-- Validation warning -->
      <div id="warningBox" class="warning"></div>

      <!-- STL export -->
      <button class="btn btn-primary" id="exportStlBtn">⬇ Export STL File</button>

      <!-- Computed parameters table -->
      <div>
        <div class="section-title">Computed Parameters</div>
        <div class="data-table-wrap">
          <table class="data-table" id="computedTable">
            <thead><tr><th>Parameter</th><th style="text-align:right">Value</th></tr></thead>
            <tbody id="computedBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Geometry info -->
      <div>
        <div class="section-title">Geometry Breakdown</div>
        <div class="data-table-wrap">
          <table class="data-table" id="geomTable">
            <thead><tr><th>Part</th><th style="text-align:right">Qty</th></tr></thead>
            <tbody id="geomBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 3D Viewport -->
    <div id="viewport">
      <span id="canvas-label">Orbit: left-click &nbsp;|&nbsp; Pan: right-click &nbsp;|&nbsp; Zoom: scroll</span>
      <div id="status-bar"></div>
    </div>
  </div>
</div>

<!-- Three.js + OrbitControls from CDN (jsdelivr) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/examples/js/controls/OrbitControls.js"></script>

<script>
(function() {
  'use strict';

  // ─── DOM references ──────────────────────────────────────
  const $ = id => document.getElementById(id);
  const outerL = $('outerL'), outerW = $('outerW'), outerH = $('outerH');
  const colsEl = $('columns'), rowsEl = $('rows');
  const wallT = $('wallT'), floorT = $('floorT');
  const computedBody = $('computedBody'), geomBody = $('geomBody');
  const warningBox = $('warningBox');
  const exportBtn = $('exportStlBtn');
  const statusBar = $('status-bar');

  // ─── Three.js scene setup ───────────────────────────────
  const viewport = $('viewport');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a0a1a, 1);
  viewport.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  // Camera — perspective with tray fitting
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
  camera.position.set(200, 250, 300);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, -30, 0);

  // Lights
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight1.position.set(200, 300, 200);
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0x99aaff, 0.4);
  dirLight2.position.set(-150, 100, -200);
  scene.add(dirLight2);

  // Grid helper (subtle)
  const gridHelper = new THREE.GridHelper(600, 30, 0x1a2a4a, 0x111830);
  scene.add(gridHelper);

  // Tray material
  const trayMaterial = new THREE.MeshPhongMaterial({
    color: 0x3a7bd5,
    specular: 0x4488ff,
    shininess: 40,
    flatShading: false,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.92,
  });

  // Container for tray mesh
  let trayGroup = new THREE.Group();
  scene.add(trayGroup);

  // ─── Helpers ─────────────────────────────────────────────
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function showStatus(msg) {
    statusBar.textContent = msg;
    statusBar.classList.add('show');
    clearTimeout(showStatus._timer);
    showStatus._timer = setTimeout(() => statusBar.classList.remove('show'), 2500);
  }

  // ─── Custom mergeBufferGeometries ──────────────────────
  // Concatenates multiple BoxGeometry (IndexedGeometry) buffers into one BufferGeometry.
  // Handles position + index merging with proper vertex re-indexing.
  function mergeBufferGeometries(geometries) {
    const positions = [];
    const indices = [];
    let indexOffset = 0;

    for (let i = 0; i < geometries.length; i++) {
      const geo = geometries[i];

      // Clone geometry to avoid mutating originals
      const srcGeo = geo.clone();

      // Get position attribute
      const posAttr = srcGeo.getAttribute('position');
      const posArray = posAttr.array;
      const count = posAttr.count;

      // Copy positions: BoxGeometry stores (x,y,z) triples
      const stride = 3;
      for (let j = 0; j < count * stride; j++) {
        positions.push(posArray[j]);
      }

      // Get index attribute (BoxGeometry always has one)
      const idxAttr = srcGeo.getIndex();
      if (idxAttr) {
        const idxArray = idxAttr.array;
        for (let j = 0; j < idxAttr.count; j++) {
          indices.push(idxArray[j] + indexOffset);
        }
      }

      indexOffset += count;
    }

    // Build merged geometry
    const mergedGeo = new THREE.BufferGeometry();

    const posBuffer = new Float32Array(positions);
    mergedGeo.setAttribute('position', new THREE.BufferAttribute(posBuffer, 3));

    if (indices.length > 0) {
      // Determine smallest Uint type
      let idxType;
      const maxIdx = indices.length > 0 ? Math.max(...indices) : 0;
      if (maxIdx < 65535) {
        idxType = new Uint16Array(indices);
      } else {
        idxType = new Uint32Array(indices);
      }
      mergedGeo.setIndex(new THREE.BufferAttribute(idxType, 1));
    }

    // Compute normals
    mergedGeo.computeVertexNormals();

    return mergedGeo;
  }

  // ─── Geometry builder ──────────────────────────────────
  function buildTrayGeometry(outerLength, outerWidth, outerHeight, wallThickness, floorThickness, rows, columns) {
    const geometries = [];

    // BoxGeometry args: (width x, height y, depth z)
    // Helper to create a box at position with given size
    function makeBox(sx, sy, sz, px, py, pz) {
      const geo = new THREE.BoxGeometry(sx, sy, sz);
      geo.translate(px, py, pz);
      return geo;
    }

    // ── Floor (bottom panel) ──
    // Tray bottom is at Y = -outerHeight/2, floor center Y = -outerHeight/2 + floorThickness/2
    const floorCY = -outerHeight / 2 + floorThickness / 2;
    geometries.push(makeBox(outerLength, floorThickness, outerWidth, 0, floorCY, 0));

    // ── Walls ──
    // Wall thickness safety clamp
    const maxWall = Math.min(outerLength / 2 - 1, outerWidth / 2 - 1);
    const effectiveWall = Math.min(wallThickness, maxWall * 0.98);

    // Left wall (parallel to Z): center at X = -outerLength/2 + effWall/2
    geometries.push(makeBox(effectiveWall, outerHeight, outerWidth,
      -outerLength / 2 + effectiveWall / 2, 0, 0));

    // Right wall
    geometries.push(makeBox(effectiveWall, outerHeight, outerWidth,
      outerLength / 2 - effectiveWall / 2, 0, 0));

    // Front wall (parallel to X): center at Z = outerWidth/2 - effWall/2
    geometries.push(makeBox(outerLength - 2 * effectiveWall, outerHeight, effectiveWall,
      0, 0, outerWidth / 2 - effectiveWall / 2));

    // Back wall
    geometries.push(makeBox(outerLength - 2 * effectiveWall, outerHeight, effectiveWall,
      0, 0, -outerWidth / 2 + effectiveWall / 2));

    // ── Grid dividers ──
    const innerLen = outerLength - 2 * effectiveWall;
    const innerWid = outerWidth - 2 * effectiveWall;
    const compartmentL = innerLen / columns;
    const compartmentW = innerWid / rows;

    // Y-aligned dividers (parallel to Z axis): divide along X, spaced by compartmentL
    // Each spans the full inner width (between side walls)
    for (let i = 1; i < columns; i++) {
      const x = -innerLen / 2 + i * compartmentL;
      geometries.push(makeBox(effectiveWall, outerHeight, innerWid,
        x, 0, 0));
    }

    // Z-aligned dividers (parallel to Y axis): divide along Z, spaced by compartmentW
    // Each spans the full inner length (between front and back walls)
    for (let i = 1; i < rows; i++) {
      const z = -innerWid / 2 + i * compartmentW;
      geometries.push(makeBox(innerLen, outerHeight, effectiveWall,
        0, 0, z));
    }

    return mergeBufferGeometries(geometries);
  }

  // ─── Update tray mesh ──────────────────────────────────
  function updateTray() {
    const L = clamp(parseFloat(outerL.value) || 180, 20, 1000);
    const W = clamp(parseFloat(outerW.value) || 120, 20, 1000);
    const H = clamp(parseFloat(outerH.value) || 30, 5, 300);
    let cols = clamp(parseInt(colsEl.value) || 3, 1, 50);
    let rows = clamp(parseInt(rowsEl.value) || 2, 1, 50);
    let wt = clamp(parseFloat(wallT.value) || 2, 0.5, 50);
    let ft = clamp(parseFloat(floorT.value) || 2, 0.5, H - 1);

    // Validate: wallThickness * 2 must be < both outer dimensions (leaving room for compartments)
    const invalidL = wt * 2 >= L;
    const invalidW = wt * 2 >= W;
    if (invalidL || invalidW) {
      warningBox.textContent = `⚠ Wall thickness too large: ${wt*2}mm walls exceed ${invalidL ? 'length' : 'width'} dimension. Reduced automatically.`;
      warningBox.classList.add('visible');
      const maxAllowed = Math.min(L, W);
      wt = clamp(wt, 0.5, (maxAllowed - 4) / 2);
      wallT.value = wt.toFixed(1);
    } else {
      warningBox.classList.remove('visible');
    }

    // Floor thickness can't exceed tray height
    if (ft >= H) {
      ft = clamp(ft, 0.5, H * 0.8);
      floorT.value = ft.toFixed(1);
    }

    // Inner dimensions
    const innerL = L - 2 * wt;
    const innerW = W - 2 * wt;
    const compL = innerL / cols;
    const compW = innerW / rows;
    const compDepth = H - ft;

    // Volume of one compartment
    const compVol = compL * compW * compDepth;
    // Total interior volume (all compartments)
    const totalIntVol = innerL * innerW * (H - ft);

    // ── Build geometry and apply to mesh ──
    trayGroup.clear();

    // Remove old mesh from scene children
    const oldMesh = trayGroup.children[0];
    if (oldMesh) {
      scene.remove(oldMesh);
      oldMesh.geometry.dispose();
    }

    const geo = buildTrayGeometry(L, W, H, wt, ft, rows, cols);
    const mesh = new THREE.Mesh(geo, trayMaterial);
    trayGroup.add(mesh);

    // Center and orient: tray bottom at origin-ish
    // Shift so bottom is near Y=-H/2 (centered around origin for orbit)
    trayGroup.position.set(0, H / 2, 0);

    // Update camera to fit the model
    const maxDim = Math.max(L, W, H);
    const dist = maxDim * 1.5;
    camera.position.set(dist * 0.6, dist * 0.8, dist * 0.6);
    controls.target.set(0, H / 2 - H * 0.3, 0);
    controls.update();

    // ── Update computed table ──
    computedBody.innerHTML = `
      <tr><td>Inner Length</td><td style="text-align:right">${innerL.toFixed(1)} mm</td></tr>
      <tr><td>Inner Width</td><td style="text-align:right">${innerW.toFixed(1)} mm</td></tr>
      <tr><td>Compartment L × W</td><td style="text-align:right">${compL.toFixed(1)} × ${compW.toFixed(1)} mm</td></tr>
      <tr><td>Compartment Depth</td><td style="text-align:right">${compDepth.toFixed(1)} mm</td></tr>
      <tr><td>Total Compartments</td><td style="text-align:right">${rows * cols}</td></tr>
      <tr><td>Interior Volume</td><td style="text-align:right">${totalIntVol.toFixed(0)} mm³</td></tr>
      <tr><td>Overall Footprint</td><td style="text-align:right">${L} × ${W} mm</td></tr>
    `;

    // ── Geometry breakdown table ──
    geomBody.innerHTML = `
      <tr><td>Floor panel</td><td style="text-align:right">1</td></tr>
      <tr><td>Side walls</td><td style="text-align:right">4</td></tr>
      <tr><td>X-parallel dividers</td><td style="text-align:right">${rows - 1}</td></tr>
      <tr><td>Z-parallel dividers</td><td style="text-align:right">${cols - 1}</td></tr>
      <tr><td>Total parts (pre-merge)</td><td style="text-align:right">${4 + 1 + (rows - 1) + (cols - 1)}</td></tr>
    `;

    // Update STL button state
    const vertCount = geo.getAttribute('position').count;
    const idxCount = geo.getIndex ? geo.getIndex().count : vertCount;
    exportBtn.textContent = `⬇ Export STL (${idxCount} faces)`;
  }

  // ─── STL export (ASCII) ────────────────────────────────
  function exportSTL() {
    const oldMesh = trayGroup.children[0];
    if (!oldMesh || !oldMesh.geometry) {
      showStatus('No geometry to export');
      return;
    }

    const geo = oldMesh.geometry;
    const posAttr = geo.getAttribute('position');
    const idxAttr = geo.getIndex();
    const normCalc = new Float32Array(posAttr.count * 3);

    // Compute per-face normals (use vertex positions since geometry isn't subdivided)
    for (let i = 0; i < idxAttr.count; i += 3) {
      const a = idxAttr.array[i] * 3;
      const b = idxAttr.array[i+1] * 3;
      const c = idxAttr.array[i+2] * 3;

      // Face normal via cross product
      const ux = posAttr.array[b] - posAttr.array[a];
      const uy = posAttr.array[b+1] - posAttr.array[a+1];
      const uz = posAttr.array[b+2] - posAttr.array[a+2];
      const vx = posAttr.array[c] - posAttr.array[a];
      const vy = posAttr.array[c+1] - posAttr.array[a+1];
      const vz = posAttr.array[c+2] - posAttr.array[a+2];

      let nx = uy * vz - uz * vy;
      let ny = uz * vx - ux * vz;
      let nz = ux * vy - uy * vx;

      // Normalize
      const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
      if (len > 0) { nx /= len; ny /= len; nz /= len; }

      for (let j = 0; j < 3; j++) {
        normCalc[(i/3 * 3 + j) * 3] = nx;
        normCalc[(i/3 * 3 + j) * 3 + 1] = ny;
        normCalc[(i/3 * 3 + j) * 3 + 2] = nz;
      }
    }

    // Build ASCII STL string
    let stl = 'solid drawer_organizer_tray\n';

    for (let i = 0; i < idxAttr.count; i += 3) {
      const a = idxAttr.array[i];
      const b = idxAttr.array[i+1];
      const c = idxAttr.array[i+2];

      stl += `  facet normal ${normCalc[a*3].toExponential(6)} ${normCalc[a*3+1].toExponential(6)} ${normCalc[a*3+2].toExponential(6)}\n`;
      stl += '    outer loop\n';

      for (const vi of [a, b, c]) {
        stl += `      vertex ${posAttr.array[vi*3].toFixed(4)} ${posAttr.array[vi*3+1].toFixed(4)} ${posAttr.array[vi*3+2].toFixed(4)}\n`;
      }

      stl += '    endloop\n';
      stl += '  endfacet\n';
    }

    stl += 'endsolid drawer_organizer_tray\n';

    // Download
    const blob = new Blob([stl], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tray_${Date.now()}.stl`;
    a.click();
    URL.revokeObjectURL(url);

    showStatus(`Exported STL (${idxAttr.count / 3} facets)`);
  }

  // ─── Event wiring ──────────────────────────────────────
  [outerL, outerW, outerH, colsEl, rowsEl, wallT, floorT].forEach(el => {
    el.addEventListener('input', updateTray);
  });

  exportBtn.addEventListener('click', exportSTL);

  // ─── Resize handling ───────────────────────────────────
  function onResize() {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    if (w === 0 || h === 0) return;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }

  window.addEventListener('resize', onResize);

  // ─── Animation loop ────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  // ─── Init ──────────────────────────────────────────────
  updateTray();
  onResize();
  animate();

})();
</script>
</body>
</html>
